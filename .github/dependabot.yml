# Dependabot — dependency vulnerability + version updates.
#
# Covers what lives in the Gradle dependency graph (the implementation("...")
# declarations in build.gradle.kts) and the GitHub Actions used in workflows.
#
# KNOWN GAP (handled elsewhere, by pinned-artifact-freshness.yml): Dependabot
# does NOT see artifacts that are fetched via hardcoded URLs rather than
# declared as dependencies — mosh4j, the BUNDLED BouncyCastle 1.84 / protobuf
# 4.35.1 copies, Node, Monaco, esbuild — nor SithTermFX (built from a git tag).
version: 2
updates:
  # ---- Gradle: the pinned implementation("group:artifact:version") deps ----
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group routine minor/patch bumps of the crypto/SSH stack into one PR.
      # (Security advisories still open their own dedicated PRs.)
      ssh-crypto:
        patterns:
          - "org.apache.sshd:*"
          - "org.bouncycastle:*"
          - "net.i2p.crypto:*"
        update-types:
          - "minor"
          - "patch"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
    ignore:
      # SithTermFX is built from source at a git tag and installed to the local
      # Maven repo — it is not a resolvable registry artifact.
      - dependency-name: "com.sithtermfx:*"
      # pty4j 0.13.x bundles an UNSIGNED native macOS helper
      # (pty4j-unix-spawn-helper) that fails Apple notarization in
      # build-release.yml. Stay on 0.12.x until pty4j ships signed darwin
      # binaries (or the macOS signing step is taught to sign jar-internal
      # natives). 0.13.12 carried no security fix. See reverted Dependabot #43.
      # NOTE: a bare versions: ["0.13.x"] entry did NOT hold for Gradle/Maven —
      # Dependabot re-opened the bump (PR #47) and it was merged again. Block by
      # update-type instead: pin to the 0.12.x line (patch updates only), so any
      # 0.13+ minor/major is suppressed until pty4j ships signed darwin binaries.
      - dependency-name: "org.jetbrains.pty4j:pty4j"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # ---- GitHub Actions: keep workflow actions current AND SHA-pinnable ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
