# Dependabot — dependency vulnerability + version updates.
#
# Covers what lives in the Gradle dependency graph (the implementation("...")
# declarations in build.gradle.kts) and the GitHub Actions used in workflows.
#
# KNOWN GAP (handled elsewhere, by pinned-artifact-freshness.yml): Dependabot
# does NOT see artifacts that are fetched via hardcoded URLs rather than
# declared as dependencies — mosh4j, the BUNDLED BouncyCastle 1.84 / protobuf
# 4.35.1 copies, Node, Monaco, esbuild — nor SithTermFX (built from a git tag).
version: 2
updates:
  # ---- Gradle: the pinned implementation("group:artifact:version") deps ----
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group routine minor/patch bumps of the crypto/SSH stack into one PR.
      # (Security advisories still open their own dedicated PRs.)
      ssh-crypto:
        patterns:
          - "org.apache.sshd:*"
          - "org.bouncycastle:*"
          - "net.i2p.crypto:*"
        update-types:
          - "minor"
          - "patch"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
    ignore:
      # SithTermFX is built from source at a git tag and installed to the local
      # Maven repo — it is not a resolvable registry artifact.
      - dependency-name: "com.sithtermfx:*"
      # pty4j 0.13.x bundles an UNSIGNED native macOS helper
      # (pty4j-unix-spawn-helper) that fails Apple notarization in
      # build-release.yml. Stay on 0.12.x until pty4j ships signed darwin
      # binaries (or the macOS signing step is taught to sign jar-internal
      # natives). 0.13.12 carried no security fix. See reverted Dependabot #43.
      # pty4j is FULLY pinned to 0.12.25. Every release from 0.12.26 onward
      # (incl. the semver-PATCH 0.12.35, Dependabot #50) and all 0.13.x bundle an
      # unsigned native macOS helper (pty4j-unix-spawn-helper) that fails Apple
      # notarization in build-release.yml. Earlier narrower ignores (versions:
      # ["0.13.x"], then update-types minor/major) were both insufficient. A bare
      # dependency-name with no versions/update-types ignores EVERY update — keep
      # it until pty4j ships a notarization-friendly helper, or the macOS signing
      # step signs jar-internal natives.
      - dependency-name: "org.jetbrains.pty4j:pty4j"

  # ---- GitHub Actions: keep workflow actions current AND SHA-pinnable ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze must land on the same codeql-action version --
      # analyze refuses to run against a config file that init wrote with a
      # different version. Bumping them in separate PRs (as happened with
      # #77/#79) leaves one half of codeql.yml on the old version and breaks
      # CI with "Loaded a configuration file for version 'X', but running
      # version 'Y'". Group every codeql-action ref so they bump together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
