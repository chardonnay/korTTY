# Publishes the korTTY website (web/) to GitHub Pages, with the bilingual
# offline guide alongside it under /guide/. The guide build output is also
# bundled into the app (Help -> Anleitung) by Gradle's buildDocsSite task.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app-docs/site/**"
      - "app-docs/diagrams/**"
      - "app-docs/screenshots/**"
      - "build.gradle.kts"
      - "scripts/build-docs-site.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

# Least privilege at the top level: the build job only reads the repo. The
# Pages/OIDC write scopes are granted narrowly to the deploy job below.
permissions:
  contents: read

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils librsvg2-bin
          python -m pip install --quiet -r app-docs/site/requirements.txt

      - name: Validate SVG diagrams
        run: ./scripts/validate-doc-svg.sh

      - name: Build the guide (EN + DE, offline-checked)
        run: |
          KORTTY_VERSION="$(grep -E '^version' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          export KORTTY_VERSION
          echo "Building korTTY guide v$KORTTY_VERSION"
          python scripts/build-docs-site.py

      - name: Add guide language redirect
        run: |
          cat > build/guide/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>korTTY Guide</title>
          <meta http-equiv="refresh" content="0; url=./en/index.html">
          <link rel="canonical" href="./en/index.html">
          </head><body>Redirecting to the <a href="./en/index.html">korTTY Guide</a>…</body></html>
          HTML

      - name: Assemble the Pages site (website at root, guide under /guide/)
        run: |
          mkdir -p build/site
          cp -R web/. build/site/
          rm -f build/site/sync-screenshots.sh build/site/README.md
          mkdir -p build/site/guide
          cp -R build/guide/. build/site/guide/
          touch build/site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      # Ordinary (non-Pages) copy of the same build/site output, so the
      # publish-website-repo job below can consume it. actions/upload-pages-artifact
      # produces a special Pages-only artifact format that only
      # actions/deploy-pages can read — this is a separate, normal
      # artifact for that job's own use.
      - name: Upload site content for the korTTY_website publish job
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-artifact
          path: build/site
          include-hidden-files: true # keeps .nojekyll and any other dotfiles
          retention-days: 1 # transient, only needed within this run

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages publish + OIDC token are only needed here, by the deploy step.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish-website-repo:
    name: Publish to korTTY_website (kortty.app)
    needs: build
    runs-on: ubuntu-latest
    # Independent of deploy: this job carries the kortty.app custom domain to
    # a separate repository, while `deploy` is korTTY's own Pages instance
    # (the *.github.io fallback once its custom domain setting is removed).
    # Both depend only on `build`, not on each other, so a failure in one
    # never blocks or delays the other.
    permissions:
      contents: read
    # Separate group from the workflow-level `pages` concurrency group: that
    # group holds a slot for this whole run (build+deploy+publish-website-repo)
    # until every job finishes, so reusing it here would self-deadlock.
    concurrency:
      group: korTTY-website-publish
      cancel-in-progress: false
    steps:
      - name: Download site content
        uses: actions/download-artifact@v8
        with:
          name: docs-site-artifact
          path: site

      - name: Add Pages custom-domain + Jekyll-bypass markers
        run: |
          echo "kortty.app" > site/CNAME
          touch site/.nojekyll

      - name: Push to korTTY_website's gh-pages branch
        env:
          KORTTY_WEBSITE_TOKEN: ${{ secrets.KORTTY_WEBSITE_TOKEN }}
        run: |
          set -uo pipefail
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish korTTY website: ${GITHUB_SHA}"

          # Non-fatal by design: if korTTY_website has been deleted, renamed,
          # or the PAT has expired/lost access, this must not fail the run or
          # block the sibling `deploy` job (korTTY's own fallback Pages) — it
          # should just surface a visible warning and move on.
          if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$KORTTY_WEBSITE_TOKEN" | base64 -w0)" \
               push --force https://github.com/chardonnay/korTTY_website.git HEAD:gh-pages; then
            echo "Publish to korTTY_website succeeded."
          else
            echo "::warning title=korTTY_website publish failed::Could not push to chardonnay/korTTY_website (gh-pages). The repo may have been deleted/renamed, or KORTTY_WEBSITE_TOKEN may be missing/expired/lacking access. kortty.app was NOT updated this run — the fallback deployment at chardonnay.github.io/korTTY is unaffected."
          fi
