name: AI model and prompt catalog promotion

on:
  workflow_dispatch:
    inputs:
      catalog_version:
        description: "Exact catalogVersion expected in the reviewed canonical JSON"
        required: true
        type: string
      release_repository:
        description: "Dedicated repository that receives immutable signed catalog releases"
        required: true
        default: "chardonnay/kortty-ai-catalog"
        type: string

permissions:
  contents: read

concurrency:
  group: ai-catalog-stable-promotion
  cancel-in-progress: false

jobs:
  validate-sign-publish:
    name: Validate, sign, and publish immutable catalog
    # Fail closed for workflow_dispatch refs other than protected main. The environment must be
    # configured with required reviewers before production signing keys are added to it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ai-catalog-signing
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate requested version and canonical JSON
        id: catalog
        shell: bash
        env:
          EXPECTED_CATALOG_VERSION: ${{ inputs.catalog_version }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
        run: |
          set -euo pipefail
          catalog='ai-catalog/model-prompt-catalog-v1.json'
          test -f "$catalog"
          jq --exit-status 'type == "object" and .schemaVersion == 1 and (.sequence | type == "number") and .sequence >= 1 and (.sequence | floor == .)' "$catalog" >/dev/null
          actual_version="$(jq --raw-output '.catalogVersion' "$catalog")"
          catalog_sequence="$(jq --raw-output '.sequence' "$catalog")"
          if ! printf '%s' "$actual_version" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::catalogVersion is not a safe immutable release identifier."
            exit 1
          fi
          if [ "$actual_version" != "$EXPECTED_CATALOG_VERSION" ]; then
            echo "::error::Requested catalog version '$EXPECTED_CATALOG_VERSION' does not match reviewed JSON '$actual_version'."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::release_repository must use owner/repository form."
            exit 1
          fi
          catalog_sha256="$(sha256sum "$catalog" | awk '{print $1}')"
          release_tag="model-prompt-catalog-${actual_version}"
          echo "version=$actual_version" >> "$GITHUB_OUTPUT"
          echo "sequence=$catalog_sequence" >> "$GITHUB_OUTPUT"
          echo "sha256=$catalog_sha256" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Enforce monotonic catalog sequence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_CATALOG_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
        run: |
          set -euo pipefail
          candidate_sequence="$(jq -r '.sequence' ai-catalog/model-prompt-catalog-v1.json)"
          previous_dir="$(mktemp -d)"
          trap 'rm -rf "$previous_dir"' EXIT
          if latest_tag="$(gh release view --repo "$RELEASE_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)" \
             && [ -n "$latest_tag" ]; then
            gh release download "$latest_tag" --repo "$RELEASE_REPOSITORY" \
              --pattern model-prompt-catalog-v1.json --dir "$previous_dir" --clobber
            downloaded="$previous_dir/model-prompt-catalog-v1.json"
            previous_sequence="$(jq -r '.sequence' "$downloaded")"
            if [ "$candidate_sequence" -le "$previous_sequence" ]; then
              echo "::error::Catalog sequence must increase monotonically ($candidate_sequence <= $previous_sequence)."
              exit 1
            fi
            rm -f "$downloaded"
          fi

      - name: Run authoritative Java schema and trust-chain tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test \
            --tests de.kortty.ai.catalog.AiCatalogCanonicalFileTest \
            --tests de.kortty.ai.catalog.AiCatalogTrustChainTest \
            --tests de.kortty.ai.catalog.AiCatalogReleaseConfigurationTest

      - name: Sign exact reviewed JSON bytes with Ed25519
        id: signature
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.AI_CATALOG_ED25519_PRIVATE_KEY_PEM }}
          TRUSTED_PUBLIC_KEY: ${{ vars.KORTTY_AI_CATALOG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::Secret AI_CATALOG_ED25519_PRIVATE_KEY_PEM is required."
            exit 1
          fi
          if [ -z "${TRUSTED_PUBLIC_KEY:-}" ] || printf '%s' "$TRUSTED_PUBLIC_KEY" | grep -qi 'PRIVATE KEY'; then
            echo "::error::Repository variable KORTTY_AI_CATALOG_PUBLIC_KEY must contain public key material only."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/ai-catalog-signing-key.pem"
          public_key="$RUNNER_TEMP/ai-catalog-public-key.pem"
          trusted_key_input="$RUNNER_TEMP/ai-catalog-trusted-public-key.input"
          trusted_key_der="$RUNNER_TEMP/ai-catalog-trusted-public-key.der"
          signing_key_der="$RUNNER_TEMP/ai-catalog-signing-public-key.der"
          raw_signature="$RUNNER_TEMP/model-prompt-catalog-v1.sig.raw"
          cleanup() {
            rm -f "$key_file" "$public_key" "$trusted_key_input" "$trusted_key_der" "$signing_key_der" "$raw_signature"
          }
          trap cleanup EXIT
          printf '%s' "$SIGNING_KEY" > "$key_file"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_file"; then
            echo "::error::AI_CATALOG_ED25519_PRIVATE_KEY_PEM must contain a PKCS#8 private key."
            exit 1
          fi
          openssl pkey -in "$key_file" -pubout -out "$public_key"
          if ! openssl pkey -pubin -in "$public_key" -text -noout 2>/dev/null | grep -qi 'ED25519'; then
            echo "::error::AI catalog signing key must be Ed25519."
            exit 1
          fi
          printf '%s' "$TRUSTED_PUBLIC_KEY" > "$trusted_key_input"
          if grep -q 'BEGIN PUBLIC KEY' "$trusted_key_input"; then
            openssl pkey -pubin -in "$trusted_key_input" -outform DER -out "$trusted_key_der"
          else
            tr -d '[:space:]' < "$trusted_key_input" | openssl base64 -d -A \
              | openssl pkey -pubin -inform DER -outform DER -out "$trusted_key_der"
          fi
          openssl pkey -pubin -in "$public_key" -outform DER -out "$signing_key_der"
          if ! cmp -s "$trusted_key_der" "$signing_key_der"; then
            echo "::error::Catalog signing secret does not match KORTTY_AI_CATALOG_PUBLIC_KEY."
            exit 1
          fi
          mkdir -p release-assets
          cp ai-catalog/model-prompt-catalog-v1.json release-assets/model-prompt-catalog-v1.json
          test "$(sha256sum release-assets/model-prompt-catalog-v1.json | awk '{print $1}')" = "${{ steps.catalog.outputs.sha256 }}"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in release-assets/model-prompt-catalog-v1.json -out "$raw_signature"
          openssl pkeyutl -verify -pubin -rawin -inkey "$public_key" \
            -in release-assets/model-prompt-catalog-v1.json -sigfile "$raw_signature"
          openssl base64 -A -in "$raw_signature" -out release-assets/model-prompt-catalog-v1.sig
          signature_bytes="$(openssl base64 -d -A -in release-assets/model-prompt-catalog-v1.sig | wc -c | tr -d '[:space:]')"
          test "$signature_bytes" = 64
          public_key_sha256="$(sha256sum "$signing_key_der" | awk '{print $1}')"
          echo "public_key_sha256=$public_key_sha256" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing immutable version or release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_CATALOG_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          RELEASE_TAG: ${{ steps.catalog.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret AI_CATALOG_RELEASE_TOKEN is required."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Catalog release $RELEASE_TAG already exists and is immutable."
            exit 1
          fi
          if gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Catalog tag $RELEASE_TAG already exists and will not be reused."
            exit 1
          fi

      - name: Write auditable release metadata
        shell: bash
        env:
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
          CATALOG_SEQUENCE: ${{ steps.catalog.outputs.sequence }}
          CATALOG_SHA256: ${{ steps.catalog.outputs.sha256 }}
          PUBLIC_KEY_SHA256: ${{ steps.signature.outputs.public_key_sha256 }}
          RELEASE_TAG: ${{ steps.catalog.outputs.release_tag }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          promoted_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          cat > release-assets/release-notes.md <<EOF
          Human-promoted, immutable korTTY model/prompt catalog.

          - Catalog version: ${CATALOG_VERSION}
          - Catalog sequence: ${CATALOG_SEQUENCE}
          - Schema version: 1
          - Source repository: ${GITHUB_REPOSITORY}
          - Source commit: ${GITHUB_SHA}
          - Catalog SHA-256: ${CATALOG_SHA256}
          - Ed25519 public-key SHA-256: ${PUBLIC_KEY_SHA256}
          - Workflow actor: ${GITHUB_ACTOR}
          - Promoted at: ${promoted_at}
          - Workflow run ID / attempt: ${GITHUB_RUN_ID} / ${GITHUB_RUN_ATTEMPT}
          - Workflow run: ${run_url}
          - Release tag: ${RELEASE_TAG}
          EOF
          cat release-assets/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable catalog assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_CATALOG_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          RELEASE_TAG: ${{ steps.catalog.outputs.release_tag }}
          CATALOG_VERSION: ${{ steps.catalog.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/model-prompt-catalog-v1.json \
            release-assets/model-prompt-catalog-v1.sig \
            --repo "$RELEASE_REPOSITORY" \
            --title "korTTY model/prompt catalog ${CATALOG_VERSION}" \
            --notes-file release-assets/release-notes.md \
            --latest
