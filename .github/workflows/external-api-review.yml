name: External API review

# Covers the third-party HTTP APIs korTTY calls at runtime — the translation
# providers today, anything added to external-apis.yaml later. Dependabot and
# .github/workflows/pinned-artifact-freshness.yml track libraries and pinned
# downloads; neither can see a wire protocol. A vendor retiring a REST version
# breaks no build and no dependency pin, it only starts failing on users'
# machines — which is exactly how korTTY kept shipping a client for the
# long-retired Yandex Translate API v1.5.
#
# This job does NOT probe the vendors: that needs credentials, and an endpoint
# answering today says nothing about a retirement already announced. Instead each
# registry entry carries a `review_after` date, and this job collects the ones
# that have come due into ONE tracking issue for a human to re-check against the
# vendor's documentation.

on:
  schedule:
    - cron: "41 6 1 */3 *" # quarterly, 06:41 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # SHA-pinned, matching the repo convention (actions/checkout@v7).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install checker deps
        run: python -m pip install --quiet pyyaml

      - name: Collect APIs due for review
        id: check
        run: |
          set -uo pipefail
          # Non-zero exit means "some are due", not "the job failed".
          if python scripts/external-api-check.py --stale --markdown --today "$(date -u +%F)" > body.md; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
          cat body.md

      - name: Open or refresh the tracking issue
        if: steps.check.outputs.due == 'true'
        env:
          TITLE: "🌐 External API review: versions due for a re-check"
        run: |
          set -uo pipefail
          gh label create external-api --color 1D76DB --description "Third-party HTTP API version tracking" 2>/dev/null || true

          existing="$(gh issue list --state open --label external-api \
            --search "in:title $TITLE" --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Refreshed existing tracking issue #$existing."
          else
            gh issue create --title "$TITLE" --label external-api --body-file body.md
          fi
