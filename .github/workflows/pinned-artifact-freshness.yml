name: Pinned-artifact freshness

# Covers the security-critical artifacts Dependabot CANNOT see because they are
# fetched via hardcoded URLs (or built from a git tag) rather than declared as
# Gradle dependencies: mosh4j, bundled protobuf, the Monaco build Node runtime,
# Monaco, Mermaid, and SithTermFX. It compares the versions pinned in build.gradle.kts
# against upstream "latest" and opens/refreshes ONE tracking issue when any are
# behind. It does NOT edit the build (each bump needs a new SHA-256 pin and, for
# mosh4j, a per-arch JAR matrix) — a human/agent then opens the fix PR.
#
# No signing/notarization secrets are available to this workflow.

on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Compare pinned versions against upstream
        id: check
        run: |
          set -uo pipefail

          # --- helpers ---------------------------------------------------------
          gv() { grep -E "^val $1[[:space:]]*=" build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/'; }
          # is_newer PINNED UPSTREAM  -> exit 0 if UPSTREAM is a strictly newer version
          is_newer() {
            [ -n "$2" ] || return 1
            [ "$1" = "$2" ] && return 1
            local top; top="$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)"
            [ "$top" = "$2" ]
          }

          # --- pinned versions (parsed from build.gradle.kts) ------------------
          MOSH4J_PIN="$(gv mosh4jVersion)"
          NODE_PIN="$(gv formatterNodeVersion)"
          MONACO_PIN="$(gv monacoEditorVersion)"
          MERMAID_PIN="$(gv mermaidVersion)"
          SITH_PIN="$(gv sithtermfxVersion)"
          BC_PIN="$(grep -oE 'bcprov-jdk18on:[0-9][0-9.]*' build.gradle.kts | head -n1 | cut -d: -f2)"
          PB_PIN="$(grep -oE 'protobuf-java/[0-9][0-9.]*/' build.gradle.kts | head -n1 | sed -E 's#.*/([0-9][0-9.]*)/#\1#')"

          # --- upstream "latest" (failures degrade gracefully to empty) --------
          MOSH4J_UP="$(gh api repos/chardonnay/mosh4j/releases/latest --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)"
          SITH_UP="$(gh api repos/chardonnay/SithTermFX/tags --jq '.[].name' 2>/dev/null | sed 's/^v//' | sort -V | tail -n1 || true)"
          # Authoritative Maven Central metadata (search.maven.org's latestVersion is unreliable/stale).
          maven_latest() { # maven_latest <group/path> <artifact>
            curl -fsS "https://repo1.maven.org/maven2/$1/$2/maven-metadata.xml" 2>/dev/null \
              | grep -oE '<version>[^<]+</version>' | sed -E 's#</?version>##g' \
              | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1 || true
          }
          BC_UP="$(maven_latest org/bouncycastle bcprov-jdk18on)"
          PB_UP="$(maven_latest com/google/protobuf protobuf-java)"
          MONACO_UP="$(curl -fsS 'https://registry.npmjs.org/monaco-editor/latest' 2>/dev/null | jq -r '.version // empty' || true)"
          MERMAID_UP="$(curl -fsS 'https://registry.npmjs.org/mermaid/latest' 2>/dev/null | jq -r '.version // empty' || true)"
          # Node: newest release within the SAME major line as the pin (security patches).
          NODE_MAJOR="${NODE_PIN%%.*}"
          NODE_UP="$(curl -fsS 'https://nodejs.org/dist/index.json' 2>/dev/null \
            | jq -r --arg m "v${NODE_MAJOR}." '[.[].version | select(startswith($m))][0] // empty' | sed 's/^v//' || true)"

          # --- build the outdated table ----------------------------------------
          ROWS=""
          add() { is_newer "$2" "$3" && ROWS="${ROWS}| ${1} | ${2} | ${3} |"$'\n'; }
          add "mosh4j (GitHub release, per-arch JARs)" "$MOSH4J_PIN" "$MOSH4J_UP"
          add "BouncyCastle bcprov-jdk18on (Gradle runtime)" "$BC_PIN" "$BC_UP"
          add "protobuf-java (BUNDLED copy)" "$PB_PIN" "$PB_UP"
          add "Node (Monaco build runtime, ${NODE_MAJOR}.x line)" "$NODE_PIN" "$NODE_UP"
          add "monaco-editor" "$MONACO_PIN" "$MONACO_UP"
          add "mermaid (bundled browser renderer)" "$MERMAID_PIN" "$MERMAID_UP"
          add "SithTermFX (git tag)" "$SITH_PIN" "$SITH_UP"

          {
            echo "Automated weekly check of URL-pinned / source-built artifacts that Dependabot cannot track."
            echo "Each update below needs a new SHA-256 pin in \`build.gradle.kts\` (and for mosh4j a per-arch JAR refresh) — not an auto-bump."
            echo
            if [ -n "$ROWS" ]; then
              echo "| Artifact | Pinned | Upstream latest |"
              echo "| --- | --- | --- |"
              printf '%s' "$ROWS"
            else
              echo "All pinned artifacts are current. ✅"
            fi
            echo
            echo "<sub>Generated by \`.github/workflows/pinned-artifact-freshness.yml\`.</sub>"
          } > body.md

          if [ -n "$ROWS" ]; then echo "outdated=true" >> "$GITHUB_OUTPUT"; else echo "outdated=false" >> "$GITHUB_OUTPUT"; fi

      - name: Open or refresh the tracking issue
        if: steps.check.outputs.outdated == 'true'
        env:
          TITLE: "🔒 Pinned-artifact freshness: updates available"
        run: |
          set -uo pipefail
          # Ensure labels exist (no-op if already present).
          gh label create pinned-dependency --color FBCA04 --description "URL-pinned / source-built artifact tracking" 2>/dev/null || true
          gh label create security --color D93F0B --description "Security-relevant change" 2>/dev/null || true

          existing="$(gh issue list --state open --label pinned-dependency \
            --search "in:title $TITLE" --json number --jq '.[0].number' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Refreshed existing tracking issue #$existing."
          else
            gh issue create --title "$TITLE" --label security --label pinned-dependency --body-file body.md
          fi
