# Validates the korTTY documentation: version sync, manifest/asset integrity,
# SVG diagram validity, and settings/menu coverage. See AGENTS.md + the
# scripts/doc-*.py + sync-version.py validators.
name: Docs validate

on:
  push:
    branches: [main]
    paths:
      - "app-docs/**"
      - "README.adoc"
      - "src/main/resources/i18n/**"
      - "build.gradle.kts"
      - "scripts/doc-*.py"
      - "scripts/sync-version.py"
      - "scripts/validate-doc-svg.sh"
      - ".github/workflows/docs-validate.yml"
  pull_request:
    paths:
      - "app-docs/**"
      - "README.adoc"
      - "src/main/resources/i18n/**"
      - "build.gradle.kts"
      - "scripts/doc-*.py"
      - "scripts/sync-version.py"
      - "scripts/validate-doc-svg.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, matching the repo convention (actions/checkout@v7).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # PR-triggered job: don't persist the GITHUB_TOKEN in local git config.
          persist-credentials: false
          # Full history: doc-links.py verifies that every last_synced_ref still
          # resolves to a commit. The default shallow checkout has one commit, so
          # the check would skip itself and the manifest could rot unnoticed.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install validator deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils librsvg2-bin
          python -m pip install --quiet pyyaml

      - name: SVG diagrams valid
        run: ./scripts/validate-doc-svg.sh

      - name: Version in sync
        run: python scripts/sync-version.py --check

      - name: Manifest + asset integrity
        run: python scripts/doc-links.py

      # Hard gate: every user-facing settings.* / menu.* key must be documented
      # (owned by an existing reference page). Coverage reached 100% once the
      # settings reference pages were authored.
      - name: Settings/menu coverage (gate)
        run: python scripts/doc-coverage.py --strict
