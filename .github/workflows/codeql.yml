name: CodeQL

# Static security analysis of the Java source and the GitHub Actions workflow
# files. Uses build-mode: none, which
# does NOT compile the project — it sidesteps the heavy SithTermFX (Maven) +
# mosh4j/Node/Monaco vendoring that build-release.yml performs. korTTY has no
# .kt source files (Kotlin appears only in the Gradle DSL), so the "Kotlin is
# skipped under build-mode none" caveat does not apply here.
#
# Results land in: Security -> Code scanning alerts.
# This workflow has NO access to signing/notarization secrets.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload SARIF to the code-scanning tab
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          # Re-analyzes the workflow files themselves (missing permissions, untrusted inputs,
          # …). The three stale actions/missing-workflow-permissions alerts on main came from
          # GitHub's earlier default setup; without this analysis they could never re-close.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false # build-mode none needs no compile -> no SithTermFX clone

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
