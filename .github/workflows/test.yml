# Runs the JVM test suite on all three OSes for every PR and every push to main.
#
# Nothing else in CI does this: codeql.yml uses build-mode: none (no compile, no
# tests) and build-release.yml only compiles+tests as a side effect of a release
# build, which normally only runs when cutting a release. That gap let four
# Windows-only test bugs (path-separator/JSON-escaping/NTFS-permission issues)
# sit undetected for weeks until the v2.6.0 release build finally exercised
# Windows — this workflow closes it by testing every change, not just releases.
#
# Deliberately lighter than build-release.yml: no jpackage, no signing/
# notarization, no AI-catalog/llama-runtime trust roots, so it needs no repo
# secrets or variables and is safe to run on PRs from forks.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Lets a maintainer re-run the suite for a commit whose own run never happened —
  # a merge that inherited a [skip ci] marker, or a run cancelled by concurrency.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pacman-package-contract:
    name: pacman package contract
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch packaging test dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel binutils git jdk-openjdk libarchive python shellcheck

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Lint pacman packaging scripts
        run: shellcheck scripts/package-pacman.sh scripts/verify-pacman-package.sh scripts/test_pacman_packaging.sh

      - name: Validate pacman workflow contract
        run: |
          python3 scripts/test_pacman_workflow_contract.py
          python3 scripts/test_update_release_download_guide.py

      - name: Build and verify synthetic packages for both architectures
        run: ./scripts/test_pacman_packaging.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Validate release license declarations
        shell: bash
        run: python3 scripts/check-release-licenses.py

      - name: Clone SithTermFX (build from source, no token)
        shell: bash
        run: |
          rm -rf vendor/sithtermfx
          git clone --depth 1 --branch v1.2.4 https://github.com/chardonnay/SithTermFX.git vendor/sithtermfx

      - name: Patch SithTermFX Maven config for CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pom = Path("vendor/sithtermfx/pom.xml")
          text = pom.read_text(encoding="utf-8")
          if "<artifactId>maven-compiler-plugin</artifactId>" not in text:
              build_block = """    <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>17</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>

          """
              text = text.replace("    <profiles>\n", build_block + "    <profiles>\n", 1)
              pom.write_text(text, encoding="utf-8")
          PY

      - name: Install Maven (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Install Maven (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install maven

      - name: Install Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          # windows-latest ships Maven; only fall back to Chocolatey when it is missing.
          if (Get-Command mvn -ErrorAction SilentlyContinue) {
            Write-Host "Using preinstalled Maven: $((Get-Command mvn).Source)"
          } else {
            # Chocolatey's community feed occasionally answers 503; retry with a backoff before failing.
            $maxAttempts = 4
            for ($attempt = 1; ; $attempt++) {
              choco install maven -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -ge $maxAttempts) { throw "Maven package download failed after $maxAttempts attempts" }
              $delay = 8 + 12 * $attempt
              Write-Warning "choco install maven failed (exit $LASTEXITCODE, attempt $attempt/$maxAttempts); retrying in $delay s"
              Start-Sleep -Seconds $delay
            }
          }
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 21 for SithTermFX Maven build
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Save SithTermFX JDK path
        run: echo "SITHTERMFX_JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: "Build SithTermFX with Maven (CI: avoid Gradle Exec PATH/JAVA_HOME issues)"
        shell: bash
        run: |
          MVN_ARGS=(-q -DskipTests -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -pl "sithtermfx-core,sithtermfx-ui" -am install)
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            MVN_ARGS+=(-Djavafx.platform=win)
          fi
          if [ -d vendor/sithtermfx ] && [ -f vendor/sithtermfx/pom.xml ]; then
            cd vendor/sithtermfx
            export JAVA_HOME="$SITHTERMFX_JDK_HOME"
            mvn "${MVN_ARGS[@]}"
            cd ../..
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # Keeps most runs off community.chocolatey.org, whose transient 503s used to fail the whole leg.
      - name: Cache native GnuPG (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kortty-test-gnupg
          key: kortty-test-gnupg-windows-2.5.21-v1

      - name: Prepare native GnuPG (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $gpgDir = Join-Path $env:RUNNER_TEMP 'kortty-test-gnupg'
          $gpgBin = Join-Path $gpgDir 'bin'
          if (Test-Path (Join-Path $gpgBin 'gpg.exe')) {
            Write-Host "Using cached GnuPG from $gpgDir"
          } else {
            # Only the CLI tools are needed; the installer can block unattended runners.
            # Chocolatey's community feed occasionally answers 503; retry with a backoff before failing.
            $maxAttempts = 4
            $installerPath = $null
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              choco install gnupg --version=2.5.21 --yes --no-progress --skip-powershell
              if ($LASTEXITCODE -eq 0) {
                $installer = Get-ChildItem "$env:ChocolateyInstall\lib\gnupg\tools" -Filter 'gnupg-*.exe' | Select-Object -First 1
                if (-not $installer) { throw "GnuPG package installer not found" }
                $installerPath = $installer.FullName
                break
              }
              if ($attempt -lt $maxAttempts) {
                $delay = 8 + 12 * $attempt
                Write-Warning "choco install gnupg failed (exit $LASTEXITCODE, attempt $attempt/$maxAttempts); retrying in $delay s"
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $installerPath) {
              # Same installer the Chocolatey package embeds, fetched from gnupg.org and pinned by SHA-256.
              Write-Warning "Chocolatey unavailable after $maxAttempts attempts; downloading the GnuPG installer from gnupg.org"
              $installerPath = Join-Path $env:RUNNER_TEMP 'gnupg-w32-2.5.21_20260702.exe'
              Invoke-WebRequest -Uri 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.21_20260702.exe' -OutFile $installerPath -MaximumRetryCount 3 -RetryIntervalSec 15
              $sha256 = (Get-FileHash $installerPath -Algorithm SHA256).Hash
              if ($sha256 -ne '6246C925A73167253444AFC24A0DEB83A3F43B7D636AF84D6AAF48A98A62F024') { throw "GnuPG package download failed (checksum mismatch: $sha256)" }
            }
            & 7z.exe x $installerPath "-o$gpgDir" -y
            if ($LASTEXITCODE -ne 0) { throw "GnuPG extraction failed" }
          }
          if (-not (Test-Path (Join-Path $gpgBin 'gpg.exe'))) { throw "Native GnuPG executable not found" }
          "KORTTY_TEST_GPG_BIN=$gpgBin" >> $env:GITHUB_ENV
          & (Join-Path $gpgBin 'gpg.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "Native GnuPG version check failed" }

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Java passes native Windows paths. Git's MSYS GPG interprets those as relative Unix paths.
            export PATH="$(cygpath -u "$KORTTY_TEST_GPG_BIN"):/c/ProgramData/chocolatey/bin:$PATH"
          fi
          ./gradlew test
