# Runs the JVM test suite on all three OSes for every PR and every push to main.
#
# Nothing else in CI does this: codeql.yml uses build-mode: none (no compile, no
# tests) and build-release.yml only compiles+tests as a side effect of a release
# build, which normally only runs when cutting a release. That gap let four
# Windows-only test bugs (path-separator/JSON-escaping/NTFS-permission issues)
# sit undetected for weeks until the v2.6.0 release build finally exercised
# Windows — this workflow closes it by testing every change, not just releases.
#
# Deliberately lighter than build-release.yml: no jpackage, no signing/
# notarization, no AI-catalog/llama-runtime trust roots, so it needs no repo
# secrets or variables and is safe to run on PRs from forks.
name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Clone SithTermFX (build from source, no token)
        shell: bash
        run: |
          rm -rf vendor/sithtermfx
          git clone --depth 1 --branch v1.2.1 https://github.com/chardonnay/SithTermFX.git vendor/sithtermfx

      - name: Apply pinned korTTY SithTermFX patches
        shell: bash
        run: |
          git -C vendor/sithtermfx apply --unidiff-zero --check ../../patches/sithtermfx/1.2.1-terminal-panel-bottom-row.patch
          git -C vendor/sithtermfx apply --unidiff-zero ../../patches/sithtermfx/1.2.1-terminal-panel-bottom-row.patch

      - name: Patch SithTermFX Maven config for CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pom = Path("vendor/sithtermfx/pom.xml")
          text = pom.read_text(encoding="utf-8")
          if "<artifactId>maven-compiler-plugin</artifactId>" not in text:
              build_block = """    <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>17</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>

          """
              text = text.replace("    <profiles>\n", build_block + "    <profiles>\n", 1)
              pom.write_text(text, encoding="utf-8")
          PY

      - name: Install Maven (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Install Maven (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install maven

      - name: Install Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install maven -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 21 for SithTermFX Maven build
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Save SithTermFX JDK path
        run: echo "SITHTERMFX_JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: "Build SithTermFX with Maven (CI: avoid Gradle Exec PATH/JAVA_HOME issues)"
        shell: bash
        run: |
          MVN_ARGS=(-q -DskipTests -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -pl "sithtermfx-core,sithtermfx-ui" -am install)
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            MVN_ARGS+=(-Djavafx.platform=win)
          fi
          if [ -d vendor/sithtermfx ] && [ -f vendor/sithtermfx/pom.xml ]; then
            cd vendor/sithtermfx
            export JAVA_HOME="$SITHTERMFX_JDK_HOME"
            mvn "${MVN_ARGS[@]}"
            cd ../..
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          fi
          ./gradlew test
