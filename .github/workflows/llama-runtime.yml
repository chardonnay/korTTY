name: llama.cpp runtime candidates

on:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "build.gradle.kts"
      - ".github/workflows/llama-runtime.yml"
      - "src/main/java/de/kortty/ai/llama/**"
      - "src/main/java/de/kortty/ai/runtimeupdate/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Detect a candidate, build packages, or promote already reviewed packages"
        type: choice
        options: [build, detect, promote]
        default: build
      release_repository:
        description: "Runtime-only GitHub repository used for stable release assets"
        required: false
        default: "chardonnay/kortty-llama-runtimes"
      revoked_runtime_ids:
        description: "Optional comma/newline-separated runtime or installation IDs to revoke in the cumulative signed index"
        required: false
        default: ""
      promotion_reason:
        description: "Stable cadence reason; security/model-support explicitly override the seven-day gate"
        type: choice
        options: [regular, security, model-support]
        default: regular

permissions:
  contents: read

concurrency:
  group: llama-runtime-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  detect-candidate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'detect' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Resolve newest upstream tag without promoting it
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -nE 's/^val llamaCppTag = "([^"]+)"/\1/p' build.gradle.kts)"
          latest="$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp.git 'refs/tags/b*' \
            | sed -E 's#.*refs/tags/##' | grep -E '^b[0-9]+$' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            echo "Could not resolve an upstream llama.cpp release tag."
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit="$(git ls-remote https://github.com/ggml-org/llama.cpp.git "refs/tags/$latest^{}" | awk 'NR == 1 {print $1}')"
          if [ -z "$commit" ]; then
            commit="$(git ls-remote https://github.com/ggml-org/llama.cpp.git "refs/tags/$latest" | awk 'NR == 1 {print $1}')"
          fi
          archive="$(mktemp)"
          curl --fail --location --retry 3 "https://github.com/ggml-org/llama.cpp/archive/$commit.tar.gz" -o "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          rm -f "$archive"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open one human-reviewed candidate PR
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.upstream.outputs.latest }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SHA256: ${{ steps.upstream.outputs.sha256 }}
        run: |
          set -euo pipefail
          branch="automation/llama-runtime-${TAG}"
          if gh pr list --state open --head "$branch" --json number --jq '.[0].number' | grep -q .; then
            echo "Candidate PR already exists for $TAG."
            exit 0
          fi
          git switch -c "$branch"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "llamaCppTag": os.environ["TAG"],
              "llamaCppCommit": os.environ["COMMIT"],
              "llamaCppSourceSha256": os.environ["SHA256"],
          }
          for key, value in replacements.items():
              text, count = re.subn(rf'^val {key} = "[^"]+"$', f'val {key} = "{value}"', text, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Could not update {key}")
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "kortty-runtime-bot[bot]"
          git config user.email "kortty-runtime-bot[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "build(llama): test ${TAG} runtime candidate"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "build(llama): test ${TAG} runtime candidate" \
            --body "Pins upstream ${TAG} at ${COMMIT}. This is a candidate only: the runtime matrix and API contract must pass, followed by human approval, before stable promotion."

  build-runtime:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action != 'detect')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: aarch64
            backend: CPU
          - os: macos-latest
            platform: macos
            arch: aarch64
            backend: METAL
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            backend: CPU
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            backend: METAL
          - os: windows-latest
            platform: windows
            arch: x86_64
            backend: CPU
          - os: windows-latest
            platform: windows
            arch: x86_64
            backend: VULKAN
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            backend: CPU
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            backend: VULKAN
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            backend: CPU
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            backend: VULKAN
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc curl jq

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake ninja jq

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install cmake ninja vulkan-sdk jq -y --no-progress

      - name: Build verified runtime package and descriptor
        shell: bash
        run: ./gradlew generateLlamaRuntimeManifest -Pllama.backend=${{ matrix.backend }} --stacktrace

      - name: Native link smoke on every platform/backend
        shell: bash
        run: |
          set -euo pipefail
          server="$(find build/llama-runtime/stage-* -type f \( -name llama-server -o -name llama-server.exe \) | head -n1)"
          test -n "$server"
          "$server" --version

      - name: Full authenticated API contract smoke
        shell: bash
        env:
          KORTTY_RUNTIME_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          chat_model=build/llama-runtime/SmolLM2-135M-Instruct-Q2_K.gguf
          embedding_model=build/llama-runtime/stories260K.gguf
          curl --fail --location --retry 3 \
            'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q2_K.gguf?download=true' \
            -o "$chat_model"
          curl --fail --location --retry 3 \
            'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf?download=true' \
            -o "$embedding_model"
          if command -v sha256sum >/dev/null 2>&1; then
            chat_sha="$(sha256sum "$chat_model" | awk '{print $1}')"
            embedding_sha="$(sha256sum "$embedding_model" | awk '{print $1}')"
          else
            chat_sha="$(shasum -a 256 "$chat_model" | awk '{print $1}')"
            embedding_sha="$(shasum -a 256 "$embedding_model" | awk '{print $1}')"
          fi
          test "$chat_sha" = '741ad12b64088fedc17c33aacb22e48be1972ef36a39f03666dd68bd15614fb9'
          test "$embedding_sha" = '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d'
          server="$(find build/llama-runtime/stage-* -type f \( -name llama-server -o -name llama-server.exe \) | head -n1)"
          test -n "$server"
          key='kortty-ci-runtime-key'
          gpu_layers=0
          if [ "$KORTTY_RUNTIME_BACKEND" != CPU ]; then
            # Backend packages must exercise actual offload instead of silently passing a CPU-only
            # smoke. One layer is enough to validate device initialization and native linkage.
            gpu_layers=1
          fi
          cleanup() {
            for pid in $(jobs -p); do
              kill "$pid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          "$server" --host 127.0.0.1 --port 18080 --model "$chat_model" --api-key "$key" \
            --offline --no-ui --no-agent --no-ui-mcp-proxy --no-slots --n-gpu-layers "$gpu_layers" \
            --sleep-idle-seconds 1 \
            >build/llama-runtime/server-chat.log 2>&1 &
          for _ in $(seq 1 120); do
            curl --silent --fail http://127.0.0.1:18080/health >/dev/null && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{"prompt":"blocked","max_tokens":1}' \
            http://127.0.0.1:18080/v1/completions)" = 401
          curl --fail --header "Authorization: Bearer $key" \
            http://127.0.0.1:18080/v1/models | jq -e '.data | length > 0'
          curl --fail --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
            --data '{"prompt":"Once","max_tokens":1}' \
            http://127.0.0.1:18080/v1/completions | jq -e '.choices | length == 1'
          sleep 2
          curl --fail --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
            --data '{"prompt":"Wake","max_tokens":1}' \
            http://127.0.0.1:18080/v1/completions | jq -e '.choices | length == 1'
          curl --fail --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Return whether korTTY is local."}],"max_tokens":16,"response_format":{"type":"json_schema","schema":{"type":"object","properties":{"local":{"type":"boolean"}},"required":["local"],"additionalProperties":false}}}' \
            http://127.0.0.1:18080/v1/chat/completions | jq -e '.choices | length == 1'

          "$server" --host 127.0.0.1 --port 18081 --model "$embedding_model" --api-key "$key" \
            --offline --no-ui --no-agent --no-ui-mcp-proxy --no-slots --n-gpu-layers "$gpu_layers" \
            --embedding --pooling mean \
            >build/llama-runtime/server-embedding.log 2>&1 &
          for _ in $(seq 1 120); do
            curl --silent --fail http://127.0.0.1:18081/health >/dev/null && break
            sleep 1
          done
          curl --fail --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
            --data '{"input":"korTTY"}' \
            http://127.0.0.1:18081/v1/embeddings | jq -e '.data[0].embedding | length > 0'
          # Both isolated sidecars must remain independently usable in parallel.
          curl --fail --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
            --data '{"prompt":"Still alive","max_tokens":1}' \
            http://127.0.0.1:18080/v1/completions | jq -e '.choices | length == 1'

      - name: Upload immutable candidate package
        uses: actions/upload-artifact@v7
        with:
          name: llama-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}
          path: build/llama-runtime/packages/*
          if-no-files-found: error
          retention-days: 14

  qdrant-integration:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action != 'detect')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y maven curl

      - name: Wait for pinned Qdrant service
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:6333/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Pinned Qdrant v1.18.2 service did not become ready."
          exit 1

      - name: Run real Qdrant vector-store contract
        env:
          KORTTY_TEST_QDRANT_URL: http://127.0.0.1:6333
        run: ./gradlew test --tests de.kortty.rag.QdrantVectorStoreIntegrationTest --stacktrace

  promote-stable:
    # Signing secrets are never exposed to a workflow dispatched from an arbitrary ref. The
    # llama-runtime-signing environment must be protected with required reviewers in GitHub.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote' && github.ref == 'refs/heads/main'
    needs: [build-runtime, qdrant-integration]
    runs-on: ubuntu-latest
    environment: llama-runtime-signing
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.LLAMA_RUNTIME_RELEASE_TOKEN }}
      SIGNING_KEY: ${{ secrets.LLAMA_RUNTIME_ED25519_PRIVATE_KEY_PEM }}
      RELEASE_REPOSITORY: ${{ inputs.release_repository }}
      REVOKED_RUNTIME_IDS: ${{ inputs.revoked_runtime_ids }}
      PROMOTION_REASON: ${{ inputs.promotion_reason }}
    steps:
      - name: Download reviewed matrix artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: llama-runtime-*
          path: runtime-assets
          merge-multiple: true

      - name: Enforce stable promotion cadence and record override reason
        shell: bash
        run: |
          set -euo pipefail
          case "$PROMOTION_REASON" in
            regular|security|model-support) ;;
            *) echo "Unsupported stable promotion reason: $PROMOTION_REASON"; exit 1 ;;
          esac
          latest_created="$(gh release view --repo "$RELEASE_REPOSITORY" --json createdAt --jq .createdAt 2>/dev/null || true)"
          if [ -z "$latest_created" ]; then
            audit_note="Initial stable promotion; no earlier runtime release exists."
          else
            latest_epoch="$(date -u -d "$latest_created" +%s)"
            now_epoch="$(date -u +%s)"
            age_seconds="$((now_epoch - latest_epoch))"
            if [ "$PROMOTION_REASON" = regular ] && [ "$age_seconds" -lt 604800 ]; then
              remaining_hours="$(((604800 - age_seconds + 3599) / 3600))"
              echo "Regular stable promotion denied: the latest stable release is under seven days old (${remaining_hours} h remaining)."
              echo "Use security or model-support only for a genuine audited cadence override."
              exit 1
            fi
            if [ "$PROMOTION_REASON" = regular ]; then
              audit_note="Regular seven-day stable cadence gate satisfied."
            else
              audit_note="Human-approved seven-day cadence override: ${PROMOTION_REASON}."
            fi
          fi
          echo "PROMOTION_AUDIT_NOTE=$audit_note" >> "$GITHUB_ENV"

      - name: Build and sign runtime-index-v1.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" >runtime-assets/signing-key.pem
          descriptors=(runtime-assets/*.json)
          runtime_id="$(jq -r '.runtimeId' "${descriptors[@]}" | sort -u)"
          test "$(printf '%s\n' "$runtime_id" | wc -l)" = 1
          release_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${runtime_id}"
          for descriptor in "${descriptors[@]}"; do
            jq --arg base "$release_url" '.downloadUrl = ($base + "/" + (.downloadUrl | split("/")[-1]))' \
              "$descriptor" >"$descriptor.tmp"
            mv "$descriptor.tmp" "$descriptor"
          done

          # Start from the previously signed stable index. This makes releases/latest a cumulative
          # catalog instead of silently dropping every older compatible platform package.
          mkdir -p runtime-assets/previous
          printf '%s' '{"schemaVersion":1,"generatedAt":"1970-01-01T00:00:00Z","revokedRuntimeIds":[],"packages":[]}' \
            >runtime-assets/previous/runtime-index-v1.json
          if latest_tag="$(gh release view --repo "$RELEASE_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)" \
             && [ -n "$latest_tag" ]; then
            gh release download "$latest_tag" --repo "$RELEASE_REPOSITORY" \
              --pattern runtime-index-v1.json --pattern runtime-index-v1.sig \
              --dir runtime-assets/previous --clobber
            base64 --decode runtime-assets/previous/runtime-index-v1.sig \
              >runtime-assets/previous/runtime-index-v1.sig.raw
            openssl pkey -in runtime-assets/signing-key.pem -pubout \
              >runtime-assets/previous/signing-public-key.pem
            openssl pkeyutl -verify -pubin \
              -inkey runtime-assets/previous/signing-public-key.pem -rawin \
              -in runtime-assets/previous/runtime-index-v1.json \
              -sigfile runtime-assets/previous/runtime-index-v1.sig.raw
            jq -e '.schemaVersion == 1 and (.packages | type == "array") and (.revokedRuntimeIds | type == "array")' \
              runtime-assets/previous/runtime-index-v1.json >/dev/null
          fi

          printf '%s' "$REVOKED_RUNTIME_IDS" | tr ',\r' '\n\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
            | sed '/^$/d' | sort -u >runtime-assets/requested-revocations.txt
          if grep -Ev '^[A-Za-z0-9._-]+$' runtime-assets/requested-revocations.txt; then
            echo "Revoked runtime IDs may contain only letters, digits, dot, underscore and hyphen."
            exit 1
          fi
          jq -R -s 'split("\n") | map(select(length > 0))' \
            runtime-assets/requested-revocations.txt >runtime-assets/requested-revocations.json
          jq -s '.' "${descriptors[@]}" >runtime-assets/new-packages.json
          jq -s '((.[0].packages // []) + .[1])' \
            runtime-assets/previous/runtime-index-v1.json runtime-assets/new-packages.json \
            >runtime-assets/all-packages.json
          jq -e 'group_by(.runtimeId + "|" + .platform + "|" + .architecture + "|" + .backend)
            | all(.[]; (map(.sha256) | unique | length) == 1)' runtime-assets/all-packages.json >/dev/null \
            || { echo "An immutable runtime installation ID has conflicting package hashes."; exit 1; }
          jq -n \
            --slurpfile previous runtime-assets/previous/runtime-index-v1.json \
            --slurpfile packages runtime-assets/all-packages.json \
            --slurpfile requested runtime-assets/requested-revocations.json \
            '{schemaVersion: 1,
              generatedAt: (now | todateiso8601),
              revokedRuntimeIds: (((($previous[0].revokedRuntimeIds // []) + $requested[0]) | unique | sort)),
              packages: (($packages[0] | unique_by(.runtimeId + "|" + .platform + "|" + .architecture + "|" + .backend)))}' \
            >runtime-assets/runtime-index-v1.json
          openssl pkeyutl -sign -rawin -inkey runtime-assets/signing-key.pem \
            -in runtime-assets/runtime-index-v1.json -out runtime-assets/runtime-index-v1.sig.raw
          base64 -w0 runtime-assets/runtime-index-v1.sig.raw >runtime-assets/runtime-index-v1.sig
          rm -rf runtime-assets/signing-key.pem runtime-assets/runtime-index-v1.sig.raw runtime-assets/previous \
            runtime-assets/requested-revocations.txt runtime-assets/requested-revocations.json \
            runtime-assets/new-packages.json runtime-assets/all-packages.json
          echo "RUNTIME_ID=$runtime_id" >> "$GITHUB_ENV"

      - name: Publish immutable stable assets after human dispatch
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RUNTIME_ID" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable runtime $RUNTIME_ID already exists; immutable releases are never overwritten."
            exit 1
          fi
          gh release create "$RUNTIME_ID" runtime-assets/*.zip \
            runtime-assets/runtime-index-v1.json runtime-assets/runtime-index-v1.sig \
            --repo "$RELEASE_REPOSITORY" \
            --title "$RUNTIME_ID" \
            --notes "Human-promoted stable korTTY llama.cpp runtime matrix. Promotion reason: ${PROMOTION_REASON}. ${PROMOTION_AUDIT_NOTE}"
