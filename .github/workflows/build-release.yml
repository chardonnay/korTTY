name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or immutable commit SHA to build'
        required: true
        default: 'main'
      release_tag:
        description: 'Existing GitHub release tag to receive assets, or ci-only to build without uploading'
        required: true
        default: 'v2.14.0'
      version:
        description: 'Numeric application version for jpackage and Flatpak'
        required: true
        default: '2.14.0'
      scope:
        description: 'Build/upload every package, only Flatpak, or only a Pacman backfill'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - flatpak-only
          - pacman-only
      pacman_pkgrel:
        description: 'Pacman package release number (used by pacman-only backfills)'
        required: false
        default: '1'
      expected_tag_commit:
        description: 'Expected 40-character commit SHA for the source release tag (required for pacman-only)'
        required: false
        default: ''

# Least-privilege default for every job; upload-release widens to contents: write itself.
permissions:
  contents: read

jobs:
  docs-render:
    name: Validate documentation SVG diagrams
    if: github.event_name == 'release' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}
          submodules: false

      - name: Install SVG validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils librsvg2-bin

      - name: Validate documentation SVG diagrams
        run: ./scripts/validate-doc-svg.sh

      - name: Upload diagram SVGs
        uses: actions/upload-artifact@v7
        with:
          name: docs-diagrams
          path: app-docs/diagrams/*.svg
          retention-days: 30

  build:
    if: github.event_name == 'release' || inputs.scope != 'pacman-only'
    runs-on: ${{ matrix.os }}
    env:
      # Public verification keys only. Keep signing private keys exclusively in their dedicated
      # runtime/catalog promotion repositories and workflows.
      KORTTY_LLAMA_RUNTIME_PUBLIC_KEY: ${{ vars.KORTTY_LLAMA_RUNTIME_PUBLIC_KEY }}
      KORTTY_AI_CATALOG_PUBLIC_KEY: ${{ vars.KORTTY_AI_CATALOG_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'flatpak-only' && '[{"os":"ubuntu-latest","platform":"linux","arch":"x86_64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"aarch64"}]' || '[{"os":"macos-latest","platform":"macos","arch":"aarch64"},{"os":"macos-15-intel","platform":"macos","arch":"x86_64"},{"os":"windows-latest","platform":"windows","arch":"x86_64"},{"os":"ubuntu-latest","platform":"linux","arch":"x86_64"},{"os":"ubuntu-24.04-arm","platform":"linux","arch":"aarch64"}]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}
          submodules: false

      - name: Validate release license declarations
        shell: bash
        run: python3 scripts/check-release-licenses.py

      - name: Clone SithTermFX (build from source, no token)
        shell: bash
        run: |
          rm -rf vendor/sithtermfx
          git clone --depth 1 --branch v1.2.1 https://github.com/chardonnay/SithTermFX.git vendor/sithtermfx

      - name: Apply pinned korTTY SithTermFX patches
        shell: bash
        run: |
          git -C vendor/sithtermfx apply --unidiff-zero --check ../../patches/sithtermfx/1.2.1-terminal-panel-bottom-row.patch
          git -C vendor/sithtermfx apply --unidiff-zero ../../patches/sithtermfx/1.2.1-terminal-panel-bottom-row.patch

      - name: Patch SithTermFX Maven config for CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pom = Path("vendor/sithtermfx/pom.xml")
          text = pom.read_text(encoding="utf-8")
          if "<artifactId>maven-compiler-plugin</artifactId>" not in text:
              build_block = """    <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>17</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>

          """
              text = text.replace("    <profiles>\n", build_block + "    <profiles>\n", 1)
              pom.write_text(text, encoding="utf-8")
          PY

      - name: Install Maven (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Install Maven (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install maven

      - name: Install Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install maven -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 21 for SithTermFX Maven build
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Save SithTermFX JDK path
        run: echo "SITHTERMFX_JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: "Build SithTermFX with Maven (CI: avoid Gradle Exec PATH/JAVA_HOME issues)"
        shell: bash
        run: |
          MVN_ARGS=(-q -DskipTests -Dmaven.compiler.source=17 -Dmaven.compiler.target=17 -pl "sithtermfx-core,sithtermfx-ui" -am install)
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            MVN_ARGS+=(-Djavafx.platform=win)
          fi
          if [ -d vendor/sithtermfx ] && [ -f vendor/sithtermfx/pom.xml ]; then
            cd vendor/sithtermfx
            export JAVA_HOME="$SITHTERMFX_JDK_HOME"
            mvn "${MVN_ARGS[@]}"
            cd ../..
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate local AI release trust roots
        shell: bash
        run: |
          if [ -z "${KORTTY_LLAMA_RUNTIME_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository variable KORTTY_LLAMA_RUNTIME_PUBLIC_KEY is required for release builds."
            exit 1
          fi
          if printf '%s' "$KORTTY_LLAMA_RUNTIME_PUBLIC_KEY" | grep -qi 'PRIVATE KEY'; then
            echo "::error::KORTTY_LLAMA_RUNTIME_PUBLIC_KEY must never contain private key material."
            exit 1
          fi
          # The AI model/prompt catalog trust root is optional, unlike the llama runtime key above:
          # chardonnay/kortty-ai-catalog and its signing pipeline don't exist yet, so there is nothing
          # for a key to verify. Leaving the variable unset just means generateAiCatalogReleaseConfig
          # skips embedding a trust root and the packaged app falls back to the bundled bootstrap
          # catalog (see build.gradle.kts's aiCatalogPublicKey comment). Only a *malformed* value
          # (set but not a public key) fails the build. Once the catalog repo and its signing
          # environment exist, drop this early-exit block and require the variable like the one above.
          if [ -n "${KORTTY_AI_CATALOG_PUBLIC_KEY:-}" ] && printf '%s' "$KORTTY_AI_CATALOG_PUBLIC_KEY" | grep -qi 'PRIVATE KEY'; then
            echo "::error::KORTTY_AI_CATALOG_PUBLIC_KEY must never contain private key material."
            exit 1
          fi
          if [ -z "${KORTTY_AI_CATALOG_PUBLIC_KEY:-}" ]; then
            echo "::warning::Repository variable KORTTY_AI_CATALOG_PUBLIC_KEY is not set; shipping without the remote AI catalog trust root, the app will use the bundled bootstrap catalog."
          fi
          # The Gradle resource generator performs the authoritative X.509 Ed25519 decode and
          # therefore fails the release before any unsigned/updatable application is packaged.
          ./gradlew generateLlamaRuntimeReleaseConfig generateAiCatalogReleaseConfig

      - name: Validate macOS JDK and architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          canonical_arch() {
            case "$1" in
              arm64|aarch64|ARM64) echo "aarch64" ;;
              x86_64|amd64|x64|X64) echo "x86_64" ;;
              *) echo "$1" ;;
            esac
          }

          java_path="$(command -v java || true)"
          jpackage_path="$(command -v jpackage || true)"
          if [ -z "$java_path" ] || [ -z "$jpackage_path" ]; then
            echo "JDK 25 toolchain is incomplete: java='$java_path', jpackage='$jpackage_path'."
            exit 1
          fi

          java_settings="$(java -XshowSettings:properties -version 2>&1)"
          java_major="$(awk -F' = ' '/^[[:space:]]*java.specification.version = / { print $2; exit }' <<< "$java_settings")"
          java_arch_raw="$(awk -F' = ' '/^[[:space:]]*os.arch = / { print $2; exit }' <<< "$java_settings")"
          jpackage_version="$(jpackage --version 2>&1 | tr -d '\r')"

          if [ "$java_major" != "25" ]; then
            echo "Expected JDK major 25, but java reports '${java_major:-unknown}' ($java_path)."
            exit 1
          fi
          if [[ ! "$jpackage_version" =~ ^25([.]|$) ]]; then
            echo "Expected jpackage major 25, but got '${jpackage_version:-unknown}' ($jpackage_path)."
            exit 1
          fi
          if [ -z "${RUNNER_ARCH:-}" ]; then
            echo "RUNNER_ARCH is not set; cannot validate the GitHub runner architecture."
            exit 1
          fi

          expected_arch="${{ matrix.arch }}"
          runner_arch="$(canonical_arch "$RUNNER_ARCH")"
          machine_arch="$(canonical_arch "$(uname -m)")"
          java_arch="$(canonical_arch "$java_arch_raw")"
          for actual in "$runner_arch" "$machine_arch" "$java_arch"; do
            if [ "$actual" != "$expected_arch" ]; then
              echo "Architecture mismatch: matrix=$expected_arch, RUNNER_ARCH=$RUNNER_ARCH, uname=$(uname -m), java.os.arch=${java_arch_raw:-unknown}."
              exit 1
            fi
          done

          echo "Validated macOS toolchain: java=$java_major, jpackage=$jpackage_version, architecture=$expected_arch."

      - name: Validate Apple signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_CERT_P12_BASE64" ] || [ -z "$APPLE_SIGNING_CERT_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing required Apple signing secrets."
            echo "Please set APPLE_SIGNING_CERT_P12_BASE64, APPLE_SIGNING_CERT_PASSWORD, and APPLE_SIGNING_IDENTITY."
            exit 1
          fi

      - name: Validate Apple notarization secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_ISSUER_ID" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "Missing required Apple notarization secrets."
            echo "Please set APPLE_API_KEY_ID, APPLE_ISSUER_ID, and APPLE_API_KEY."
            exit 1
          fi

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kortty-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_signing_cert.p12"
          security import "$RUNNER_TEMP/apple_signing_cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KORTTY_MAC_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Validate Linux signing secrets
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          if [ -z "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" ] || [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] || [ -z "$LINUX_SIGNING_GPG_KEY_ID" ]; then
            echo "Missing required Linux signing secrets."
            echo "Please set LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64, LINUX_SIGNING_GPG_PASSPHRASE, and LINUX_SIGNING_GPG_KEY_ID."
            exit 1
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg flatpak flatpak-builder appstream

      - name: Import Linux signing key
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/kortty-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          gpg --batch --armor --export "$LINUX_SIGNING_GPG_KEY_ID" > "$GITHUB_WORKSPACE/kortty-linux-signing-public.asc"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ inputs.version }}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "workflow_dispatch input 'version' must be numeric (e.g. 2.1.0) for jpackage."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update build.gradle.kts with release version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" build.gradle.kts

      - name: Set Gradle command
        id: gradle
        shell: bash
        run: echo "cmd=./gradlew" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          fi
          ${{ steps.gradle.outputs.cmd }} clean build

      - name: Install virtual display for Mermaid smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y xvfb

      - name: Verify bundled Mermaid renderer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ${{ steps.gradle.outputs.cmd }} mermaidRendererSmoke
          else
            ${{ steps.gradle.outputs.cmd }} mermaidRendererSmoke
          fi

      - name: Build macOS .app
        if: matrix.platform == 'macos'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} -Pkortty.macos.sign=true -Pkortty.macos.signingIdentity="${{ secrets.APPLE_SIGNING_IDENTITY }}" -Pkortty.macos.signingKeychain="$KORTTY_MAC_SIGNING_KEYCHAIN" jpackage

      - name: Build macOS .dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} -Pkortty.macos.sign=true -Pkortty.macos.signingIdentity="${{ secrets.APPLE_SIGNING_IDENTITY }}" -Pkortty.macos.signingKeychain="$KORTTY_MAC_SIGNING_KEYCHAIN" jpackageDmg

      - name: Validate macOS app launcher architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          launcher="build/jpackage/korTTY.app/Contents/MacOS/korTTY"
          if [ ! -x "$launcher" ]; then
            echo "Expected macOS app launcher not found or not executable: $launcher"
            exit 1
          fi

          case "${{ matrix.arch }}" in
            aarch64) expected_lipo_arch="arm64" ;;
            x86_64) expected_lipo_arch="x86_64" ;;
            *)
              echo "Unsupported macOS matrix architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac

          launcher_archs="$(lipo -archs "$launcher" | xargs)"
          if [ "$launcher_archs" != "$expected_lipo_arch" ]; then
            echo "Launcher architecture mismatch: expected '$expected_lipo_arch' for artifact suffix '${{ matrix.arch }}', got '${launcher_archs:-unknown}'."
            exit 1
          fi

          echo "Validated macOS app launcher architecture: $launcher_archs."

      - name: Store Apple notarization credentials
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials "kortty-notary" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_ISSUER_ID"

      - name: Create macOS notarization ZIP
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd build/jpackage
          ditto -c -k --keepParent korTTY.app korTTY-notarization-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip

      - name: Notarize and staple macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          require_accepted_notarization() {
            local submit_log="$1"
            local submission_id
            local submission_status

            submission_id="$(sed -n 's/^  id: //p' "$submit_log" | tail -n1 | tr -d '\r')"
            submission_status="$(sed -n 's/^  status: //p' "$submit_log" | tail -n1 | tr -d '\r')"

            if [ -z "$submission_id" ]; then
              echo "Unable to determine notarization submission ID."
              exit 1
            fi

            if [ "$submission_status" != "Accepted" ]; then
              echo "Notarization finished with status: ${submission_status:-unknown}"
              echo "Fetching notarization log for submission ID: $submission_id"
              xcrun notarytool log "$submission_id" --keychain-profile "kortty-notary" || true
              exit 1
            fi
          }

          set +e
          xcrun notarytool submit \
            build/jpackage/korTTY-notarization-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip \
            --keychain-profile "kortty-notary" \
            --wait > "$RUNNER_TEMP/notary-app-submit.log" 2>&1
          submit_exit=$?
          cat "$RUNNER_TEMP/notary-app-submit.log"
          if [ $submit_exit -ne 0 ]; then
            require_accepted_notarization "$RUNNER_TEMP/notary-app-submit.log"
            exit $submit_exit
          fi
          require_accepted_notarization "$RUNNER_TEMP/notary-app-submit.log"
          set -e
          xcrun stapler staple build/jpackage/korTTY.app
          xcrun stapler validate build/jpackage/korTTY.app

      # mermaidRendererSmoke above runs pre-jpackage on the unsigned Gradle test classpath, so it
      # cannot see the signing trap at javaFxVersion: a hardened re-sign of libjfxwebkit.dylib kills
      # JavaScriptCore's JIT and the app is SIGKILLed the instant JS executes, with no crash report.
      # This runs JIT-hot JavaScript in a WebView inside the notarized, stapled bundle instead — the
      # same binary users download — so that regression fails the release instead of shipping.
      - name: Verify WebView JavaScript in the signed macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} packagedMacWebViewJitSmoke

      - name: Notarize and staple macOS dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          require_accepted_notarization() {
            local submit_log="$1"
            local submission_id
            local submission_status

            submission_id="$(sed -n 's/^  id: //p' "$submit_log" | tail -n1 | tr -d '\r')"
            submission_status="$(sed -n 's/^  status: //p' "$submit_log" | tail -n1 | tr -d '\r')"

            if [ -z "$submission_id" ]; then
              echo "Unable to determine notarization submission ID."
              exit 1
            fi

            if [ "$submission_status" != "Accepted" ]; then
              echo "Notarization finished with status: ${submission_status:-unknown}"
              echo "Fetching notarization log for submission ID: $submission_id"
              xcrun notarytool log "$submission_id" --keychain-profile "kortty-notary" || true
              exit 1
            fi
          }

          dmg_file="$(find build/jpackage -maxdepth 1 -name 'korTTY-*.dmg' | head -n1)"
          if [ -z "$dmg_file" ]; then
            echo "No DMG found for notarization."
            exit 1
          fi
          set +e
          xcrun notarytool submit "$dmg_file" \
            --keychain-profile "kortty-notary" \
            --wait > "$RUNNER_TEMP/notary-dmg-submit.log" 2>&1
          submit_exit=$?
          cat "$RUNNER_TEMP/notary-dmg-submit.log"
          if [ $submit_exit -ne 0 ]; then
            require_accepted_notarization "$RUNNER_TEMP/notary-dmg-submit.log"
            exit $submit_exit
          fi
          require_accepted_notarization "$RUNNER_TEMP/notary-dmg-submit.log"
          set -e
          xcrun stapler staple "$dmg_file"
          xcrun stapler validate "$dmg_file"

      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackage

      - name: Build Windows .msi
        if: matrix.platform == 'windows'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageMsi

      - name: Build Linux application image
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackage

      - name: Build Linux .deb
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageDeb

      - name: Build Linux .rpm
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageRpm

      - name: Verify MIT license in native app image
        shell: bash
        run: |
          license_copy="$(find build/jpackage -type f -name 'LICENSE-korTTY' | head -n1)"
          if [ -z "$license_copy" ]; then
            echo "The native application image does not contain LICENSE-korTTY."
            exit 1
          fi
          cmp LICENSE "$license_copy"

      - name: Prepare Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p build/release-java
          jar_file="$(ls -1 build/libs/*.jar | head -n1)"
          zip_file="$(ls -1 build/distributions/*.zip | head -n1)"
          tar_file="$(ls -1 build/distributions/*.tar | head -n1)"
          cp "$jar_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar"
          cp "$zip_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip"
          cp "$tar_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar"

      - name: Verify MIT license in Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          jar_file="$(ls -1 build/release-java/*.jar | head -n1)"
          zip_file="$(ls -1 build/release-java/*.zip | head -n1)"
          tar_file="$(ls -1 build/release-java/*.tar | head -n1)"
          unzip -p "$jar_file" META-INF/LICENSE-korTTY > "$RUNNER_TEMP/jar-license"
          zip_license="$(unzip -Z1 "$zip_file" | grep -E '(^|/)LICENSE$' | head -n1)"
          tar_license="$(tar -tf "$tar_file" | grep -E '(^|/)LICENSE$' | head -n1)"
          test -n "$zip_license" && test -n "$tar_license"
          unzip -p "$zip_file" "$zip_license" > "$RUNNER_TEMP/zip-license"
          tar -xOf "$tar_file" "$tar_license" > "$RUNNER_TEMP/tar-license"
          cmp LICENSE "$RUNNER_TEMP/jar-license"
          cmp LICENSE "$RUNNER_TEMP/zip-license"
          cmp LICENSE "$RUNNER_TEMP/tar-license"

      - name: Sign Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/release-java
          for f in "korTTY-Java-${{ steps.version.outputs.version }}.jar" \
                   "korTTY-Java-${{ steps.version.outputs.version }}.zip" \
                   "korTTY-Java-${{ steps.version.outputs.version }}.tar"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
              --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
              --output "$f.sig" \
              --detach-sign "$f"
          done

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          cd build/jpackage
          zip -r korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip korTTY.app
          if ls korTTY-*.dmg 1> /dev/null 2>&1; then
            cp korTTY-*.dmg korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          fi

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $jpackageDir = Join-Path $env:GITHUB_WORKSPACE "build/jpackage"
          Set-Location $jpackageDir
          $artifactBase = "korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          $appImage = Join-Path $jpackageDir "korTTY"
          if (-not (Test-Path -Path $appImage -PathType Container)) {
            Write-Error "Complete Windows application image not found at build/jpackage/korTTY."
            exit 1
          }
          $appJar = Get-ChildItem -Path (Join-Path $appImage "app") -Filter "korTTY-*.jar" -File -ErrorAction SilentlyContinue
          $jvm = Get-ChildItem -Path (Join-Path $appImage "runtime") -Filter "jvm.dll" -File -Recurse -ErrorAction SilentlyContinue
          $launcher = Get-ChildItem -Path $appImage -Filter "korTTY.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $logicalBytes = (Get-ChildItem -Path $appImage -File -Recurse | Measure-Object -Property Length -Sum).Sum
          if (-not $appJar -or -not $jvm -or $logicalBytes -lt 100MB) {
            Write-Error "Windows app image is incomplete (appJar=$($appJar.Count), jvm=$($jvm.Count), bytes=$logicalBytes)."
            Get-ChildItem -Path $appImage -Recurse | Select-Object -First 100
            exit 1
          }
          function Get-PeMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { return -1 }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { return -1 }
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          if (-not $launcher) {
            Write-Error "Windows launcher korTTY.exe not found in $appImage."
            exit 1
          }
          $launcherMachine = Get-PeMachine $launcher.FullName
          $jvmMachine = Get-PeMachine $jvm[0].FullName
          if ($launcherMachine -ne 0x8664 -or $jvmMachine -ne 0x8664) {
            Write-Error "Windows x86_64 artifact has the wrong PE machine (launcher=0x$('{0:X4}' -f $launcherMachine), jvm=0x$('{0:X4}' -f $jvmMachine))."
            exit 1
          }
          Compress-Archive -Path $appImage -DestinationPath (Join-Path $jpackageDir "$artifactBase.zip") -Force
          if (Test-Path korTTY-*.msi) {
            $msiFile = Get-Item korTTY-*.msi | Select-Object -First 1
            Copy-Item $msiFile.FullName "$artifactBase.msi"
          }

      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          cd build/jpackage
          if [ -d "korTTY" ]; then
            app_dir="korTTY"
          elif [ -d "kortty" ]; then
            app_dir="kortty"
          else
            echo "Linux app-image directory not found in build/jpackage"
            ls -la
            exit 1
          fi
          tar -czf kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz "$app_dir"
          zip -r kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip "$app_dir"
          for f in kortty*.deb; do [ -f "$f" ] && cp "$f" "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb" && break; done
          for f in kortty*.rpm; do [ -f "$f" ] && cp "$f" "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm" && break; done

      - name: Verify MIT license in Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          app_dir="$(find build/jpackage -maxdepth 1 -type d \( -name korTTY -o -name kortty \) | head -n1)"
          test -n "$app_dir"
          license_copy="$(find "$app_dir" -type f -name 'LICENSE-korTTY' | head -n1)"
          test -n "$license_copy"
          cmp LICENSE "$license_copy"

          deb="build/jpackage/kortty-Linux-${VERSION}-${ARCH}.deb"
          rpm="build/jpackage/kortty-Linux-${VERSION}-${ARCH}.rpm"
          dpkg-deb -c "$deb" | grep -E '/(LICENSE|LICENSE-korTTY|copyright)$'
          test "$(rpm -qp --queryformat '%{LICENSE}' "$rpm")" = "MIT"
          rpm -qlp "$rpm" | grep -E '/LICENSE$'

      - name: Build and smoke-test Flatpak bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          APP_ID="io.github.chardonnay.korTTY"
          BUNDLE="$GITHUB_WORKSPACE/build/jpackage/kortty-Linux-${VERSION}-${ARCH}.flatpak"

          appstreamcli validate --no-net package/flatpak/${APP_ID}.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

          rm -rf build/flatpak-build build/flatpak-repo .flatpak-builder
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=build/flatpak-repo --default-branch=stable \
            build/flatpak-build package/flatpak/${APP_ID}.yml
          cmp LICENSE "build/flatpak-build/files/share/licenses/${APP_ID}/LICENSE"
          flatpak build-bundle --arch="$ARCH" build/flatpak-repo "$BUNDLE" "$APP_ID" stable

          flatpak install --user --noninteractive "$BUNDLE"
          test "$(flatpak info --user --show-ref "$APP_ID")" = "app/${APP_ID}/${ARCH}/stable"
          test "$(dbus-run-session -- flatpak run --command=flatpak-spawn "$APP_ID" --host sh -lc 'printf kortty-flatpak-host-ok')" = \
            "kortty-flatpak-host-ok"
          dbus-run-session -- xvfb-run -a timeout 90 flatpak run "$APP_ID" --webview-jit-smoke
          flatpak uninstall --user --noninteractive "$APP_ID"

      - name: Sign RPM package
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/jpackage
          rpm_file="kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm"
          if [ -f "$rpm_file" ]; then
            {
              printf '%s\n' '%_signature gpg'
              printf '%s\n' "%_gpg_name $LINUX_SIGNING_GPG_KEY_ID"
              printf '%s\n' "%_gpg_path $GNUPGHOME"
              printf '%s\n' '%__gpg /usr/bin/gpg'
              printf '%s\n' '%__gpg_sign_cmd %{__gpg} \'
              printf '%s\n' '  gpg --batch --no-verbose --no-armor --pinentry-mode loopback \'
              printf '%s\n' "  --passphrase '$LINUX_SIGNING_GPG_PASSPHRASE' \\"
              printf '%s\n' "  --local-user '%{_gpg_name}' \\"
              printf '%s\n' '  --detach-sign --sign --output %{__signature_filename} %{__plaintext_filename}'
            } > "$HOME/.rpmmacros"
            rpmsign --addsign "$rpm_file"
          fi

      - name: Report and enforce native package sizes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"
          REPORT_DIR="build/package-size"
          mkdir -p "$REPORT_DIR"
          args=(--baselines package/size-baselines.json --fail-on-budget --min-app-bytes 104857600)
          case "$PLATFORM:$ARCH" in
            # 190 MiB, raised from 180 with the JavaFX 21.0.12 bump: two years of WebKit patches
            # grew javafx-web from 29.9 to 38.7 MB, which put the Intel app image at 183.7 MiB.
            # The DMG side of the same growth is in package/size-baselines.json.
            macos:aarch64)
              args+=(--app-image build/jpackage/korTTY.app --max-app-bytes 199229440)
              args+=(--artifact "macos-aarch64-dmg=build/jpackage/korTTY-macOS-${VERSION}-${ARCH}.dmg")
              ;;
            macos:x86_64)
              args+=(--app-image build/jpackage/korTTY.app --max-app-bytes 199229440)
              args+=(--artifact "macos-x86_64-dmg=build/jpackage/korTTY-macOS-${VERSION}-${ARCH}.dmg")
              ;;
            windows:*)
              args+=(--app-image build/jpackage/korTTY)
              args+=(--artifact "windows-${ARCH}-msi=build/jpackage/korTTY-Windows-${VERSION}-${ARCH}.msi")
              ;;
            linux:*)
              if [ -d build/jpackage/korTTY ]; then app_dir=build/jpackage/korTTY; else app_dir=build/jpackage/kortty; fi
              args+=(--app-image "$app_dir")
              args+=(--artifact "linux-${ARCH}-deb=build/jpackage/kortty-Linux-${VERSION}-${ARCH}.deb")
              args+=(--artifact "linux-${ARCH}-rpm=build/jpackage/kortty-Linux-${VERSION}-${ARCH}.rpm")
              ;;
          esac
          python3 scripts/package-size-report.py "${args[@]}" \
            --output-json "$REPORT_DIR/${PLATFORM}-${ARCH}.json" \
            --output-markdown "$REPORT_DIR/${PLATFORM}-${ARCH}.md"

      - name: Upload package size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-size-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/package-size/*
          if-no-files-found: warn
          retention-days: 30

      - name: Sign Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/jpackage
          for f in "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak"; do
            if [ -f "$f" ]; then
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
                --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
                --output "$f.sig" \
                --detach-sign "$f"
            fi
          done

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}.msi
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: korTTY-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sig
            kortty-linux-signing-public.asc
          retention-days: 30

      - name: Upload Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: korTTY-Java-${{ steps.version.outputs.version }}
          path: |
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar.sig
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip.sig
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar.sig
            kortty-linux-signing-public.asc
          retention-days: 30

  build-pacman:
    name: Build pacman (Arch Linux ${{ matrix.arch }})
    needs: build
    if: success() && (github.event_name == 'release' || inputs.scope == 'all')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Validate Linux signing secrets
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          if [ -z "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" ] || [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] || [ -z "$LINUX_SIGNING_GPG_KEY_ID" ]; then
            echo "Missing required Linux signing secrets."
            echo "Please set LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64, LINUX_SIGNING_GPG_PASSPHRASE, and LINUX_SIGNING_GPG_KEY_ID."
            exit 1
          fi

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: korTTY-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: linux-artifact

      - name: Install build dependencies (Arch)
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel binutils git gnupg jdk-openjdk libarchive
          useradd -m -s /bin/bash builder

      - name: Import Linux signing key
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
          EXPECTED_FINGERPRINT: 270E6DE92A8BB6D1841F758B9D2F81982AAD80CC
        run: |
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --fingerprint "$LINUX_SIGNING_GPG_KEY_ID" | awk -F: '$1 == "fpr" {print $10; exit}')"
          [ "$fingerprint" = "$EXPECTED_FINGERPRINT" ] || { echo "Unexpected signing-key fingerprint: $fingerprint"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build and verify pacman package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          linux_tar="$(find linux-artifact -type f -name "kortty-Linux-${VERSION}-${ARCH}.tar.gz" -print -quit)"
          if [ -z "$linux_tar" ]; then
            echo "Expected Linux tarball not found in downloaded artifact."
            find linux-artifact -maxdepth 3 -type f | sort
            exit 1
          fi
          rm -rf /home/builder/pacman-input /home/builder/pacman-output archbuild
          mkdir -p /home/builder/pacman-input /home/builder/pacman-output archbuild
          cp "$linux_tar" "/home/builder/pacman-input/kortty-Linux-${VERSION}-${ARCH}.tar.gz"
          chown -R builder:builder /home/builder/pacman-input /home/builder/pacman-output
          su builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/package-pacman.sh '$VERSION' 1 '$ARCH' '/home/builder/pacman-input/kortty-Linux-${VERSION}-${ARCH}.tar.gz' /home/builder/pacman-output"
          expected="kortty-${VERSION}-1-${ARCH}.pkg.tar.zst"
          test -f "/home/builder/pacman-output/$expected"
          cp "/home/builder/pacman-output/$expected" archbuild/
          if find /home/builder/pacman-output -maxdepth 1 -type f -name '*-debug-*.pkg.tar.zst' -print -quit | grep -q .; then
            echo 'Unexpected debug package was produced.'
            exit 1
          fi

      - name: Sign pacman package
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          pkg_file="archbuild/kortty-${{ steps.version.outputs.version }}-1-${{ matrix.arch }}.pkg.tar.zst"
          test -f "$pkg_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
            --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
            --output "${pkg_file}.sig" \
            --detach-sign "$pkg_file"
          gpg --batch --verify "${pkg_file}.sig" "$pkg_file"

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v7
        with:
          name: KorTTY-Arch-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            archbuild/kortty-${{ steps.version.outputs.version }}-1-${{ matrix.arch }}.pkg.tar.zst
            archbuild/kortty-${{ steps.version.outputs.version }}-1-${{ matrix.arch }}.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 30

  build-pacman-backfill:
    name: Backfill pacman (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'pacman-only'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Validate Linux signing secrets
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          if [ -z "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" ] || [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] || [ -z "$LINUX_SIGNING_GPG_KEY_ID" ]; then
            echo 'Missing required Linux signing secrets.'
            exit 1
          fi

      - name: Install build and verification dependencies
        shell: bash
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel binutils git github-cli gnupg jdk-openjdk jq libarchive python
          useradd -m -s /bin/bash builder

      - name: Checkout packaging source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate backfill inputs and source tag
        id: backfill
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PKGREL="${{ inputs.pacman_pkgrel }}"
          EXPECTED_COMMIT="${{ inputs.expected_tag_commit }}"
          SOURCE_TAG="v${VERSION}"
          RELEASE_TAG="${{ inputs.release_tag }}"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          [[ "$PKGREL" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid pacman pkgrel: $PKGREL"; exit 1; }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'pacman-only requires a 40-character expected_tag_commit.'; exit 1; }
          if [ "$RELEASE_TAG" != 'ci-only' ] && [ "$RELEASE_TAG" != "$SOURCE_TAG" ]; then
            echo "pacman-only release_tag must be ci-only or $SOURCE_TAG."
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          ACTUAL_COMMIT="$(git rev-list -n 1 "$SOURCE_TAG")"
          if [ "${ACTUAL_COMMIT,,}" != "${EXPECTED_COMMIT,,}" ]; then
            echo "$SOURCE_TAG resolves to $ACTUAL_COMMIT, expected $EXPECTED_COMMIT."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse immutable release or existing backfill assets
        if: startsWith(inputs.release_tag, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.backfill.outputs.source_tag }}"
          immutable="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)"
          [ "$immutable" = false ] || { echo "Release $TAG is immutable; refusing backfill."; exit 1; }
          existing="$RUNNER_TEMP/existing-assets-${{ matrix.arch }}.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$existing"
          for candidate in \
            "kortty-${{ steps.backfill.outputs.version }}-${{ steps.backfill.outputs.pkgrel }}-${{ matrix.arch }}.pkg.tar.zst" \
            "kortty-${{ steps.backfill.outputs.version }}-${{ steps.backfill.outputs.pkgrel }}-${{ matrix.arch }}.pkg.tar.zst.sig"; do
            if grep -Fxq "$candidate" "$existing"; then
              echo "Refusing to replace existing release asset: $candidate"
              exit 1
            fi
          done

      - name: Download and verify signed release tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: 270E6DE92A8BB6D1841F758B9D2F81982AAD80CC
        run: |
          VERSION="${{ steps.backfill.outputs.version }}"
          SOURCE_TAG="${{ steps.backfill.outputs.source_tag }}"
          ARCH="${{ matrix.arch }}"
          tarball="kortty-Linux-${VERSION}-${ARCH}.tar.gz"
          signature="${tarball}.sig"
          public_key='kortty-linux-signing-public.asc'
          mkdir -p release-input
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-input \
            --pattern "$tarball" --pattern "$signature" --pattern "$public_key"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${SOURCE_TAG}" > release-input/release.json

          verify_github_digest() {
            local filename=$1
            local expected actual
            expected="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest' release-input/release.json)"
            [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing GitHub SHA-256 digest for $filename: $expected"; exit 1; }
            actual="sha256:$(sha256sum "release-input/$filename" | awk '{print $1}')"
            [ "$actual" = "$expected" ] || { echo "Digest mismatch for $filename: $actual != $expected"; exit 1; }
          }
          verify_github_digest "$tarball"
          verify_github_digest "$signature"
          verify_github_digest "$public_key"

          export GNUPGHOME="$PWD/.gnupg-release-verification"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          mapfile -t primary_fingerprints < <(gpg --batch --show-keys --with-colons "release-input/$public_key" | awk -F: '$1 == "pub" {want_fpr=1; next} want_fpr && $1 == "fpr" {print $10; want_fpr=0}')
          if [ "${#primary_fingerprints[@]}" -ne 1 ] || [ "${primary_fingerprints[0]}" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Release key must contain exactly one pinned primary key; found: ${primary_fingerprints[*]:-(none)}"
            exit 1
          fi
          gpg --batch --import "release-input/$public_key"
          signature_status="$RUNNER_TEMP/release-signature-${ARCH}.status"
          gpg --batch --status-fd 1 --verify "release-input/$signature" "release-input/$tarball" > "$signature_status"
          awk -v expected="$EXPECTED_FINGERPRINT" '
            $1 == "[GNUPG:]" && $2 == "VALIDSIG" {count++; if ($3 == expected || $NF == expected) matched=1}
            END {exit !(count == 1 && matched)}
          ' "$signature_status" || { echo "Release signature was not made by pinned key $EXPECTED_FINGERPRINT."; exit 1; }

      - name: Import Linux signing key
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
          EXPECTED_FINGERPRINT: 270E6DE92A8BB6D1841F758B9D2F81982AAD80CC
        run: |
          export GNUPGHOME="$PWD/.gnupg-signing"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --fingerprint "$LINUX_SIGNING_GPG_KEY_ID" | awk -F: '$1 == "fpr" {print $10; exit}')"
          [ "$fingerprint" = "$EXPECTED_FINGERPRINT" ] || { echo "Unexpected signing-key fingerprint: $fingerprint"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build and verify corrected pacman package
        shell: bash
        run: |
          VERSION="${{ steps.backfill.outputs.version }}"
          PKGREL="${{ steps.backfill.outputs.pkgrel }}"
          ARCH="${{ matrix.arch }}"
          rm -rf /home/builder/pacman-input /home/builder/pacman-output archbuild
          mkdir -p /home/builder/pacman-input /home/builder/pacman-output archbuild
          cp "release-input/kortty-Linux-${VERSION}-${ARCH}.tar.gz" /home/builder/pacman-input/
          chown -R builder:builder /home/builder/pacman-input /home/builder/pacman-output
          su builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/package-pacman.sh '$VERSION' '$PKGREL' '$ARCH' '/home/builder/pacman-input/kortty-Linux-${VERSION}-${ARCH}.tar.gz' /home/builder/pacman-output"
          expected="kortty-${VERSION}-${PKGREL}-${ARCH}.pkg.tar.zst"
          test -f "/home/builder/pacman-output/$expected"
          cp "/home/builder/pacman-output/$expected" archbuild/
          if find /home/builder/pacman-output -maxdepth 1 -type f -name '*-debug-*.pkg.tar.zst' -print -quit | grep -q .; then
            echo 'Unexpected debug package was produced.'
            exit 1
          fi

      - name: Sign and verify corrected pacman package
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          pkg_file="archbuild/kortty-${{ steps.backfill.outputs.version }}-${{ steps.backfill.outputs.pkgrel }}-${{ matrix.arch }}.pkg.tar.zst"
          test -f "$pkg_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
            --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
            --output "${pkg_file}.sig" \
            --detach-sign "$pkg_file"
          gpg --batch --verify "${pkg_file}.sig" "$pkg_file"

      - name: Upload backfill artifact for inspection
        uses: actions/upload-artifact@v7
        with:
          name: KorTTY-Arch-backfill-${{ steps.backfill.outputs.version }}-${{ matrix.arch }}
          path: |
            archbuild/kortty-${{ steps.backfill.outputs.version }}-${{ steps.backfill.outputs.pkgrel }}-${{ matrix.arch }}.pkg.tar.zst
            archbuild/kortty-${{ steps.backfill.outputs.version }}-${{ steps.backfill.outputs.pkgrel }}-${{ matrix.arch }}.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 30

  publish-pacman-backfill:
    name: Publish pacman backfill
    needs: build-pacman-backfill
    if: >-
      always() &&
      needs.build-pacman-backfill.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.scope == 'pacman-only' &&
      startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout packaging source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download backfill artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: KorTTY-Arch-backfill-${{ inputs.version }}-*
          path: release
          merge-multiple: true

      - name: Install package verification tools
        run: sudo apt-get update && sudo apt-get install -y binutils libarchive-tools

      - name: Verify exact backfill set, packages, and signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: 270E6DE92A8BB6D1841F758B9D2F81982AAD80CC
        run: |
          VERSION="${{ inputs.version }}"
          PKGREL="${{ inputs.pacman_pkgrel }}"
          TAG="${{ inputs.release_tag }}"
          expected="$RUNNER_TEMP/expected-backfill-assets.txt"
          actual="$RUNNER_TEMP/actual-backfill-assets.txt"
          for arch in aarch64 x86_64; do
            echo "kortty-${VERSION}-${PKGREL}-${arch}.pkg.tar.zst"
            echo "kortty-${VERSION}-${PKGREL}-${arch}.pkg.tar.zst.sig"
          done | sort > "$expected"
          find release -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"

          public_key="$RUNNER_TEMP/kortty-linux-signing-public.asc"
          release_json="$RUNNER_TEMP/source-release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'kortty-linux-signing-public.asc' --output "$public_key"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
          expected_key_digest="$(jq -r '.assets[] | select(.name == "kortty-linux-signing-public.asc") | .digest' "$release_json")"
          actual_key_digest="sha256:$(sha256sum "$public_key" | awk '{print $1}')"
          [ "$actual_key_digest" = "$expected_key_digest" ] || { echo 'Release public-key digest mismatch.'; exit 1; }
          mapfile -t primary_fingerprints < <(gpg --batch --show-keys --with-colons "$public_key" | awk -F: '$1 == "pub" {want_fpr=1; next} want_fpr && $1 == "fpr" {print $10; want_fpr=0}')
          if [ "${#primary_fingerprints[@]}" -ne 1 ] || [ "${primary_fingerprints[0]}" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Release key must contain exactly one pinned primary key; found: ${primary_fingerprints[*]:-(none)}"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/backfill-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import "$public_key"

          verify_pinned_signature() {
            local signature=$1
            local payload=$2
            local status=$3
            gpg --batch --status-fd 1 --verify "$signature" "$payload" > "$status"
            awk -v expected="$EXPECTED_FINGERPRINT" '
              $1 == "[GNUPG:]" && $2 == "VALIDSIG" {count++; if ($3 == expected || $NF == expected) matched=1}
              END {exit !(count == 1 && matched)}
            ' "$status" || { echo "Signature for $payload was not made by pinned key $EXPECTED_FINGERPRINT."; exit 1; }
          }

          for arch in aarch64 x86_64; do
            package="release/kortty-${VERSION}-${PKGREL}-${arch}.pkg.tar.zst"
            ./scripts/verify-pacman-package.sh "$package" "$VERSION" "$PKGREL" "$arch" LICENSE package/arch/kortty.desktop
            verify_pinned_signature "${package}.sig" "$package" "$RUNNER_TEMP/package-signature-${arch}.status"
          done

      - name: Refuse immutable release or existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          immutable="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)"
          [ "$immutable" = false ] || { echo "Release $TAG is immutable; refusing backfill."; exit 1; }
          existing="$RUNNER_TEMP/existing-assets.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$existing"
          while IFS= read -r candidate; do
            if grep -Fxq "$candidate" "$existing"; then
              echo "Refusing to replace existing release asset: $candidate"
              exit 1
            fi
          done < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Capture local SHA-256 digests
        shell: bash
        run: |
          (cd release && sha256sum *) > "$RUNNER_TEMP/local-backfill-sha256.txt"

      - name: Recheck collisions and upload without clobbering
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          existing="$RUNNER_TEMP/existing-assets-immediate.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$existing"
          while IFS= read -r candidate; do
            if grep -Fxq "$candidate" "$existing"; then
              echo "Release asset appeared after preflight; refusing upload: $candidate"
              exit 1
            fi
          done < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/*

      - name: Verify uploaded GitHub digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          release_json="$RUNNER_TEMP/uploaded-release.json"
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
            complete=true
            while read -r local_sha filename; do
              remote="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest' "$release_json")"
              if [ "$remote" != "sha256:$local_sha" ]; then
                complete=false
                break
              fi
            done < "$RUNNER_TEMP/local-backfill-sha256.txt"
            [ "$complete" = true ] && exit 0
            [ "$attempt" -eq 5 ] || sleep 2
          done
          echo 'Uploaded GitHub digests do not match the local SHA-256 values.'
          exit 1

      - name: Update release download guide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          PACMAN_PKGREL: ${{ inputs.pacman_pkgrel }}
        run: |
          body="$RUNNER_TEMP/release-body.md"
          assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$body"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$assets"
          python3 scripts/update_release_download_guide.py \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" \
            --pacman-pkgrel "$PACMAN_PKGREL" --body "$body" --assets "$assets" --output "$body"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body"

  upload-release:
    needs: [build, build-pacman, docs-render]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.build-pacman.result == 'success' || needs.build-pacman.result == 'skipped') &&
      (needs.docs-render.result == 'success' || needs.docs-render.result == 'skipped') &&
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'pacman-only' && startsWith(inputs.release_tag, 'v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}

      - name: Determine release tag and version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release upload requires a tag ref like v2.1.0."
            exit 1
          fi
          VERSION="$TAG"
          VERSION=${VERSION#v}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "release_tag version '$VERSION' does not match input version '${{ inputs.version }}'."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        env:
          RELEASE_SCOPE: ${{ github.event_name == 'release' && 'all' || inputs.scope }}
        run: |
          mkdir -p release
          if [ "$RELEASE_SCOPE" = "flatpak-only" ]; then
            find artifacts -type f \( -name '*.flatpak' -o -name '*.flatpak.sig' \) -exec cp {} release/ \;
          else
            find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.tar' -o -name '*.jar' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' -o -name '*.pkg.tar.zst' -o -name '*.sig' -o -name '*.asc' \) -exec cp {} release/ \;
          fi
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Add docs diagram SVGs to release
        if: github.event_name == 'release' || inputs.scope != 'flatpak-only'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [ -d "artifacts/docs-diagrams" ]; then
            cd artifacts/docs-diagrams
            zip -r "../../release/KorTTY-docs-diagrams-${VERSION}.zip" . -i "*.svg"
            cd ../..
          fi

      - name: Refuse to replace existing assets in Flatpak-only mode
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'flatpak-only'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing="$RUNNER_TEMP/existing-assets.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$existing"
          while IFS= read -r candidate; do
            if grep -Fxq "$candidate" "$existing"; then
              echo "Refusing to replace existing release asset: $candidate"
              exit 1
            fi
          done < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release.outputs.tag }}
          files: release/*

      - name: Add grouped download guide to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          body="$RUNNER_TEMP/release-body.md"
          assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$body"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$assets"
          python3 scripts/update_release_download_guide.py \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" \
            --pacman-pkgrel auto --body "$body" --assets "$assets" --output "$body"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body"
