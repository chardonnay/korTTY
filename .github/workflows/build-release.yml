name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch or tag)'
        required: false
        default: 'main'
      version:
        description: 'Numeric app version for jpackage (e.g. 1.4.0)'
        required: false
        default: '1.4.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref }}
          submodules: false

      - name: Clone JediTermFX for CI (avoids missing submodule ref)
        shell: bash
        run: |
          rm -rf vendor/jeditermfx
          git clone --depth 1 https://github.com/techsenger/jeditermfx.git vendor/jeditermfx

      - name: Set up JDK 21 (Windows ARM runner)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          architecture: 'x64'
          distribution: 'temurin'

      - name: Set up JDK 25
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Apple signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_CERT_P12_BASE64" ] || [ -z "$APPLE_SIGNING_CERT_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing required Apple signing secrets."
            echo "Please set APPLE_SIGNING_CERT_P12_BASE64, APPLE_SIGNING_CERT_PASSWORD, and APPLE_SIGNING_IDENTITY."
            exit 1
          fi

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_CERT_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kortty-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_signing_cert.p12"
          security import "$RUNNER_TEMP/apple_signing_cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "KORTTY_MAC_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Validate Linux signing secrets
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          if [ -z "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" ] || [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] || [ -z "$LINUX_SIGNING_GPG_KEY_ID" ]; then
            echo "Missing required Linux signing secrets."
            echo "Please set LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64, LINUX_SIGNING_GPG_PASSPHRASE, and LINUX_SIGNING_GPG_KEY_ID."
            exit 1
          fi

      - name: Install Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install maven -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install WiX Toolset (Windows ARM runner)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP "wix314"
          New-Item -ItemType Directory -Path $wixDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$wixDir\\wix314-binaries.zip"
          Expand-Archive -Path "$wixDir\\wix314-binaries.zip" -DestinationPath $wixDir -Force
          $wixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg

      - name: Import Linux signing key
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/kortty-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/kortty-linux-signing.key"
          gpg --batch --import "$RUNNER_TEMP/kortty-linux-signing.key"
          gpg --batch --armor --export "$LINUX_SIGNING_GPG_KEY_ID" > "$GITHUB_WORKSPACE/kortty-linux-signing-public.asc"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "workflow_dispatch input 'version' must be numeric (e.g. 1.7.0) for jpackage."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update build.gradle.kts with release version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" build.gradle.kts

      - name: Set Gradle command
        id: gradle
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "cmd=./gradlew -Pjavafx.platform=windows-x86_64 -Pkortty.javaVersion=21" >> $GITHUB_OUTPUT
          else
            echo "cmd=./gradlew" >> $GITHUB_OUTPUT
          fi

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} clean build

      - name: Build macOS .app
        if: matrix.platform == 'macos'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} -Pkortty.macos.sign=true -Pkortty.macos.signingIdentity="${{ secrets.APPLE_SIGNING_IDENTITY }}" -Pkortty.macos.signingKeychain="$KORTTY_MAC_SIGNING_KEYCHAIN" jpackage

      - name: Build macOS .dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} -Pkortty.macos.sign=true -Pkortty.macos.signingIdentity="${{ secrets.APPLE_SIGNING_IDENTITY }}" -Pkortty.macos.signingKeychain="$KORTTY_MAC_SIGNING_KEYCHAIN" jpackageDmg

      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackage

      - name: Build Windows .msi
        if: matrix.platform == 'windows'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageMsi

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackage

      - name: Build Linux .deb
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageDeb

      - name: Build Linux .rpm
        if: matrix.platform == 'linux'
        shell: bash
        run: ${{ steps.gradle.outputs.cmd }} jpackageRpm

      - name: Prepare Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p build/release-java
          jar_file="$(ls -1 build/libs/*.jar | head -n1)"
          zip_file="$(ls -1 build/distributions/*.zip | head -n1)"
          tar_file="$(ls -1 build/distributions/*.tar | head -n1)"
          cp "$jar_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar"
          cp "$zip_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip"
          cp "$tar_file" "build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar"

      - name: Sign Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/release-java
          for f in "korTTY-Java-${{ steps.version.outputs.version }}.jar" \
                   "korTTY-Java-${{ steps.version.outputs.version }}.zip" \
                   "korTTY-Java-${{ steps.version.outputs.version }}.tar"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
              --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
              --output "$f.sig" \
              --detach-sign "$f"
          done

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          cd build/jpackage
          zip -r korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip korTTY.app
          if ls korTTY-*.dmg 1> /dev/null 2>&1; then
            cp korTTY-*.dmg korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          fi

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd build/jpackage
          $artifactBase = "korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          if ("${{ matrix.arch }}" -eq "arm64") {
            $exeFile = Get-Item "korTTY\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exeFile) {
              $exeFile = Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.Name -ieq "korTTY.exe" } | Select-Object -First 1
            }
            if (-not $exeFile) {
              Write-Error "No executable found for Windows ARM64 app-image in build/jpackage."
              exit 1
            }
            Compress-Archive -Path $exeFile.FullName -DestinationPath "$artifactBase.zip" -Force
          } else {
            Compress-Archive -Path korTTY -DestinationPath "$artifactBase.zip" -Force
          }
          if (Test-Path korTTY-*.msi) {
            $msiFile = Get-Item korTTY-*.msi | Select-Object -First 1
            Copy-Item $msiFile.FullName "$artifactBase.msi"
          }

      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          cd build/jpackage
          if [ -d "korTTY" ]; then
            app_dir="korTTY"
          elif [ -d "kortty" ]; then
            app_dir="kortty"
          else
            echo "Linux app-image directory not found in build/jpackage"
            ls -la
            exit 1
          fi
          tar -czf kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz "$app_dir"
          zip -r kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip "$app_dir"
          for f in kortty*.deb; do [ -f "$f" ] && cp "$f" "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb" && break; done
          for f in kortty*.rpm; do [ -f "$f" ] && cp "$f" "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm" && break; done

      - name: Sign RPM package
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/jpackage
          rpm_file="kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm"
          if [ -f "$rpm_file" ]; then
            {
              printf '%s\n' '%_signature gpg'
              printf '%s\n' "%_gpg_name $LINUX_SIGNING_GPG_KEY_ID"
              printf '%s\n' "%_gpg_path $GNUPGHOME"
              printf '%s\n' '%__gpg /usr/bin/gpg'
              printf '%s\n' '%__gpg_sign_cmd %{__gpg} \'
              printf '%s\n' '  gpg --batch --no-verbose --no-armor --pinentry-mode loopback \'
              printf '%s\n' "  --passphrase '$LINUX_SIGNING_GPG_PASSPHRASE' \\"
              printf '%s\n' "  --local-user '%{_gpg_name}' \\"
              printf '%s\n' '  --detach-sign --sign --output %{__signature_filename} %{__plaintext_filename}'
            } > "$HOME/.rpmmacros"
            rpmsign --addsign "$rpm_file"
          fi

      - name: Sign Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          cd build/jpackage
          for f in "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb" \
                   "kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm"; do
            if [ -f "$f" ]; then
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
                --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
                --output "$f.sig" \
                --detach-sign "$f"
            fi
          done

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/korTTY-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/korTTY-Windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}.msi
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.zip.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.deb.sig
            build/jpackage/kortty-Linux-${{ steps.version.outputs.version }}-${{ matrix.arch }}.rpm.sig
            kortty-linux-signing-public.asc
          retention-days: 30

      - name: Upload Java artifacts
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-Java-${{ steps.version.outputs.version }}
          path: |
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.jar.sig
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.zip.sig
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar
            build/release-java/korTTY-Java-${{ steps.version.outputs.version }}.tar.sig
            kortty-linux-signing-public.asc
          retention-days: 30

  build-pacman:
    name: Build pacman (Arch Linux)
    needs: build
    if: success()
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Validate Linux signing secrets
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          if [ -z "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" ] || [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] || [ -z "$LINUX_SIGNING_GPG_KEY_ID" ]; then
            echo "Missing required Linux signing secrets."
            echo "Please set LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64, LINUX_SIGNING_GPG_PASSPHRASE, and LINUX_SIGNING_GPG_KEY_ID."
            exit 1
          fi

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.ref }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: korTTY-Linux-${{ steps.version.outputs.version }}-x86_64
          path: linux-artifact

      - name: Install build dependencies (Arch)
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel git jdk-openjdk gnupg
          useradd -m -s /bin/bash builder

      - name: Import Linux signing key
        shell: bash
        env:
          LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "$LINUX_SIGNING_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$PWD/kortty-linux-signing.key"
          gpg --batch --import "$PWD/kortty-linux-signing.key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Prepare PKGBUILD and sources
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH=x86_64
          mkdir -p archbuild
          linux_tar="$(find linux-artifact -type f -name "kortty-Linux-${VERSION}-${ARCH}.tar.gz" | head -n1)"
          if [ -z "$linux_tar" ]; then
            echo "Expected Linux tarball not found in downloaded artifact."
            find linux-artifact -maxdepth 3 -type f | sort
            exit 1
          fi
          cp "$linux_tar" archbuild/
          cp package/arch/kortty.desktop archbuild/
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" package/arch/PKGBUILD > archbuild/PKGBUILD

      - name: Build pacman package
        run: |
          rm -rf /home/builder/archbuild
          cp -a archbuild /home/builder/
          chown -R builder:builder /home/builder/archbuild
          su builder -c "cd /home/builder/archbuild && makepkg --noconfirm --clean"
          cp /home/builder/archbuild/*.pkg.tar.zst archbuild/

      - name: Sign pacman package
        shell: bash
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
          LINUX_SIGNING_GPG_KEY_ID: ${{ secrets.LINUX_SIGNING_GPG_KEY_ID }}
        run: |
          pkg_file="$(ls -1 archbuild/*.pkg.tar.zst | head -n1)"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
            --local-user "$LINUX_SIGNING_GPG_KEY_ID" \
            --output "${pkg_file}.sig" \
            --detach-sign "$pkg_file"

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: KorTTY-Arch-${{ steps.version.outputs.version }}-x86_64
          path: |
            archbuild/*.pkg.tar.zst
            archbuild/*.pkg.tar.zst.sig
          retention-days: 30

  upload-release:
    needs: [build, build-pacman]
    if: github.event_name == 'release' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.tar' -o -name '*.jar' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.sig' -o -name '*.asc' \) -exec cp {} release/ \;

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
