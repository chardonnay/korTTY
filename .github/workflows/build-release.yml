name: Build Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Extract version from release tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update build.gradle.kts with release version
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # PowerShell auf Windows
            pwsh -Command "$version = '${{ steps.version.outputs.version }}'; (Get-Content build.gradle.kts) -replace 'version = \".*\"', \"version = `\"$version`\"\" | Set-Content build.gradle.kts"
          else
            # Bash auf macOS/Linux
            sed -i.bak "s/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" build.gradle.kts
          fi

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        shell: bash
        run: ./gradlew clean build

      - name: Build macOS .app
        if: matrix.platform == 'macos'
        shell: bash
        run: ./gradlew jpackage

      - name: Build macOS .dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: ./gradlew jpackageDmg

      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        shell: bash
        run: ./gradlew jpackage

      - name: Build Windows .msi
        if: matrix.platform == 'windows'
        shell: bash
        run: ./gradlew jpackageMsi

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: ./gradlew jpackage

      - name: Build Linux .deb
        if: matrix.platform == 'linux'
        shell: bash
        run: ./gradlew jpackageDeb

      - name: Build Linux .rpm
        if: matrix.platform == 'linux'
        shell: bash
        run: ./gradlew jpackageRpm

      - name: Prepare macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          cd build/jpackage
          zip -r korTTY-macOS-${{ steps.version.outputs.version }}.zip korTTY.app
          if ls korTTY-*.dmg 1> /dev/null 2>&1; then
            cp korTTY-*.dmg korTTY-macOS-${{ steps.version.outputs.version }}.dmg
          fi

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd build/jpackage
          Compress-Archive -Path korTTY -DestinationPath korTTY-Windows-${{ steps.version.outputs.version }}.zip -Force
          if (Test-Path korTTY-*.msi) { 
            $msiFile = Get-Item korTTY-*.msi | Select-Object -First 1
            Copy-Item $msiFile.FullName "korTTY-Windows-${{ steps.version.outputs.version }}.msi"
          }

      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          cd build/jpackage
          tar -czf kortty-Linux-${{ steps.version.outputs.version }}.tar.gz kortty
          if ls kortty-*.deb 1> /dev/null 2>&1; then
            cp kortty-*.deb kortty-Linux-${{ steps.version.outputs.version }}.deb
          fi
          if ls kortty-*.rpm 1> /dev/null 2>&1; then
            cp kortty-*.rpm kortty-Linux-${{ steps.version.outputs.version }}.rpm
          fi

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-macOS-${{ steps.version.outputs.version }}
          path: |
            build/jpackage/korTTY-macOS-*.zip
            build/jpackage/korTTY-macOS-*.dmg
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-Windows-${{ steps.version.outputs.version }}
          path: |
            build/jpackage/korTTY-Windows-*.zip
            build/jpackage/korTTY-Windows-*.msi
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: korTTY-Linux-${{ steps.version.outputs.version }}
          path: |
            build/jpackage/kortty-Linux-*.tar.gz
            build/jpackage/kortty-Linux-*.deb
            build/jpackage/kortty-Linux-*.rpm
          retention-days: 30

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from release tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
