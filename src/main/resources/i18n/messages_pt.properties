settings.codingAgent.header=Agentes de programação
settings.codingAgent.detectionEnabled=Detectar agentes de programação (Claude Code, Codex, Gemini CLI) em abas de shell local
settings.codingAgent.detectionEnabled.tooltip=Lê a tela visível do terminal dentro do korTTY para saber se um agente de programação está trabalhando, aguardando sua resposta ou ocioso. Nada sai deste computador.
settings.codingAgent.detectionEnabled.info=As regras podem ser substituídas por agente em ~/.kortty/coding-agents/<agent>.json.
settings.codingAgent.notificationsEnabled=Notificação do ambiente de trabalho quando um agente de código precisa de uma decisão ou termina enquanto não está a olhar para o seu painel
settings.codingAgent.notificationsEnabled.tooltip=Usa o serviço de notificações do sistema operativo (Central de notificações do macOS, balão da bandeja do Windows, notify-send no Linux). Nada é mostrado para o painel que está a ver neste momento e nada sai deste computador.
settings.codingAgent.appBadgeEnabled=Mostrar no ícone da aplicação o número de agentes à espera de uma decisão
settings.codingAgent.appBadgeEnabled.tooltip=Distintivo da Dock do macOS, ícone da barra de tarefas do Windows, contador do lançador do KDE Plasma / Ubuntu Dock; onde nenhum estiver disponível, o título da janela mostra o número.
# API de controlo (fase 3): o socket local com que um script ou agente de codigo conduz o korTTY.
settings.controlApi.header=API de controlo
settings.controlApi.enabled=Permitir que um programa local leia e controle este korTTY
settings.controlApi.enabled.tooltip=Abre um socket em ~/.kortty/control que permite a um script ou agente de código em execução neste computador listar as suas janelas, ler qualquer painel e escrever nele. Desativado por predefinição. Nada é acessível pela rede e nenhum outro utilizador deste computador se pode ligar.
settings.controlApi.enabled.info=Cada ação é escrita no registo e, na primeira vez que um programa escreve num painel, o korTTY mostra uma notificação do ambiente de trabalho. O comando kortty-cli é o cliente.
