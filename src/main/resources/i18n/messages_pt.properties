connEdit.loggingInfo=O log do terminal registra a saída completa do terminal em um arquivo.\n\n\u2022 Plain Text: formato de texto simples com carimbos de data e hora\n\u2022 XML: formato XML estruturado\n\u2022 JSON: formato JSON legível por máquina\n\nCada conexão grava seu próprio arquivo, denominado <date>-<time>-<server>_<number>. Um novo arquivo é iniciado todos os dias e sempre que o tamanho máximo for atingido; os arquivos finalizados são compactados e mantidos até que o período de retenção expire. As sequências de escape\nANSI são removidas, o texto em si é mantido como está.
