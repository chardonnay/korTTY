ai.inputHardening.guard=Bloco de proteção de entrada
ai.inputHardening.title=Proteção de entrada
ai.inputHardening.enable=Proteção de entrada (validar entradas de script)
ai.inputHardening.enable.tooltip=Solicita à IA que adicione um bloco de proteção de validação de entrada ao script: listas de permissões de parâmetros e limites de comprimento, verificações de formato de arquivo e tamanho máximo de arquivo, avisos de segurança anexados ao arquivo de log do script e uma substituição FORCE=1 / --force. O próprio korTTY não executa nenhuma validação quando o script é executado.
ai.inputHardening.option.PARAM_VALIDATION=Listas de permissões de parâmetros e limites de comprimento
ai.inputHardening.option.PARAM_VALIDATION.tooltip=Valida cada parâmetro: número exato de parâmetros, lista de caracteres permitidos por parâmetro e limites de comprimento; caracteres de controle e metacaracteres de shell são rejeitados (código de saída 64).
ai.inputHardening.option.FILE_CHECKS=Verificações de formato de arquivo de entrada
ai.inputHardening.option.FILE_CHECKS.tooltip=Verifica se cada arquivo de entrada existe e é legível (código de saída 66) e se o formato do conteúdo é processável, por ex. rejeitando arquivos binários (código de saída 65).
ai.inputHardening.option.FILE_SIZE_LIMIT=Máx. tamanho do arquivo de entrada (variável de script)
ai.inputHardening.option.FILE_SIZE_LIMIT.tooltip=Adiciona uma variável ajustável MAX_FILE_SIZE; o tamanho é verificado pelos metadados antes de qualquer leitura, arquivos maiores são rejeitados (código de saída 65) e 0 significa ilimitado.
ai.inputHardening.option.SECURITY_LOGGING=Avisos de segurança para stderr e log de script
ai.inputHardening.option.SECURITY_LOGGING.tooltip=Relata cada violação como aviso SECURITY: com carimbo de tempo em stderr e o acrescenta também ao arquivo de log do próprio script, se existir.
ai.inputHardening.option.FORCE_OVERRIDE=FORCE=1 / --force substituição
ai.inputHardening.option.FORCE_OVERRIDE.tooltip=Com FORCE=1 no ambiente ou com o parâmetro --force o script não bloqueia: violações são rebaixadas a avisos e continuam sendo relatadas; execuções forçadas deixam um rastro completo.
ai.inputHardening.maxFileSize=Máx. tamanho do arquivo:
ai.inputHardening.maxFileSize.tooltip=Limite de tamanho para arquivos de entrada, gerado no script como MAX_FILE_SIZE. A proteção verifica os metadados antes de ler o conteúdo; 0 significa ilimitado.
ai.inputHardening.maxFileSize.hint=MB (0-1024; 0 = ilimitado)
ai.inputHardening.saveDefault.tooltip=Memorizar a proteção de entrada e o limite de tamanho como padrão
