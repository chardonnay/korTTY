settings.security.masterPassword.skipPrompt.tooltip=O korTTY desbloqueia o cofre automaticamente com uma senha memorizada, de modo que nenhuma caixa de diálogo é exibida na inicialização. Os dados criptografados (perfis de IA, senhas SSH) permanecem utilizáveis, ao contrário da opção acima. Inseguro: apenas para ambientes de teste ou descartáveis.
settings.security.masterPassword.skipPrompt.warning=⚠️ AVISO: Sua senha mestra é armazenada no disco (apenas ofuscada, não de forma segura). Qualquer pessoa com acesso a esta máquina, à pasta ~/.kortty ou aos seus backups pode descriptografar TODAS as senhas, chaves SSH e chaves de API salvas. A única proteção restante são as permissões de arquivo. Use isto apenas em ambientes de teste ou descartáveis, como uma máquina virtual.
settings.security.masterPassword.skipPrompt.confirm.title=Desativar a senha mestra?
settings.security.masterPassword.skipPrompt.confirm.header=Isso torna seus segredos salvos inseguros
settings.security.masterPassword.skipPrompt.confirm.content=O korTTY armazenará sua senha mestra no disco (apenas ofuscada) e desbloqueará automaticamente a cada inicialização. Qualquer pessoa que possa ler a pasta ~/.kortty ou um backup poderá descriptografar todas as suas senhas, chaves SSH e chaves de API salvas. Ative isto apenas em um ambiente de teste ou descartável.
