settings.window.tabTitleFromShell=Nomear as abas de terminal com o título definido pela shell
settings.window.tabTitleFromShell.tooltip=A shell e outros programas podem definir um título com a sequência de escape OSC 0 ou OSC 2; muitas shells colocam ali usuário@host e o diretório atual. Uma aba de terminal mostra o título do seu painel ativo no lugar do nome da conexão, a menos que você tenha renomeado a aba. O título nunca altera a cor da aba.
settings.window.tabTitleFromShell.info=(Quem decide este título é o servidor. Passe o mouse sobre uma aba para ver a qual conexão ela pertence)
