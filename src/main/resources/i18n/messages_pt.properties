settings.terminal.scrollbar.tooltip=Mostra uma barra de rolagem no lado direito da janela do terminal
settings.terminal.commandTimestamps=Mostrar carimbos de data/hora dos comandos
settings.terminal.commandTimestamps.tooltip=Exibe uma barra lateral \u00e0 esquerda com data/hora de cada comando digitado
settings.terminal.dragDrop=Permitir arrastar e soltar no terminal (os arquivos são copiados via SFTP, o texto é colado)
settings.terminal.dragDrop.tooltip=Solte arquivos ou pastas do Finder/Explorer no terminal para copiá-los para o servidor remoto via SFTP. O texto solto é colado no painel sob o ponteiro, com a mesma proteção ao colar de qualquer outra colagem.
settings.terminal.copyOnSelect=Copie a seleção para a área de transferência automaticamente
settings.terminal.copyOnSelect.tooltip=Quando o texto for selecionado no terminal, copie-o para a área de transferência (pode ser desativado)
settings.terminal.links.header=Links
settings.terminal.linkDetection=Detectar endereços web, endereços de e-mail e caminhos de arquivo no texto do terminal
settings.terminal.linkDetection.tooltip=Cmd+clique (macOS) ou Ctrl+clique (Windows, Linux) abre um endereço web no navegador, um endereço de e-mail no programa de e-mail e, em abas SSH e de shell local, um caminho de arquivo como texto no editor de snippets, mesmo quando um programa o exibiu como texto simples. Links que os programas marcam por conta própria (OSC 8) abrem de qualquer forma.
settings.terminal.closeActiveWithoutConfirmation=Fechar janelas de terminal ativas sem confirmação
settings.terminal.closeActiveWithoutConfirmation.tooltip=Quando ativado, fechar a janela ou todas as guias não solicitará confirmação, mesmo que os terminais SSH ativos ainda estejam abertos
settings.terminal.paste.header=Proteção ao colar
settings.terminal.paste.warningMode=Avisar ao colar várias linhas:
settings.terminal.paste.warningMode.tooltip=Quando uma colagem com quebras de linha pede confirmação antes de chegar ao terminal. Cada quebra de linha atua como Enter, a menos que o programa no painel use bracketed paste. Desativado também desliga o aviso sobre caracteres de controlo.
settings.terminal.paste.mode.off=Desativado
settings.terminal.paste.mode.unlessBracketed=A menos que o programa use bracketed paste
settings.terminal.paste.mode.always=Sempre
settings.terminal.paste.largeWarning=Avisar ao colar mais de:
settings.terminal.paste.largeWarning.unit=KiB (0 = desativado)
settings.terminal.paste.largeWarning.tooltip=Colagens maiores do que este valor pedem confirmação, seja qual for a definição acima. 0 desliga a verificação de tamanho.
settings.terminal.paste.lineDelay=Pausa após cada linha colada:
settings.terminal.paste.lineDelay.unit=ms (0 = desativado)
settings.terminal.paste.lineDelay.tooltip=Para dispositivos que perdem a entrada que chega depressa demais, como switches, routers ou servidores de consola: uma colagem com várias linhas é enviada uma linha de cada vez, com esta pausa após cada linha. Entretanto o painel não aceita entrada do teclado e Esc interrompe a colagem. 0 cola o texto de imediato.
settings.terminal.paste.info=Os caracteres de controlo e os caracteres invisíveis que mudam a direção do texto pedem sempre confirmação, a menos que o aviso esteja desativado, mesmo quando o programa usa bracketed paste. Um programa no servidor pode ativar o bracketed paste sem o tratar, por isso escolha Sempre para servidores de produção.
settings.terminal.shellIntegration.header=Integração com o shell
settings.terminal.shellIntegration.enabled=Usar as marcas de comandos dos shells configurados para a integração (OSC 133)
settings.terminal.shellIntegration.enabled.tooltip=Um shell com o snippet do korTTY no arquivo de inicialização marca cada prompt e cada comando. O korTTY então salta entre os prompts com Cmd/Ctrl+Shift+Cima e Baixo.
settings.terminal.shellIntegration.info=A integração com o shell precisa de algumas linhas no arquivo de inicialização de cada shell, em cada servidor: Ajuda → Manual → Integração com o shell as contém para bash, zsh e fish. Sem elas nada muda.
settings.terminal.notify.header=Notificações
settings.terminal.notify.bell=Notificação do ambiente de trabalho quando a campainha toca numa aba que não está a ver
settings.terminal.notify.bell.tooltip=Usa o serviço de notificações do sistema operativo (Central de notificações do macOS, balão da bandeja do Windows, notify-send no Linux), no máximo uma vez a cada 10 segundos por painel. As shells tocam a campainha a cada conclusão com Tab falhada, por isso está desativada por predefinição.
settings.terminal.notify.info=Uma aba que não está a ver mostra 🔔 no título quando um programa nela toca a campainha, com a notificação ativada ou não; a marca desaparece quando olha para a aba. Um painel com um agente de código detetado não recebe notificações da campainha enquanto as notificações dos agentes de código estiverem ativadas.
settings.terminal.highlighting.header=Realce de palavras-chave
settings.terminal.highlighting.enabled=Realçar palavras-chave na saída do terminal
settings.terminal.highlighting.enabled.tooltip=Se desativado, nenhum painel do terminal é realçado, independentemente do que foi escolhido num menu, com o atalho de teclado ou como conjunto de regras predefinido.
settings.terminal.highlighting.alternateScreen=Realçar também em programas de ecrã inteiro (vim, less, htop)
settings.terminal.highlighting.alternateScreen.tooltip=Os programas de ecrã inteiro redesenham o ecrã constantemente e usam as suas próprias cores, por isso o realce pode piscar neles.
settings.terminal.highlighting.defaultSet=Conjunto de regras predefinido:
settings.terminal.highlighting.defaultSet.tooltip=O conjunto de regras que cada painel do terminal mostra, a menos que a sua conexão ou o próprio painel tenha um conjunto de regras próprio.
settings.terminal.highlighting.defaultSet.none=Nenhum
settings.terminal.highlighting.defaultSet.unknown=Conjunto de regras em falta ({0})
settings.terminal.highlighting.info=Aplica-se aos terminais abertos ao guardar. Uma conexão com um conjunto de regras próprio (editor de conexões, separador Configurações do terminal) mantém-no, tal como um painel para o qual escolheu um conjunto de regras em Visualizar → Realce, no seu menu de contexto ou com o atalho de teclado.
settings.terminal.highlighting.editRules=Editar regras…
settings.terminal.highlighting.editRules.tooltip=Crie e altere os seus próprios conjuntos de regras ou consulte os integrados. O editor de regras guarda as alterações quando o confirma, quer guarde depois estas configurações ou não.
