settings.snippetEditor.analysisContentLimit.hint=Os scripts até este tamanho são armazenados com a análise, pelo que a pré-visualização do código, «Ver alterações», a exportação do script, o anexo do relatório, a restauração de um estado intermédio e a retoma após um reinício continuam a funcionar. Uma análise pode conter várias cópias do script (analisado, antes de aplicar, resultado proposto, aceite), cada uma até este tamanho, por isso valores elevados usam muito espaço em disco; as cópias idênticas são armazenadas uma só vez. «Desativado» não armazena qualquer texto de script. Predefinição: 1 MB, no máximo 5 MB.
