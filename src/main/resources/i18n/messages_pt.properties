settings.security.masterPassword.info=A senha mestra é usada para criptografar todas as senhas de conexão armazenadas.\nSe você alterar a senha mestra, todas as senhas armazenadas serão automaticamente criptografadas novamente.
settings.security.masterPassword.requireOnStartup=Exigir senha mestra na inicialização
settings.security.masterPassword.requireOnStartup.tooltip=Se desativado, nenhuma caixa de diálogo de senha mestra será exibida na inicialização.\n⚠️ AVISO: isso não é seguro, pois os dados criptografados não podem ser descriptografados sem a inserção da senha.
settings.security.masterPassword.warning=⚠️ AVISO: Se esta opção estiver desativada, as senhas e chaves criptografadas não poderão ser carregadas automaticamente na inicialização. Você deve inserir manualmente a senha mestra quando quiser acessar dados criptografados.
