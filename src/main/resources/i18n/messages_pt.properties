# --- Resources tab (opt-in JVM heap/GC profile) ---
settings.tab.resources=Recursos
settings.resources.header=Memória da JVM e coletor de lixo
settings.resources.description=Escolha quanta memória o korTTY pode usar. O padrão mantém um consumo baixo e limitado; os outros perfis permitem que o aplicativo use mais recursos da sua máquina para sessões muito grandes. Afeta apenas o aplicativo empacotado.
settings.resources.profile=Perfil de recursos:
settings.resources.profile.balanced=Equilibrado (recomendado)
settings.resources.profile.high=Alto (usar mais RAM)
settings.resources.profile.maximum=Máximo (quase ilimitado, ZGC)
settings.resources.profile.balanced.detail=Limite fixo de 2 GB de heap com o coletor G1 e devolução de memória ociosa. Melhor consumo; sem reinício ou relançamento.
settings.resources.profile.high.detail=Heap maior (cerca de metade da sua RAM), ainda com o coletor G1.
settings.resources.profile.maximum.detail=Heap quase ilimitado (cerca de três quartos da sua RAM) com o coletor de lixo Z de baixa pausa, para cargas de trabalho muito grandes.
settings.resources.maxHeap=Heap máximo para este perfil: {0} de {1} de RAM.
settings.resources.maxHeap.noRam=Heap máximo para este perfil: {0}.
settings.resources.detectedRam=Memória detectada: {0}.
settings.resources.detectedRam.unknown=Memória detectada: desconhecida.
settings.resources.warning=Perfis mais altos permitem que o korTTY reserve muito mais memória. A renderização do terminal e do editor também usa memória fora do heap do Java, então deixe folga para o resto do sistema.
settings.resources.restart=Entra em vigor após reiniciar o korTTY. Apenas o aplicativo empacotado aplica isso; para tal, ele se relança brevemente uma vez na inicialização para trocar o heap e o coletor.
