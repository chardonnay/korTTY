ai.workflow.option.STRICT_MODE=Strict mode (abort on error)
ai.workflow.option.STRICT_MODE.tooltip=Enables the language's strict / abort-on-error mode: the script stops at the first unhandled error instead of continuing with bad state.
ai.workflow.option.ERROR_TRAP_CLEANUP=Error trap & cleanup
ai.workflow.option.ERROR_TRAP_CLEANUP.tooltip=Adds an error trap / finally block that reports failures and cleans up temporary state (files, mounts, processes) even when the script aborts.
ai.workflow.option.MEANINGFUL_EXIT_CODES=Meaningful exit codes
ai.workflow.option.MEANINGFUL_EXIT_CODES.tooltip=Uses distinct, documented non-zero exit codes per failure class, so callers and schedulers can react to the exact failure.
ai.workflow.option.LOGGING_VERBOSE=Logging (--verbose)
ai.workflow.option.LOGGING_VERBOSE.tooltip=Emits timestamped log messages to stderr and adds a --verbose/-v flag for extra detail.
ai.workflow.option.CONFIG_BLOCK=Configuration block for literals
ai.workflow.option.CONFIG_BLOCK.tooltip=Moves all literals (paths, hosts, packages) into a clearly commented configuration block near the top, so values are adjusted in one place.
ai.workflow.option.END_SUMMARY=Final summary
ai.workflow.option.END_SUMMARY.tooltip=Prints a final summary of what was done, including success/failure counts.
ai.workflow.option.STYLE_GUIDE_CLEAN=Style-guide / linter clean
ai.workflow.option.STYLE_GUIDE_CLEAN.tooltip=Formats the script to the language's style guide and keeps it linter-clean (e.g. ShellCheck for Bash).
ai.workflow.option.PRECONDITION_CHECKS=Precondition checks
ai.workflow.option.PRECONDITION_CHECKS.tooltip=Verifies required commands, privileges (root/sudo) and connectivity before any work starts.
ai.workflow.option.IDEMPOTENCY=Idempotency (skip completed steps)
ai.workflow.option.IDEMPOTENCY.tooltip=Detects already-completed steps and skips them, so the script is safe to re-run.
ai.workflow.option.SAFE_MODE=Safe mode (--dry-run + confirm)
ai.workflow.option.SAFE_MODE.tooltip=Adds a --dry-run flag that only prints intended actions, and asks for confirmation before destructive operations (suppressible with --yes).
ai.workflow.option.HELP_USAGE=--help & argument parsing
ai.workflow.option.HELP_USAGE.tooltip=Adds a --help/usage message and command-line argument parsing for the configurable values.

