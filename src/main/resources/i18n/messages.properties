ai.inputHardening.title=Input hardening
ai.inputHardening.enable=Input hardening (validate script inputs)
ai.inputHardening.enable.tooltip=Asks the AI to add an input-validation guard block to the script: parameter allowlists and length limits, file format checks and a maximum file size, security warnings appended to the script's log file, and a FORCE=1 / --force override. korTTY itself performs no validation when the script runs.
ai.inputHardening.option.PARAM_VALIDATION=Parameter allowlists & length limits
ai.inputHardening.option.PARAM_VALIDATION.tooltip=Validates every parameter: exact parameter count, a per-parameter character allowlist and length limits; control characters and shell metacharacters are rejected (exit code 64).
ai.inputHardening.option.FILE_CHECKS=Input file format checks
ai.inputHardening.option.FILE_CHECKS.tooltip=Verifies each input file exists and is readable (exit code 66) and that its content format is processable, e.g. rejecting binary input (exit code 65).
ai.inputHardening.option.FILE_SIZE_LIMIT=Max. input file size (script variable)
ai.inputHardening.option.FILE_SIZE_LIMIT.tooltip=Adds an adjustable MAX_FILE_SIZE variable; file sizes are checked from metadata before any content is read, larger files are rejected (exit code 65), 0 means unlimited.
ai.inputHardening.option.SECURITY_LOGGING=Security warnings to stderr & script log
ai.inputHardening.option.SECURITY_LOGGING.tooltip=Reports every violation as a timestamped SECURITY: warning on stderr and appends it to the script's own log file when one exists.
ai.inputHardening.option.FORCE_OVERRIDE=FORCE=1 / --force override
ai.inputHardening.option.FORCE_OVERRIDE.tooltip=Running the script with FORCE=1 in its environment or with the --force parameter downgrades violations to warnings and continues; each bypass is still reported, so forced runs leave a complete trace.
ai.inputHardening.maxFileSize=Max. file size:
ai.inputHardening.maxFileSize.tooltip=Size limit for input files, generated into the script as MAX_FILE_SIZE. The guard checks file metadata before reading any content; 0 means unlimited.
ai.inputHardening.maxFileSize.hint=MB (0-1024; 0 = unlimited)
ai.inputHardening.saveDefault.tooltip=Remember input hardening and the size limit as the default
