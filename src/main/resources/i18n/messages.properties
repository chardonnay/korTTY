# --- Anonymous usage statistics (Aptabase, opt-in, GDPR) ---
settings.telemetry.header=Anonymous usage statistics
settings.telemetry.summary=KorTTY can collect anonymous usage statistics to help improve the application. Participation is voluntary (opt-in), the data contains no personal information, and it is processed exclusively on servers in the EU (GDPR-compliant, via Aptabase).
settings.telemetry.enable=Share anonymous usage data to help improve KorTTY
settings.telemetry.enable.tooltip=When enabled, anonymous events (app start, feature usage, crash and error signatures) are sent to EU servers. You can turn this off at any time.
settings.telemetry.learnMore.tooltip=Open the manual chapter "Anonymous data for application optimization"
settings.telemetry.collected=Collected: event names (e.g. app start, feature used), app version, operating system and version, app language, an anonymous session ID.
settings.telemetry.notCollected=Never collected: hostnames, usernames, connection data, file paths, snippet or terminal content, keys, passwords, error messages.
settings.telemetry.decisionDate=Your decision was recorded on {0}.
masterPassword.telemetry.consent=Share anonymous usage statistics to help improve KorTTY
masterPassword.telemetry.details=Voluntary, anonymous, EU servers (GDPR). You can change this at any time in Settings → Privacy.
