# Security Settings
settings.security.masterPassword=Master-Passwort
settings.security.masterPassword.info=Das Master-Passwort wird verwendet, um alle gespeicherten Verbindungspasswörter zu verschlüsseln.\nWenn Sie das Master-Passwort ändern, werden alle gespeicherten Passwörter automatisch neu verschlüsselt.
settings.security.masterPassword.change=Master-Passwort ändern...
settings.security.masterPassword.requireOnStartup=Master-Passwort beim Programmstart anfordern
settings.security.masterPassword.requireOnStartup.tooltip=Wenn deaktiviert, wird beim Programmstart kein Master-Passwort-Dialog angezeigt.\n⚠️ WARNUNG: Dies ist unsicher, da verschlüsselte Daten ohne Passwort-Eingabe nicht entschlüsselt werden können.
settings.security.masterPassword.warning=⚠️ WARNUNG: Wenn diese Option deaktiviert ist, können verschlüsselte Passwörter und Schlüssel beim Programmstart nicht automatisch geladen werden. Sie müssen das Master-Passwort manuell eingeben, wenn Sie auf verschlüsselte Daten zugreifen möchten.
settings.security.masterPassword.skipPrompt=Master-Passwort-Abfrage beim Start deaktivieren (Auto-Login)
settings.security.masterPassword.skipPrompt.tooltip=korTTY entsperrt den Datentresor automatisch mit einem gespeicherten Passwort, sodass beim Start kein Dialog erscheint. Verschlüsselte Daten (KI-Profile, SSH-Passwörter) bleiben nutzbar — anders als bei der Option darüber. Unsicher: nur für Wegwerf-/Testumgebungen.
settings.security.masterPassword.skipPrompt.warning=⚠️ WARNUNG: Dein Master-Passwort wird auf der Festplatte gespeichert (nur verschleiert, nicht sicher). Jeder mit Zugriff auf diesen Rechner, den Ordner ~/.kortty oder deine Backups kann ALLE gespeicherten Passwörter, SSH-Schlüssel und API-Keys entschlüsseln. Der einzige verbleibende Schutz sind die Dateiberechtigungen. Nutze dies nur in Wegwerf-/Testumgebungen wie einer VM.
settings.security.masterPassword.skipPrompt.confirm.title=Master-Passwort deaktivieren?
settings.security.masterPassword.skipPrompt.confirm.header=Das macht deine gespeicherten Geheimnisse unsicher
settings.security.masterPassword.skipPrompt.confirm.content=korTTY speichert dein Master-Passwort auf der Festplatte (nur verschleiert) und entsperrt bei jedem Start automatisch. Jeder, der den Ordner ~/.kortty oder ein Backup lesen kann, kann dann alle gespeicherten Passwörter, SSH-Schlüssel und API-Keys entschlüsseln. Aktiviere dies nur in einer Wegwerf-/Testumgebung.
settings.security.masterPassword.skipPrompt.confirm.enable=Trotzdem deaktivieren
settings.security.temporarySshKeyEnabled=Temporären SSH-Schlüssel aktivieren
settings.security.temporarySshKeyEnabled.tooltip=Wenn aktiviert, wird die Option „Temporärer SSH-Schlüssel“ im Verbindungsmanager und in der Schnellverbindung angezeigt. Wenn deaktiviert, ist die Option überall ausgeblendet.

