settings.resources.description=Legen Sie fest, wie viel Speicher korTTY nutzen darf. Die Voreinstellung hält den Verbrauch niedrig und begrenzt; die anderen Profile erlauben der App, mehr Ressourcen Ihres Rechners für sehr große Sitzungen zu verwenden. Betrifft nur die paketierte Anwendung.
