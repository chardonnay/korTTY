settings.telemetry.summary=KorTTY kann anonyme Nutzungsstatistiken erfassen, um die Applikation zu verbessern. Die Teilnahme ist freiwillig (Opt-in), die Daten enthalten keine persönlichen Informationen und werden ausschließlich auf Servern in der EU verarbeitet (DSGVO-konform, über Aptabase).
