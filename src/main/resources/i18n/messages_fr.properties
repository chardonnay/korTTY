settings.security.masterPassword.change=Changer le mot de passe principal...
settings.security.masterPassword.info=Le mot de passe principal est utilisé pour chiffrer tous les mots de passe de connexion stockés.\nSi vous modifiez le mot de passe principal, tous les mots de passe stockés seront automatiquement rechiffrés.
settings.security.masterPassword.requireOnStartup=Exiger un mot de passe principal au démarrage
settings.security.masterPassword.requireOnStartup.tooltip=Si cette option est désactivée, aucune boîte de dialogue de mot de passe principal ne s'affichera au démarrage.\n⚠️ AVERTISSEMENT : Ceci n'est pas sécurisé, car les données cryptées ne peuvent pas être déchiffrées sans la saisie d'un mot de passe.
settings.security.masterPassword.warning=⚠️ ATTENTION : Si cette option est désactivée, les mots de passe et clés cryptés ne peuvent pas être chargés automatiquement au démarrage. Vous devez saisir manuellement le mot de passe principal lorsque vous souhaitez accéder aux données cryptées.
settings.security.masterPassword.skipPrompt=Désactiver la demande de mot de passe principal au démarrage (connexion automatique)
settings.security.masterPassword.skipPrompt.tooltip=korTTY déverrouille automatiquement le coffre-fort à l'aide d'un mot de passe enregistré, de sorte qu'aucune boîte de dialogue n'apparaît au démarrage. Les données cryptées (profils IA, mots de passe SSH) restent utilisables, contrairement à l'option ci-dessus. Non sécurisé : uniquement pour les environnements de test ou jetables.
settings.security.masterPassword.skipPrompt.warning=⚠️ ATTENTION : Votre mot de passe principal est stocké sur le disque (seulement masqué, pas de manière sécurisée). Toute personne ayant accès à cette machine, au dossier ~/.kortty ou à vos sauvegardes peut décrypter TOUS les mots de passe, clés SSH et clés API enregistrés. La seule protection restante est constituée par les autorisations de fichiers. N'utilisez ceci que dans des environnements de test ou jetables tels qu'une machine virtuelle.
settings.security.masterPassword.skipPrompt.confirm.title=Désactiver le mot de passe principal ?
settings.security.masterPassword.skipPrompt.confirm.header=Cela rend vos secrets enregistrés non sécurisés
settings.security.masterPassword.skipPrompt.confirm.content=korTTY stockera votre mot de passe principal sur le disque (seulement masqué) et se déverrouillera automatiquement à chaque démarrage. Toute personne pouvant lire le dossier ~/.kortty ou une sauvegarde pourra alors décrypter tous vos mots de passe, clés SSH et clés API enregistrés. N'activez ceci que dans un environnement de test ou jetable.
