settings.resources.warning=Les profils plus élevés permettent à korTTY de réserver beaucoup plus de mémoire. Le rendu du terminal et de l'éditeur utilise aussi de la mémoire en dehors du tas Java ; laissez donc de la marge pour le reste de votre système.
settings.resources.restart=Prend effet après le redémarrage de korTTY. Seule l'application empaquetée l'applique ; elle se relance brièvement une fois au démarrage pour changer de tas et de ramasse-miettes.
