connEdit.loggingInfo=La journalisation du terminal enregistre la sortie complète du terminal dans un fichier.\n\n\u2022 Plain Text: format de texte simple avec horodatages\n\u2022 XML : format XML structuré\n\u2022 JSON : format JSON lisible par machine\n\nChaque connexion écrit son propre fichier, nommé <date>-<time>-<server>_<number>. Un nouveau fichier est démarré chaque jour et chaque fois que la taille maximale est atteinte ; les fichiers terminés sont compressés et conservés jusqu'à l'expiration de la période de conservation.\nLes séquences d'échappement ANSI sont supprimées, le texte lui-même est conservé tel quel.
