settings.resources.description=Choisissez la quantité de mémoire que korTTY peut utiliser. La valeur par défaut maintient une empreinte faible et bornée ; les autres profils permettent à l'application d'utiliser davantage de ressources de votre machine pour de très grandes sessions. Ceci n'affecte que l'application empaquetée.
