settings.resources.profile.balanced.detail=Limite de tas fixe de 2 Go avec le ramasse-miettes G1 et restitution de la mémoire inactive. Meilleure empreinte ; aucun redémarrage ni relancement.
settings.resources.profile.high.detail=Tas plus grand (environ la moitié de votre RAM), toujours avec le ramasse-miettes G1.
settings.resources.profile.maximum.detail=Tas presque illimité (environ les trois quarts de votre RAM) avec le ramasse-miettes Z à faibles pauses, pour de très grandes charges de travail.
