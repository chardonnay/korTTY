# --- Resources tab (opt-in JVM heap/GC profile) ---
settings.tab.resources=Risorse
settings.resources.header=Memoria della JVM e garbage collector
settings.resources.description=Scegli quanta memoria può usare korTTY. L'impostazione predefinita mantiene un consumo ridotto e limitato; gli altri profili permettono all'app di usare più risorse del tuo computer per sessioni molto grandi. Riguarda solo l'applicazione pacchettizzata.
settings.resources.profile=Profilo risorse:
settings.resources.profile.balanced=Bilanciato (consigliato)
settings.resources.profile.high=Alto (usa più RAM)
settings.resources.profile.maximum=Massimo (quasi illimitato, ZGC)
settings.resources.profile.balanced.detail=Limite fisso di 2 GB di heap con il collector G1 e restituzione della memoria inattiva. Consumo migliore; nessun riavvio o rilancio.
settings.resources.profile.high.detail=Heap più grande (circa la metà della tua RAM), sempre con il collector G1.
settings.resources.profile.maximum.detail=Heap quasi illimitato (circa tre quarti della tua RAM) con il garbage collector Z a bassa latenza, per carichi di lavoro molto grandi.
settings.resources.maxHeap=Heap massimo per questo profilo: {0} di {1} di RAM.
settings.resources.maxHeap.noRam=Heap massimo per questo profilo: {0}.
settings.resources.detectedRam=Memoria rilevata: {0}.
settings.resources.detectedRam.unknown=Memoria rilevata: sconosciuta.
settings.resources.warning=I profili più alti consentono a korTTY di riservare molta più memoria. Il rendering di terminale ed editor usa anche memoria al di fuori dell'heap Java, quindi lascia margine per il resto del sistema.
settings.resources.restart=Ha effetto dopo il riavvio di korTTY. Solo l'applicazione pacchettizzata lo applica; per farlo si rilancia brevemente una volta all'avvio per cambiare heap e collector.
