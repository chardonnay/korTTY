settings.security.masterPassword.skipPrompt.confirm.content=korTTY memorizzerà la tua password principale sul disco (solo offuscata) e si sbloccherà automaticamente a ogni avvio. Chiunque possa leggere la cartella ~/.kortty o un backup potrà quindi decrittografare tutte le password, le chiavi SSH e le chiavi API salvate. Attiva questa opzione solo in un ambiente di prova o temporaneo.
