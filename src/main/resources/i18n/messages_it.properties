# --- Anonymous usage statistics (Aptabase, opt-in, GDPR) — to be translated ---
settings.tab.privacy=Privacy
settings.telemetry.header=Statistiche di utilizzo anonime
settings.telemetry.summary=KorTTY può raccogliere statistiche di utilizzo anonime per contribuire a migliorare l'applicazione. La partecipazione è volontaria (opt-in), i dati non contengono informazioni personali e vengono elaborati esclusivamente su server nella UE (conformi al GDPR, tramite Aptabase).
settings.telemetry.enable=Condividi dati di utilizzo anonimi per contribuire a migliorare KorTTY
settings.telemetry.enable.tooltip=Se abilitati, gli eventi anonimi (avvio dell'app, utilizzo delle funzionalità, arresti anomali e firme di errori) vengono inviati ai server dell'UE. Puoi disattivarlo in qualsiasi momento.
settings.telemetry.learnMore.tooltip=Apri il capitolo del manuale "Dati anonimi per l'ottimizzazione delle applicazioni"
settings.telemetry.collected=Raccolti: nomi di eventi (ad esempio avvio dell'app, funzionalità utilizzata), versione dell'app, sistema operativo e versione, lingua dell'app, ID di sessione anonimo.
settings.telemetry.notCollected=Mai raccolti: nomi host, nomi utente, dati di connessione, percorsi di file, snippet o contenuto del terminale, chiavi, password, messaggi di errore.
settings.telemetry.decisionDate=La tua decisione è stata registrata il {0}.
masterPassword.telemetry.consent=Condividi statistiche di utilizzo anonime per contribuire a migliorare KorTTY
masterPassword.telemetry.details=Server volontari, anonimi, UE (GDPR). Puoi modificarlo in qualsiasi momento in Impostazioni → Privacy.
masterPassword.telemetry.info.tooltip=Quali dati? Apre il capitolo del manuale "Dati anonimi per l'ottimizzazione delle applicazioni".
telemetry.consent.title=Statistiche di utilizzo anonime
telemetry.consent.header=Aiutaci a migliorare KorTTY?
telemetry.consent.message=KorTTY può raccogliere statistiche di utilizzo anonime (avvio dell'app, utilizzo delle funzionalità, arresti anomali). Non vengono raccolti dati personali e tutto viene elaborato su server UE nel rispetto del GDPR.\n\nPuoi modificare questa decisione in qualsiasi momento in Impostazioni → Privacy.
telemetry.consent.accept=Condividere dati anonimi
telemetry.consent.decline=No grazie
telemetry.consent.learnMore=Maggiori informazioni

