settings.security.masterPassword.skipPrompt.warning=⚠️ ATTENZIONE: la password principale viene memorizzata sul disco (solo offuscata, non in modo sicuro). Chiunque abbia accesso a questo computer, alla cartella ~/.kortty o ai backup può decrittografare TUTTE le password, le chiavi SSH e le chiavi API salvate. L'unica protezione rimasta sono i permessi dei file. Utilizzare questa opzione solo in ambienti di prova o temporanei come una macchina virtuale.
