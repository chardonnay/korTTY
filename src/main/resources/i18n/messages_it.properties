ai.inputHardening.enable.tooltip=Chiede all'IA di aggiungere un blocco di protezione per la convalida dell'input allo script: liste consentite di parametri e limiti di lunghezza, controlli del formato file e dimensione massima del file, avvisi di sicurezza aggiunti al file di registro dello script e una sostituzione FORCE=1 / --force. korTTY stesso non esegue alcuna convalida quando viene eseguito lo script.
ai.inputHardening.option.PARAM_VALIDATION=Liste consentite dei parametri e limiti di lunghezza
ai.inputHardening.option.PARAM_VALIDATION.tooltip=Convalida ogni parametro: numero esatto di parametri, lista di caratteri consentiti per parametro e limiti di lunghezza; caratteri di controllo e metacaratteri di shell vengono rifiutati (codice di uscita 64).
ai.inputHardening.option.FILE_CHECKS=Verifiche del formato del file di input
ai.inputHardening.option.FILE_CHECKS.tooltip=Verifica che ogni file di input esista e sia leggibile (codice di uscita 66) e che il formato del contenuto sia elaborabile, ad es. rifiutando file binari (codice di uscita 65).
ai.inputHardening.option.FILE_SIZE_LIMIT=Dimensione max. del file di input (variabile script)
ai.inputHardening.option.FILE_SIZE_LIMIT.tooltip=Aggiunge una variabile regolabile MAX_FILE_SIZE; la dimensione è verificata dai metadati prima di leggere il contenuto, i file troppo grandi vengono rifiutati (codice di uscita 65) e 0 significa illimitato.
ai.inputHardening.option.SECURITY_LOGGING=Avvisi di sicurezza per stderr e registro degli script
ai.inputHardening.option.SECURITY_LOGGING.tooltip=Segnala ogni violazione come avviso SECURITY: con marca temporale su stderr e la aggiunge anche al file di log dello script, se presente.
ai.inputHardening.option.FORCE_OVERRIDE=FORCE=1 / --force sostituzione
ai.inputHardening.option.FORCE_OVERRIDE.tooltip=Con FORCE=1 nell'ambiente o con il parametro --force lo script non blocca: le violazioni sono declassate ad avvisi e restano segnalate; le esecuzioni forzate lasciano una traccia completa.
ai.inputHardening.maxFileSize=Dimensione max. del file:
ai.inputHardening.maxFileSize.tooltip=Limite di dimensione per i file di input, generato nello script come MAX_FILE_SIZE. La protezione controlla i metadati prima di leggere il contenuto; 0 significa illimitato.
