# Security Settings
settings.security.masterPassword=Master Password
settings.security.masterPassword.info=The master password is used to encrypt all stored connection passwords.\nIf you change the master password, all stored passwords will be automatically re-encrypted.
settings.security.masterPassword.change=Change Master Password...
settings.security.masterPassword.requireOnStartup=Require master password on startup
settings.security.masterPassword.requireOnStartup.tooltip=If disabled, no master password dialog will be shown on startup.\n⚠️ WARNING: This is insecure, as encrypted data cannot be decrypted without password entry.
settings.security.masterPassword.warning=⚠️ WARNING: If this option is disabled, encrypted passwords and keys cannot be automatically loaded on startup. You must manually enter the master password when you want to access encrypted data.
settings.security.masterPassword.skipPrompt=Disable master password prompt on startup (auto-login)
settings.security.masterPassword.skipPrompt.tooltip=korTTY unlocks the vault automatically from a remembered password, so no dialog is shown on startup. Encrypted data (AI profiles, SSH passwords) stays usable — unlike the option above. Insecure: only for throwaway/test environments.
settings.security.masterPassword.skipPrompt.warning=⚠️ WARNING: Your master password is stored on disk (only obfuscated, not securely). Anyone with access to this machine, the ~/.kortty folder, or your backups can decrypt ALL saved passwords, SSH keys and API keys. The only remaining protection is the file permissions. Use this only in throwaway/test environments such as a VM.
settings.security.masterPassword.skipPrompt.confirm.title=Disable master password?
settings.security.masterPassword.skipPrompt.confirm.header=This makes your saved secrets insecure
settings.security.masterPassword.skipPrompt.confirm.content=korTTY will store your master password on disk (only obfuscated) and unlock automatically on every start. Anyone who can read the ~/.kortty folder or a backup can then decrypt all your saved passwords, SSH keys and API keys. Only enable this in a throwaway/test environment.
settings.security.masterPassword.skipPrompt.confirm.enable=Disable anyway
settings.security.temporarySshKeyEnabled=Enable temporary SSH key option
settings.security.temporarySshKeyEnabled.tooltip=When enabled, the temporary SSH key authentication option is shown in Connection Manager and Quick Connect. When disabled, this option is hidden everywhere.

