# --- Anonymous usage statistics (Aptabase, opt-in, GDPR) — to be translated ---
settings.tab.privacy=Privacy
settings.telemetry.header=Anonieme gebruiksstatistieken
settings.telemetry.summary=KorTTY kan anonieme gebruiksstatistieken verzamelen om de applicatie te helpen verbeteren. Deelname is vrijwillig (opt-in), de gegevens bevatten geen persoonlijke informatie en worden uitsluitend verwerkt op servers in de EU (AVG-conform, via Aptabase).
settings.telemetry.enable=Deel anonieme gebruiksgegevens om KorTTY te helpen verbeteren
settings.telemetry.enable.tooltip=Indien ingeschakeld, worden anonieme gebeurtenissen (start van de app, gebruik van functies, crash- en fouthandtekeningen) naar EU-servers verzonden. U kunt dit op elk gewenst moment uitschakelen.
settings.telemetry.learnMore.tooltip=Open het handleidinghoofdstuk "Anonieme gegevens voor applicatieoptimalisatie"
settings.telemetry.collected=Verzameld: gebeurtenisnamen (bijv. starten van app, gebruikte functie), app-versie, besturingssysteem en -versie, app-taal, een anonieme sessie-ID.
settings.telemetry.notCollected=Nooit verzameld: hostnamen, gebruikersnamen, verbindingsgegevens, bestandspaden, fragment- of terminalinhoud, sleutels, wachtwoorden, foutmeldingen.
settings.telemetry.decisionDate=Uw beslissing is vastgelegd op {0}.
masterPassword.telemetry.consent=Deel anonieme gebruiksstatistieken om KorTTY te helpen verbeteren
masterPassword.telemetry.details=Vrijwillige, anonieme, EU-servers (AVG). Je kunt dit op elk moment wijzigen via Instellingen → Privacy.
masterPassword.telemetry.info.tooltip=Welke gegevens? Opent het handboekhoofdstuk "Anonieme gegevens voor applicatieoptimalisatie".
telemetry.consent.title=Anonieme gebruiksstatistieken
telemetry.consent.header=Help KorTTY verbeteren?
telemetry.consent.message=KorTTY kan anonieme gebruiksstatistieken verzamelen (starten van de app, gebruik van functies, crashes). Er worden geen persoonlijke gegevens verzameld en alles wordt verwerkt op EU-servers in overeenstemming met de AVG.\n\nJe kunt deze beslissing op elk moment wijzigen via Instellingen → Privacy.
telemetry.consent.accept=Deel anonieme gegevens
telemetry.consent.decline=Nee, bedankt
