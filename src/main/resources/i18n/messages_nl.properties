# --- Resources tab (opt-in JVM heap/GC profile) ---
settings.tab.resources=Bronnen
settings.resources.header=JVM-geheugen en garbage collector
settings.resources.description=Kies hoeveel geheugen korTTY mag gebruiken. De standaardinstelling houdt het verbruik laag en begrensd; de andere profielen laten de app meer bronnen van je machine gebruiken voor zeer grote sessies. Dit geldt alleen voor de verpakte toepassing.
settings.resources.profile=Bronnenprofiel:
settings.resources.profile.balanced=Gebalanceerd (aanbevolen)
settings.resources.profile.high=Hoog (meer RAM gebruiken)
settings.resources.profile.maximum=Maximaal (vrijwel onbeperkt, ZGC)
settings.resources.profile.balanced.detail=Vaste heaplimiet van 2 GB met de G1-collector en teruggave van ongebruikt geheugen. Beste verbruik; geen herstart nodig.
settings.resources.profile.high.detail=Grotere heap (ongeveer de helft van je RAM), nog steeds met de G1-collector.
settings.resources.profile.maximum.detail=Vrijwel onbeperkte heap (ongeveer driekwart van je RAM) met de Z-garbagecollector met korte pauzes, voor zeer grote werklasten.
settings.resources.maxHeap=Maximale heap voor dit profiel: {0} van {1} RAM.
settings.resources.maxHeap.noRam=Maximale heap voor dit profiel: {0}.
settings.resources.detectedRam=Gedetecteerd geheugen: {0}.
settings.resources.detectedRam.unknown=Gedetecteerd geheugen: onbekend.
settings.resources.warning=Hogere profielen laten korTTY veel meer geheugen reserveren. Terminal- en editorweergave gebruiken ook geheugen buiten de Java-heap, dus laat ruimte over voor de rest van je systeem.
settings.resources.restart=Wordt van kracht na het opnieuw starten van korTTY. Alleen de verpakte toepassing past dit toe; daarvoor start de app zichzelf bij het opstarten eenmalig kort opnieuw om heap en collector te wijzigen.
