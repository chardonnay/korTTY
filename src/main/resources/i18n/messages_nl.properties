settings.security.masterPassword.change=Hoofdwachtwoord wijzigen...
settings.security.masterPassword.info=Het hoofdwachtwoord wordt gebruikt om alle opgeslagen verbindingswachtwoorden te coderen.\nAls u het hoofdwachtwoord wijzigt, worden alle opgeslagen wachtwoorden automatisch opnieuw gecodeerd.
settings.security.masterPassword.requireOnStartup=Hoofdwachtwoord vereisen bij opstarten
settings.security.masterPassword.requireOnStartup.tooltip=Indien uitgeschakeld, wordt er bij het opstarten geen hoofdwachtwoorddialoogvenster weergegeven.\n⚠️ WAARSCHUWING: Dit is onveilig, omdat gecodeerde gegevens niet kunnen worden gedecodeerd zonder wachtwoordinvoer.
settings.security.masterPassword.warning=⚠️ WAARSCHUWING: Als deze optie is uitgeschakeld, kunnen gecodeerde wachtwoorden en sleutels niet automatisch worden geladen bij het opstarten. U moet het hoofdwachtwoord handmatig invoeren als u toegang wilt krijgen tot gecodeerde gegevens.
settings.security.masterPassword.skipPrompt=Wachtwoordprompt bij het opstarten uitschakelen (automatisch aanmelden)
settings.security.masterPassword.skipPrompt.tooltip=korTTY ontgrendelt de kluis automatisch met een onthouden wachtwoord, zodat er bij het opstarten geen dialoogvenster wordt weergegeven. Gecodeerde gegevens (AI-profielen, SSH-wachtwoorden) blijven bruikbaar, in tegenstelling tot de optie hierboven. Onveilig: alleen voor wegwerp-/testomgevingen.
settings.security.masterPassword.skipPrompt.warning=⚠️ WAARSCHUWING: Uw hoofdwachtwoord wordt op de schijf opgeslagen (alleen versluierd, niet veilig). Iedereen met toegang tot deze machine, de map ~/.kortty of uw back-ups kan ALLE opgeslagen wachtwoorden, SSH-sleutels en API-sleutels ontsleutelen. De enige overgebleven bescherming zijn de bestandsrechten. Gebruik dit alleen in wegwerp-/testomgevingen zoals een virtuele machine.
settings.security.masterPassword.skipPrompt.confirm.title=Hoofdwachtwoord uitschakelen?
settings.security.masterPassword.skipPrompt.confirm.header=Dit maakt uw opgeslagen geheimen onveilig
settings.security.masterPassword.skipPrompt.confirm.content=korTTY slaat uw hoofdwachtwoord op de schijf op (alleen versluierd) en ontgrendelt automatisch bij elke start. Iedereen die de map ~/.kortty of een back-up kan lezen, kan dan al uw opgeslagen wachtwoorden, SSH-sleutels en API-sleutels ontsleutelen. Schakel dit alleen in een wegwerp-/testomgeving in.
