settings.security.masterPassword.skipPrompt.tooltip=korTTY automatski otključava trezor pomoću zapamćene lozinke, tako da se pri pokretanju ne prikazuje dijalog. Šifrirani podaci (AI profili, SSH lozinke) ostaju upotrebljivi, za razliku od opcije iznad. Nesigurno: samo za privremena/testna okruženja.
settings.security.masterPassword.skipPrompt.warning=⚠️ UPOZORENJE: Vaša glavna lozinka pohranjena je na disku (samo prikrivena, ne sigurno). Bilo tko s pristupom ovom računalu, mapi ~/.kortty ili vašim sigurnosnim kopijama može dešifrirati SVE spremljene lozinke, SSH ključeve i API ključeve. Jedina preostala zaštita su dozvole datoteka. Koristite ovo samo u privremenim/testnim okruženjima poput virtualnog stroja.
