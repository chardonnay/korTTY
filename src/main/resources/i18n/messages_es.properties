ai.workflow.option.STRICT_MODE=Modo estricto (abortar ante error)
ai.workflow.option.STRICT_MODE.tooltip=Activa el modo estricto / de aborto en errores del lenguaje: el script se detiene en el primer error no controlado en lugar de continuar con un estado defectuoso.
ai.workflow.option.ERROR_TRAP_CLEANUP=Captura de errores y limpieza
ai.workflow.option.ERROR_TRAP_CLEANUP.tooltip=Añade una trampa de errores / bloque finally que informa de los fallos y limpia el estado temporal (archivos, montajes, procesos) incluso si el script se interrumpe.
ai.workflow.option.MEANINGFUL_EXIT_CODES=Códigos de salida significativos
ai.workflow.option.MEANINGFUL_EXIT_CODES.tooltip=Usa códigos de salida distintos y documentados por clase de fallo, para que los invocadores y planificadores puedan reaccionar al fallo exacto.
ai.workflow.option.LOGGING_VERBOSE=Registro (--verbose)
ai.workflow.option.LOGGING_VERBOSE.tooltip=Escribe mensajes de registro con marca de tiempo en stderr y añade una opción --verbose/-v para más detalle.
ai.workflow.option.CONFIG_BLOCK=Bloque de configuración para literales
ai.workflow.option.CONFIG_BLOCK.tooltip=Mueve todos los literales (rutas, hosts, paquetes) a un bloque de configuración claramente comentado al principio: los valores se ajustan en un solo lugar.
ai.workflow.option.END_SUMMARY=Resumen final
ai.workflow.option.END_SUMMARY.tooltip=Imprime al final un resumen de lo realizado, con contadores de éxitos y fallos.
ai.workflow.option.STYLE_GUIDE_CLEAN=Conforme a guía de estilo / linter
ai.workflow.option.STYLE_GUIDE_CLEAN.tooltip=Ajusta el script a la guía de estilo del lenguaje y lo mantiene limpio para el linter (p. ej. ShellCheck para Bash).
ai.workflow.option.PRECONDITION_CHECKS=Comprobaciones previas
ai.workflow.option.PRECONDITION_CHECKS.tooltip=Comprueba los comandos necesarios, los privilegios (root/sudo) y la conectividad antes de empezar el trabajo.
ai.workflow.option.IDEMPOTENCY=Idempotencia (omitir pasos completados)
ai.workflow.option.IDEMPOTENCY.tooltip=Detecta los pasos ya completados y los omite, de modo que el script puede volver a ejecutarse sin riesgo.
ai.workflow.option.SAFE_MODE=Modo seguro (--dry-run + confirmación)
ai.workflow.option.SAFE_MODE.tooltip=Añade una opción --dry-run que solo muestra las acciones previstas y pide confirmación antes de operaciones destructivas (desactivable con --yes).
ai.workflow.option.HELP_USAGE=--help y análisis de argumentos
ai.workflow.option.HELP_USAGE.tooltip=Añade un mensaje --help/usage y análisis de argumentos de línea de comandos para los valores configurables.
