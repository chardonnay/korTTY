settings.telemetry.header=Estadísticas de uso anónimo
settings.telemetry.summary=KorTTY puede recopilar estadísticas de uso anónimas para ayudar a mejorar la aplicación. La participación es voluntaria (opt-in), los datos no contienen información personal y se procesan exclusivamente en servidores en la UE (cumple con el RGPD, a través de Aptabase).
