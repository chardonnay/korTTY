ai.inputHardening.title=Endurecimiento de entrada
ai.inputHardening.enable=Endurecimiento de entrada (validar las entradas del script)
ai.inputHardening.enable.tooltip=Solicita a la IA que agregue un bloque de protección de validación de entrada al script: listas de parámetros permitidos y límites de longitud, comprobaciones de formato de archivo y tamaño máximo de archivo, advertencias de seguridad agregadas al archivo de registro del script y una anulación FORCE=1 / --force. El propio korTTY no realiza ninguna validación cuando se ejecuta el script.
ai.inputHardening.option.PARAM_VALIDATION=Listas de parámetros permitidos y límites de longitud
ai.inputHardening.option.PARAM_VALIDATION.tooltip=Valida cada parámetro: número exacto de parámetros, lista de caracteres permitidos por parámetro y límites de longitud; los caracteres de control y los metacaracteres de shell se rechazan (código de salida 64).
ai.inputHardening.option.FILE_CHECKS=Comprobaciones del formato del archivo de entrada
ai.inputHardening.option.FILE_CHECKS.tooltip=Verifica que cada archivo de entrada existe y es legible (código de salida 66) y que su formato de contenido es procesable, p. ej. rechazando archivos binarios (código de salida 65).
ai.inputHardening.option.FILE_SIZE_LIMIT=Máx. tamaño del archivo de entrada (variable de script)
ai.inputHardening.option.FILE_SIZE_LIMIT.tooltip=Añade una variable ajustable MAX_FILE_SIZE; el tamaño se comprueba desde los metadatos antes de leer contenido, los archivos mayores se rechazan (código de salida 65) y 0 significa ilimitado.
ai.inputHardening.option.SECURITY_LOGGING=Advertencias de seguridad para stderr y script log
ai.inputHardening.option.SECURITY_LOGGING.tooltip=Informa de cada infracción como advertencia SECURITY: con marca de tiempo en stderr y la añade también al archivo de registro propio del script, si existe.
ai.inputHardening.option.FORCE_OVERRIDE=FORCE=1 / --force anulación
ai.inputHardening.option.FORCE_OVERRIDE.tooltip=Con FORCE=1 en el entorno o con el parámetro --force, el script no bloquea: las infracciones se degradan a advertencias y se siguen notificando; las ejecuciones forzadas dejan un rastro completo.
ai.inputHardening.maxFileSize=Máx. tamaño de archivo:
ai.inputHardening.maxFileSize.tooltip=Límite de tamaño para archivos de entrada, generado en el script como MAX_FILE_SIZE. La protección comprueba los metadatos antes de leer el contenido; 0 significa sin límite.
ai.inputHardening.maxFileSize.hint=MB (0-1024; 0 = sin límite)
ai.inputHardening.saveDefault.tooltip=Recordar el endurecimiento de entrada y el límite de tamaño como predeterminados
