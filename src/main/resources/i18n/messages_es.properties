settings.security.masterPassword.info=La contraseña maestra se utiliza para cifrar todas las contraseñas de conexión almacenadas.\nSi cambia la contraseña maestra, todas las contraseñas almacenadas se volverán a cifrar automáticamente.
settings.security.masterPassword.requireOnStartup=Requerir contraseña maestra al inicio
settings.security.masterPassword.requireOnStartup.tooltip=Si está deshabilitado, no se mostrará ningún cuadro de diálogo de contraseña maestra al inicio.\n⚠️ ADVERTENCIA: Esto no es seguro, ya que los datos cifrados no se pueden descifrar sin ingresar la contraseña.
settings.security.masterPassword.warning=⚠️ ADVERTENCIA: Si esta opción está deshabilitada, las contraseñas y claves cifradas no se pueden cargar automáticamente al inicio. Debe ingresar manualmente la contraseña maestra cuando desee acceder a datos cifrados.
settings.security.masterPassword.skipPrompt=Desactivar la solicitud de contraseña maestra al inicio (inicio de sesión automático)
settings.security.masterPassword.skipPrompt.tooltip=korTTY desbloquea la bóveda automáticamente con una contraseña guardada, por lo que no se muestra ningún diálogo al inicio. Los datos cifrados (perfiles de IA, contraseñas SSH) siguen siendo utilizables, a diferencia de la opción anterior. Inseguro: solo para entornos de prueba o desechables.
settings.security.masterPassword.skipPrompt.warning=⚠️ ADVERTENCIA: Su contraseña maestra se almacena en el disco (solo ofuscada, no de forma segura). Cualquier persona con acceso a este equipo, a la carpeta ~/.kortty o a sus copias de seguridad puede descifrar TODAS las contraseñas, claves SSH y claves de API guardadas. La única protección restante son los permisos de archivo. Use esto solo en entornos de prueba o desechables como una máquina virtual.
settings.security.masterPassword.skipPrompt.confirm.title=¿Desactivar la contraseña maestra?
settings.security.masterPassword.skipPrompt.confirm.header=Esto hace que sus secretos guardados sean inseguros
settings.security.masterPassword.skipPrompt.confirm.content=korTTY almacenará su contraseña maestra en el disco (solo ofuscada) y se desbloqueará automáticamente en cada inicio. Cualquiera que pueda leer la carpeta ~/.kortty o una copia de seguridad podrá descifrar todas sus contraseñas, claves SSH y claves de API guardadas. Active esto solo en un entorno de prueba o desechable.
settings.security.masterPassword.skipPrompt.confirm.enable=Desactivar de todos modos
