settings.telemetry.header=Estadísticas de uso anónimo
settings.telemetry.summary=KorTTY puede recopilar estadísticas de uso anónimas para ayudar a mejorar la aplicación. La participación es voluntaria (opt-in), los datos no contienen información personal y se procesan exclusivamente en servidores en la UE (cumple con el RGPD, a través de Aptabase).
settings.telemetry.enable=Comparta datos de uso anónimos para ayudar a mejorar KorTTY
settings.telemetry.enable.tooltip=Cuando está habilitado, los eventos anónimos (inicio de la aplicación, uso de funciones, firmas de fallas y errores) se envían a los servidores de la UE. Puedes desactivar esto en cualquier momento.
settings.telemetry.learnMore.tooltip=Abra el capítulo del manual "Datos anónimos para la optimización de aplicaciones"
settings.telemetry.collected=Recopilados: nombres de eventos (por ejemplo, inicio de la aplicación, función utilizada), versión de la aplicación, sistema operativo y versión, idioma de la aplicación, ID de sesión anónima.
settings.telemetry.notCollected=Nunca recopilados: nombres de host, nombres de usuario, datos de conexión, rutas de archivos, fragmentos o contenido del terminal, claves, contraseñas, mensajes de error.
settings.telemetry.decisionDate=Su decisión se registró el {0}.
