telemetry.consent.message=KorTTY puede recopilar estadísticas de uso anónimas (inicio de aplicaciones, uso de funciones, fallas). No se recopilan datos personales y todo se procesa en servidores de la UE de conformidad con el RGPD.\n\nPuedes cambiar esta decisión en cualquier momento en Configuración → Privacidad.
