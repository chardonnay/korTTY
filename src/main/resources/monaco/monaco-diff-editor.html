<!doctype html>
<html data-monaco-mode="diff">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: data:; script-src 'self' file: 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' file: 'unsafe-inline'; worker-src blob:;">
  <link rel="stylesheet" href="monaco-host.css">
  <style>
    html, body, #diff-editor {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1e1e1e;
    }
    /* Marker bar in the line-decorations lane signalling a changed region carries a hover explanation. */
    .kortty-change-reason-bar {
      background: #e2c08d;
      width: 3px !important;
      margin-left: 3px;
    }
    /* Both applied only while the reviewer filtered the diff down to one finding: the picked change
       needs to stand out from the diff's own colouring of every other changed block. Semi-transparent
       so it reads on light and dark editor themes alike. */
    .kortty-change-reason-bar-focus {
      background: #3b82f6;
      width: 5px !important;
    }
    .kortty-change-reason-focus {
      background: rgba(59, 130, 246, 0.20);
    }
  </style>
</head>
<body>
  <div id="diff-editor"></div>
  <script>
    window.korttyStartupErrors = [];
    window.onerror = function(message, source, line, column, error) {
      window.korttyStartupErrors.push(String(message) + " at " + String(source) + ":" + String(line) + ":" + String(column));
      return false;
    };
  </script>
  <script src="monaco-host.js"></script>
</body>
</html>
