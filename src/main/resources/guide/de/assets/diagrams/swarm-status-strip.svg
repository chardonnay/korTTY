<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Swarm status strip — agent states</title>
  <desc id="desc">The animated orb strip above the swarm conversation: one orb per agent, colored and animated by state — queued, running, awaiting input, paused, unusually long, done, failed and cancelled — with the adaptive slow-detection rule, click-to-locate behavior and pause-aware timers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}
      .bg{fill:#07111d}
      .box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:12}
      .strip{fill:#0a1626;stroke:#38bdf8;stroke-width:2;rx:14}
      .title{font-size:28px;font-weight:700;fill:#f8fafc}
      .subtitle{font-size:14px;fill:#b9c8da}
      .small{font-size:13px;fill:#b9c8da}
      .state{font-size:15px;font-weight:700;fill:#f8fafc;text-anchor:middle}
      .hint{font-size:12px;fill:#8fa3b8;text-anchor:middle}
      .line{stroke:#67e8f9;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .secure{stroke:#f59e0b}
      .bold{font-weight:700}
      .chip{fill:#13243a;stroke:#2c4258;stroke-width:1.5;rx:13}
      .chiptext{font-size:13px;fill:#cdd9e8}
      .mark{stroke:#07111d;stroke-width:4;stroke-linecap:round;fill:none}
      @keyframes pulseGlow{0%,100%{opacity:.28}50%{opacity:.78}}
      @keyframes blinkRing{0%,100%{opacity:.15}50%{opacity:.95}}
      @keyframes ping{0%{transform:scale(1);opacity:.9}80%{transform:scale(1.55);opacity:0}100%{transform:scale(1.55);opacity:0}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      .pulse{animation:pulseGlow 1.6s ease-in-out infinite}
      .blink{animation:blinkRing 1.1s ease-in-out infinite}
      .ping{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
      .orbit{animation:orbit 2.4s linear infinite}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="52">AI Swarm Status Strip</text>
  <text class="subtitle" x="40" y="80">One orb per agent above the conversation — color and animation show each agent's state at a glance.</text>

  <rect class="strip" x="40" y="110" width="1200" height="212"/>

  <!-- Queued -->
  <circle cx="118" cy="196" r="40" fill="#455a64" opacity=".3"/>
  <circle cx="118" cy="196" r="28" fill="#78909c"/>
  <text class="state" x="118" y="262">Queued</text>
  <text class="hint" x="118" y="282">waiting for a slot</text>

  <!-- Running -->
  <circle class="pulse" cx="262" cy="196" r="42" fill="#1565c0" opacity=".4"/>
  <circle cx="262" cy="196" r="28" fill="#4f9cf0"/>
  <g class="orbit" style="transform-origin:262px 196px"><circle cx="262" cy="160" r="4.5" fill="#e6f3ff"/></g>
  <text class="state" x="262" y="262">Running</text>
  <text class="hint" x="262" y="282">elapsed time ticking</text>

  <!-- Awaiting input -->
  <circle cx="406" cy="196" r="40" fill="#e65100" opacity=".35"/>
  <circle class="blink" cx="406" cy="196" r="36" fill="none" stroke="#ff9800" stroke-width="3"/>
  <circle cx="406" cy="196" r="28" fill="#ff9800"/>
  <text class="mark" x="406" y="196" style="stroke:none;fill:#07111d;font-size:26px;font-weight:700;text-anchor:middle" transform="translate(0,9)">?</text>
  <text class="state" x="406" y="262">Awaiting input</text>
  <text class="hint" x="406" y="282">approval needed</text>

  <!-- Paused -->
  <circle cx="550" cy="196" r="40" fill="#512da8" opacity=".4"/>
  <circle cx="550" cy="196" r="28" fill="#b39ddb"/>
  <rect x="540" y="184" width="7" height="24" rx="2" fill="#0a1626"/>
  <rect x="553" y="184" width="7" height="24" rx="2" fill="#0a1626"/>
  <text class="state" x="550" y="262">Paused</text>
  <text class="hint" x="550" y="282">timer stopped</text>

  <!-- Unusually long -->
  <circle class="pulse" cx="694" cy="196" r="42" fill="#1565c0" opacity=".4"/>
  <circle class="ping" style="transform-origin:694px 196px" cx="694" cy="196" r="36" fill="none" stroke="#ffb300" stroke-width="3"/>
  <circle cx="694" cy="196" r="28" fill="#4f9cf0"/>
  <text class="state" x="694" y="262">Unusually long</text>
  <text class="hint" x="694" y="282">adaptive threshold</text>

  <!-- Done -->
  <circle cx="838" cy="196" r="40" fill="#2e7d32" opacity=".4"/>
  <circle cx="838" cy="196" r="28" fill="#4caf50"/>
  <path class="mark" d="M826 197 835 206 851 187"/>
  <text class="state" x="838" y="262">Done</text>
  <text class="hint" x="838" y="282">answer collected</text>

  <!-- Failed -->
  <circle cx="982" cy="196" r="40" fill="#c62828" opacity=".4"/>
  <circle cx="982" cy="196" r="28" fill="#ef5350"/>
  <path class="mark" d="M973 187 991 205 M991 187 973 205"/>
  <text class="state" x="982" y="262">Failed</text>
  <text class="hint" x="982" y="282">error in the row</text>

  <!-- Cancelled -->
  <circle cx="1126" cy="196" r="40" fill="#616161" opacity=".35"/>
  <circle cx="1126" cy="196" r="28" fill="#757575"/>
  <text class="state" x="1126" y="262">Cancelled</text>
  <text class="hint" x="1126" y="282">or skipped</text>

  <!-- Legend chips (as rendered under the orbs in the app) -->
  <rect class="chip" x="60" y="352" width="118" height="28"/>
  <circle cx="78" cy="366" r="6" fill="#4f9cf0"/>
  <text class="chiptext" x="92" y="371">2 running</text>
  <rect class="chip" x="188" y="352" width="112" height="28"/>
  <circle class="blink" cx="206" cy="366" r="6" fill="#ff9800"/>
  <text class="chiptext" x="220" y="371">1 waiting</text>
  <rect class="chip" x="310" y="352" width="112" height="28"/>
  <circle cx="328" cy="366" r="6" fill="#b39ddb"/>
  <text class="chiptext" x="342" y="371">1 paused</text>
  <rect class="chip" x="432" y="352" width="98" height="28"/>
  <circle cx="450" cy="366" r="6" fill="#4caf50"/>
  <text class="chiptext" x="464" y="371">3 done</text>
  <rect class="chip" x="540" y="352" width="102" height="28"/>
  <circle cx="558" cy="366" r="6" fill="#ef5350"/>
  <text class="chiptext" x="572" y="371">1 failed</text>

  <path class="line" d="M694 328 C694 372 630 380 630 424"/>

  <!-- Explainer cards -->
  <rect class="box" x="40" y="430" width="380" height="170"/>
  <text class="bold" x="64" y="464">Click to locate</text>
  <text class="small" x="64" y="492">While a run is active, clicking an orb</text>
  <text class="small" x="64" y="512">scrolls to and highlights that agent's row</text>
  <text class="small" x="64" y="532">in the Agents list. Hovering shows the</text>
  <text class="small" x="64" y="552">server name and elapsed time.</text>

  <rect class="box secure" x="440" y="430" width="380" height="170"/>
  <text class="bold" x="464" y="464">Adaptive slow detection</text>
  <text class="small" x="464" y="492">An agent is flagged when its elapsed time</text>
  <text class="small" x="464" y="512">exceeds max(60 s, 2 × median of finished</text>
  <text class="small" x="464" y="532">agents) — 180 s until enough agents have</text>
  <text class="small" x="464" y="552">finished. Paused and waiting agents are</text>
  <text class="small" x="464" y="572">never flagged.</text>

  <rect class="box" x="840" y="430" width="380" height="170"/>
  <text class="bold" x="864" y="464">Pause-aware timers</text>
  <text class="small" x="864" y="492">Elapsed timers stop while an agent is</text>
  <text class="small" x="864" y="512">paused and the paused time is subtracted,</text>
  <text class="small" x="864" y="532">so slow detection stays fair across</text>
  <text class="small" x="864" y="552">paused and running agents.</text>

  <text class="small" x="40" y="650">With many agents the orbs shrink and pack into rows; the strip stays readable from 1 to 50+ servers.</text>
  <text class="small" x="40" y="674">After the run the strip freezes at the final state so the result overview is preserved in the tab.</text>
</svg>
