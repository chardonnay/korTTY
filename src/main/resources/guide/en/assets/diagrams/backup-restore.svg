<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Backup and restore flow</title>
  <desc id="desc">User-driven backup export and import with password or GPG encryption.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}.bg{fill:#08111f}.panel{fill:#0e1b2c;stroke:#29445f;stroke-width:2;rx:18}.box{fill:#14243a;stroke:#38bdf8;stroke-width:2;rx:10}.sec{stroke:#f59e0b}.ok{stroke:#34d399}.title{font-size:28px;font-weight:700;fill:#f8fafc}.label{font-size:19px;font-weight:700;fill:#7dd3fc}.small{font-size:14px;fill:#b7c7d8}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1040" height="520"/>
  <text class="title" x="40" y="54">Backup and Restore Flow</text>
  <text class="small" x="40" y="82">Export and import are separate user-controlled actions around encrypted KorTTY state.</text>
  <rect class="panel" x="55" y="130" width="410" height="270"/>
  <text class="label" x="85" y="165">Create backup</text>
  <rect class="box" x="95" y="200" width="300" height="48"/><text x="135" y="230">Edit &gt; Create Backup</text>
  <rect class="box" x="95" y="270" width="140" height="54"/><text x="123" y="302">Password ZIP</text>
  <rect class="box sec" x="255" y="270" width="140" height="54"/><text x="294" y="302">GPG file</text>
  <path class="line" d="M245 248 V270"/><path class="line" d="M180 248 V270"/><path class="line" d="M310 248 V270"/>
  <rect class="box ok" x="340" y="430" width="360" height="50"/><text x="393" y="461">Backup stored outside config</text>
  <path class="line" d="M325 324 C350 390 420 410 520 430"/>
  <rect class="panel" x="575" y="130" width="410" height="270"/>
  <text class="label" x="605" y="165">Import backup</text>
  <rect class="box" x="615" y="200" width="300" height="48"/><text x="653" y="230">Edit &gt; Import Backup</text>
  <rect class="box sec" x="615" y="270" width="140" height="54"/><text x="655" y="302">Decrypt</text>
  <rect class="box ok" x="775" y="270" width="140" height="54"/><text x="803" y="302">Restore state</text>
  <path class="line" d="M765 248 V270"/><path class="line" d="M755 297 H775"/>
  <text class="small" x="615" y="365">Connections, credentials, settings, snippets, and related local configuration are restored from the selected encrypted backup.</text>
</svg>
