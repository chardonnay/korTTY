<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Credential and authentication flow</title>
  <desc id="desc">Encrypted local credential stores unlock values used by connection editing, quick connect, and SSH authentication.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}.bg{fill:#08111f}.panel{fill:#0e1b2c;stroke:#29445f;stroke-width:2;rx:18}.box{fill:#14243a;stroke:#38bdf8;stroke-width:2;rx:10}.sec{stroke:#f59e0b}.store{stroke:#34d399}.remote{stroke:#fb7185}.title{font-size:28px;font-weight:700;fill:#f8fafc}.label{font-size:19px;font-weight:700;fill:#7dd3fc}.small{font-size:14px;fill:#b9c8da}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1080" height="560"/>
  <text class="title" x="40" y="54">Credential and Authentication Flow</text>
  <text class="small" x="40" y="82">Secrets remain encrypted at rest and are decrypted only for the connection path that needs them.</text>
  <rect class="panel" x="55" y="130" width="370" height="315"/>
  <text class="label" x="85" y="165">Encrypted local storage</text>
  <rect class="box sec" x="95" y="200" width="270" height="50"/><text x="154" y="231">Master password</text>
  <rect class="box store" x="95" y="270" width="270" height="50"/><text x="164" y="301">credentials.xml</text>
  <rect class="box store" x="95" y="340" width="270" height="50"/><text x="176" y="371">ssh-keys.xml</text>
  <rect class="panel" x="500" y="130" width="250" height="315"/>
  <text class="label" x="530" y="165">Usage</text>
  <rect class="box" x="535" y="205" width="180" height="50"/><text x="574" y="236">Edit profile</text>
  <rect class="box" x="535" y="280" width="180" height="50"/><text x="573" y="311">Quick connect</text>
  <rect class="box" x="535" y="355" width="180" height="50"/><text x="571" y="386">SSH session</text>
  <rect class="box remote" x="825" y="260" width="200" height="70"/><text x="875" y="301">Remote server</text>
  <path class="line" d="M365 225 H535"/>
  <path class="line" d="M365 295 H535"/>
  <path class="line" d="M365 365 H535"/>
  <path class="line" d="M715 380 C780 380 780 300 825 295"/>
  <text class="small" x="88" y="495">Connection edit and Quick Connect reference local stores; SSH receives only the decrypted values needed for that session.</text>
</svg>
