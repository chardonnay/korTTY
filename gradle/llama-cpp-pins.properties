# see that workflow's `scope` job.
#
# tag/commit/sourceSha256 are the ACTIVE pin and must stay in lockstep; downloadLlamaCppSource
# fetches by commit and fails closed on any archive digest mismatch.
#
# Keep these three as plain `key = value` lines — llama-runtime.yml rewrites them by regex.

