# korTTY documentation manifest — the machine-checkable map between doc pages and
# the code/i18n/visuals they describe. Maintained by the `update-docs` skill
# (.claude/skills/update-docs) and validated in CI by scripts/doc-coverage.py and
# scripts/doc-links.py. See /AGENTS.md for the doc house style.
#
# Coverage model: every user-facing settings.* / menu.* i18n key (minus chrome
# suffixes) must be "owned" by exactly one EXISTING page via an `owns_i18n`
# prefix. doc-coverage.py reports any key with no owning page (undocumented) and
# any owned prefix that matches no key (stale).
schema_version: 1

# Mirrored from build.gradle.kts:12 by scripts/sync-version.py.
version: "2.2.2"

coverage:
  i18n_source: src/main/resources/i18n/messages_en.properties
  required_prefixes: ["settings.", "menu."]
  # Suffixes that mark chrome/strings, not documentable features.
  ignore_suffixes:
    - .tooltip
    - .title
    - .save
    - .cancel
    - .header
    - .ok
    - .close
    - .hint
    - .placeholder
    - .prompt
    - .description
    - .desc
    - .info
    - .note
    - .help
    - .label
    - .column
    - .tab
  # Individual non-feature keys with no documentation home.
  ignore_keys:
    - settings.nav.back
    - settings.nav.forward
    - menu.settings.title
    - menu.configuration

# Each page maps to the code/i18n it documents. `owns_i18n` are i18n key prefixes
# this page is the authoritative home for. `path` is relative to the repo root.
# `last_synced_ref` is the git commit the page was last reconciled against.
pages:
  # ---- Getting started -------------------------------------------------------
  - path: app-docs/site/docs/en/index.md
    owns_i18n: []
    owns_code: []
    diagrams: []
    screenshots: []
    last_synced_ref: "93470d6"
  - path: app-docs/site/docs/en/getting-started/installation.md
    owns_i18n: []
    owns_code: [build.gradle.kts]
    last_synced_ref: "93470d6"
  - path: app-docs/site/docs/en/getting-started/first-launch.md
    owns_i18n: []
    owns_code: [src/main/java/de/kortty/core/MasterPasswordManager.java]
    diagrams: [credential-flow.svg]
    last_synced_ref: "93470d6"
  - path: app-docs/site/docs/en/getting-started/main-window.md
    owns_i18n: []
    owns_code: [src/main/java/de/kortty/ui/MainWindow.java]
    diagrams: [architecture.svg]
    last_synced_ref: "93470d6"

  # ---- Reference: menus & shortcuts ------------------------------------------
  - path: app-docs/site/docs/en/reference/menu.md
    owns_i18n: ["menu."]
    owns_code: [src/main/java/de/kortty/ui/MainWindow.java]
    last_synced_ref: "93470d6"
  - path: app-docs/site/docs/en/reference/keyboard-shortcuts.md
    owns_i18n: []
    owns_code: [src/main/java/de/kortty/ui/MainWindow.java]
    last_synced_ref: "93470d6"

  # ---- Reference: settings (one page per tab; each owns its settings.<tab>.) --
  # NOTE: these pages are being authored in the content build-out. Until a page
  # file exists, doc-coverage.py reports its settings.* keys as undocumented.
  - path: app-docs/site/docs/en/reference/settings/index.md
    owns_i18n: [settings.preview., settings.nav.]
    owns_code: [src/main/java/de/kortty/ui/SettingsDialog.java, src/main/java/de/kortty/model/GlobalSettings.java]
    last_synced_ref: "93470d6"
  - path: app-docs/site/docs/en/reference/settings/appearance.md
