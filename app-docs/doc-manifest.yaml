# korTTY documentation manifest — the machine-checkable map between doc pages and
# the code/i18n/visuals they describe. Maintained by the `update-docs` skill
# (.claude/skills/update-docs) and validated in CI by scripts/doc-coverage.py and
# scripts/doc-links.py. See /AGENTS.md for the doc house style.
#
# Coverage model: every user-facing settings.* / menu.* i18n key (minus chrome
# suffixes) must be "owned" by exactly one EXISTING page via an `owns_i18n`
# prefix. doc-coverage.py reports any key with no owning page (undocumented) and
# any owned prefix that matches no key (stale).
schema_version: 1

# Mirrored from build.gradle.kts:12 by scripts/sync-version.py.
version: "2.5.2"

coverage:
  i18n_source: src/main/resources/i18n/messages_en.properties
  required_prefixes: ["settings.", "menu."]
  # Suffixes that mark chrome/strings, not documentable features.
  ignore_suffixes:
    - .tooltip
    - .title
    - .save
    - .cancel
    - .header
    - .ok
    - .close
    - .hint
    - .placeholder
    - .prompt
    - .description
    - .desc
    - .info
    - .note
    - .help
    - .label
    - .column
    - .tab
  # Individual non-feature keys with no documentation home.
  ignore_keys:
    - settings.nav.back
    - settings.nav.forward
    - menu.settings.title
    - menu.configuration

# Each page maps to the code/i18n it documents. `owns_i18n` are i18n key prefixes
# this page is the authoritative home for. `path` is relative to the repo root.
# `last_synced_ref` is the git commit the page was last reconciled against. Record the
# merge-base with main, not a branch HEAD: a branch hash dies in a squash merge and
# then silently disables the page's drift check. doc-links.py fails on dead refs.
pages:
