<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous telemetry consent and data flow</title>
  <desc id="desc">Consent gates an anonymous event pipeline with an in-memory queue, an offline spool that survives restarts, and delivery to Aptabase EU servers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}.bg{fill:#08111f}.panel{fill:#0e1b2c;stroke:#29445f;stroke-width:2;rx:18}.box{fill:#14243a;stroke:#38bdf8;stroke-width:2;rx:10}.sec{stroke:#f59e0b}.store{stroke:#34d399}.remote{stroke:#fb7185}.title{font-size:28px;font-weight:700;fill:#f8fafc}.label{font-size:19px;font-weight:700;fill:#7dd3fc}.small{font-size:14px;fill:#b9c8da}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1180" height="620"/>
  <text class="title" x="40" y="54">Anonymous Telemetry: Consent and Data Flow</text>
  <text class="small" x="40" y="82">Consent-gated and anonymous — without consent nothing is created, queued, or sent.</text>

  <rect class="panel" x="50" y="120" width="330" height="410"/>
  <text class="label" x="80" y="155">Consent (asked once, revocable)</text>
  <rect class="box sec" x="80" y="185" width="270" height="62"/>
  <text x="120" y="211">First launch</text>
  <text class="small" x="92" y="233">pre-selected next to password setup</text>
  <rect class="box sec" x="80" y="267" width="270" height="62"/>
  <text x="120" y="293">Existing installation</text>
  <text class="small" x="105" y="315">one-time prompt after unlock</text>
  <rect class="box sec" x="80" y="349" width="270" height="62"/>
  <text x="120" y="375">Settings &#8594; Privacy</text>
  <text class="small" x="130" y="397">change any time</text>
  <rect class="box sec" x="80" y="446" width="270" height="62"/>
  <text x="110" y="472">Consent stored locally</text>
  <text class="small" x="95" y="494">global-settings.xml (decision + date)</text>
  <path class="line" d="M215 411 V446"/>

  <rect class="panel" x="440" y="120" width="380" height="410"/>
  <text class="label" x="470" y="155">Telemetry pipeline (after consent)</text>
  <rect class="box" x="475" y="185" width="310" height="62"/>
  <text x="560" y="211">Anonymous events</text>
  <text class="small" x="512" y="233">event names, counts, flags &#8212; never PII</text>
  <rect class="box" x="475" y="300" width="310" height="62"/>
  <text x="565" y="326">In-memory queue</text>
  <text class="small" x="545" y="348">cap 200 &#183; batches of &#8804; 25</text>
  <rect class="box store" x="475" y="446" width="310" height="62"/>
  <text x="580" y="472">Offline spool</text>
  <text class="small" x="490" y="494">~/.kortty/telemetry-spool.json &#183; kept &#8804; 72 h</text>
  <path class="line" d="M630 247 V300"/>
  <path class="line" d="M580 362 V446"/>
  <text class="small" x="490" y="410">offline</text>
  <path class="line" d="M680 446 V362"/>
  <text class="small" x="692" y="410">online again /</text>
  <text class="small" x="692" y="428">next start</text>

  <path class="line" d="M380 340 H475"/>
  <text class="small" x="393" y="330">consent</text>

  <rect class="box remote" x="880" y="290" width="272" height="80"/>
  <text x="972" y="325">Aptabase EU</text>
  <text class="small" x="913" y="350">eu.aptabase.com &#183; GDPR-compliant</text>
  <path class="line" d="M785 331 H880"/>
  <text class="small" x="805" y="322">HTTPS</text>

  <text class="small" x="50" y="575">Opting out stops collection immediately and deletes both the queue and the offline spool. Events carry no hostnames, usernames, paths, or content.</text>
</svg>
