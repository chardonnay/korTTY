<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Session journal flow</title>
  <desc id="desc">Terminal output and typed input pass a redaction layer into the append-only capture log; the AI summarizer condenses log windows into journal entries; the journal document with markers, notes and screenshots renders as the self-contained timeline page and feeds the PDF, Markdown and HTML-bundle exports.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}.bg{fill:#07111d}.box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:16}.guard{stroke:#f59e0b}.ai{stroke:#8b5cf6}.out{stroke:#34d399}.title{font-size:28px;font-weight:700;fill:#f8fafc}.small{font-size:13px;fill:#b9c8da}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="54">Session Journal Flow</text>
  <text class="small" x="40" y="82">Capture, redaction, AI summarization, timeline rendering and export of one terminal session.</text>

  <rect class="box" x="50" y="140" width="200" height="96"/>
  <text x="78" y="176">Terminal tab</text>
  <text class="small" x="78" y="200">server output stream</text>
  <text class="small" x="78" y="220">typed input lines</text>

  <rect class="box guard" x="320" y="140" width="230" height="96"/>
  <text x="345" y="176">Redaction layer</text>
  <text class="small" x="345" y="200">password-prompt suppression</text>
  <text class="small" x="345" y="220">known-secret replacement</text>

  <rect class="box" x="620" y="140" width="250" height="96"/>
  <text x="645" y="176">Capture log</text>
  <text class="small" x="645" y="200">session-log .xml / .json / .yaml</text>
  <text class="small" x="645" y="220">seq ids · rotated parts · gzip</text>

  <rect class="box" x="620" y="290" width="250" height="70"/>
  <text x="645" y="322">Screenshots</text>
  <text class="small" x="645" y="344">screenshots/*.png</text>

  <rect class="box ai" x="960" y="140" width="270" height="96"/>
  <text x="985" y="176">AI summarizer</text>
  <text class="small" x="985" y="200">interval · line window / token budget</text>
  <text class="small" x="985" y="220">chunking · closing summary + title</text>

  <rect class="box" x="960" y="290" width="270" height="96"/>
  <text x="985" y="326">Journal document</text>
  <text class="small" x="985" y="350">journal.xml — entries, markers,</text>
  <text class="small" x="985" y="370">notes, screenshot references</text>

  <rect class="box out" x="620" y="470" width="270" height="96"/>
  <text x="645" y="506">Timeline page</text>
  <text class="small" x="645" y="530">journal.html — self-contained,</text>
  <text class="small" x="645" y="550">log panel with search</text>

  <rect class="box" x="240" y="470" width="270" height="96"/>
  <text x="265" y="506">Manager &amp; viewer</text>
  <text class="small" x="265" y="530">search · description · edit markers</text>
  <text class="small" x="265" y="550">rename / delete · live refresh</text>

  <rect class="box out" x="990" y="470" width="240" height="96"/>
  <text x="1015" y="506">Exports</text>
  <text class="small" x="1015" y="530">PDF · Markdown</text>
  <text class="small" x="1015" y="550">HTML bundle (zip)</text>

  <path class="line" d="M250 188 H320"/>
  <path class="line" d="M550 188 H620"/>
  <path class="line" d="M150 236 C150 325 400 325 620 325"/>
  <path class="line" d="M870 188 H960"/>
  <path class="line" d="M1095 236 V290"/>
  <path class="line" d="M870 325 H960"/>
  <path class="line" d="M1095 386 C1095 430 940 452 890 486"/>
  <path class="line" d="M745 236 C745 330 745 400 745 470"/>
  <path class="line" d="M620 518 H510"/>
  <path class="line" d="M890 540 H990"/>
  <path class="line" d="M1095 386 C1105 420 1110 440 1110 470"/>

  <text class="small" x="40" y="640">The redaction layer runs before anything is buffered: suppressed input is written only as a redacted placeholder. The capture log is append-only;</text>
  <text class="small" x="40" y="660">rotated parts are compressed, never deleted. The timeline page embeds the log for its slide-in panel and references screenshots relatively, so the</text>
  <text class="small" x="40" y="680">same page works in the app, on disk and inside the exported bundle.</text>
</svg>
