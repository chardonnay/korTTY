<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">KorTTY architecture</title>
  <desc id="desc">Simplified terminal-inspired architecture overview showing the JavaFX shell, interactive workspaces, application services, local state, and external systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}
      .bg{fill:#07111d}
      .grid{stroke:#14243a;stroke-width:1}
      .title{font-size:31px;font-weight:700;fill:#f8fafc}
      .subtitle{font-size:14px;fill:#b9c8da}
      .panel{fill:#0d1a2b;stroke:#263f5c;stroke-width:2;rx:18}
      .header{fill:#14243a;stroke:#263f5c;stroke-width:0;rx:18}
      .panelTitle{font-size:19px;font-weight:700;fill:#7dd3fc}
      .box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:10}
      .workspace{stroke:#a78bfa}
      .service{stroke:#60a5fa}
      .state{stroke:#34d399}
      .secure{stroke:#f59e0b}
      .external{stroke:#fb7185}
      .label{font-size:15px;font-weight:700;fill:#f8fafc}
      .detail{font-size:12px;fill:#b9c8da}
      .note{font-size:13px;fill:#93a8bd}
      .line{stroke:#67e8f9;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .thin{stroke-width:1.7}
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <path class="grid" d="M 0 120 H 1280 M 0 240 H 1280 M 0 360 H 1280 M 0 480 H 1280 M 0 600 H 1280 M 160 0 V 760 M 320 0 V 760 M 480 0 V 760 M 640 0 V 760 M 800 0 V 760 M 960 0 V 760 M 1120 0 V 760" opacity="0.24"/>

  <text class="title" x="44" y="54">KorTTY Architecture</text>
  <text class="subtitle" x="44" y="82">Compact system view: UI shell, app designs, workspaces, services, local state, and external systems.</text>

  <rect class="panel" x="95" y="120" width="1090" height="118"/>
  <rect class="header" x="95" y="120" width="1090" height="50"/>
  <text class="panelTitle" x="128" y="152">JavaFX application shell</text>
  <rect class="box" x="135" y="185" width="160" height="34"/>
  <text class="label" x="166" y="207">Main window</text>
  <rect class="box" x="335" y="185" width="160" height="34"/>
  <text class="label" x="362" y="207">Menus + dialogs</text>
  <rect class="box" x="535" y="185" width="160" height="34"/>
  <text class="label" x="568" y="207">Tab area</text>
  <rect class="box" x="735" y="185" width="160" height="34"/>
  <text class="label" x="769" y="207">Dashboard</text>
  <rect class="box" x="935" y="185" width="160" height="34"/>
  <text class="label" x="966" y="207">App designs</text>

  <rect class="panel" x="80" y="300" width="330" height="225"/>
  <rect class="header" x="80" y="300" width="330" height="50"/>
  <text class="panelTitle" x="112" y="332">Interactive workspaces</text>
  <rect class="box workspace" x="115" y="372" width="250" height="45"/>
  <text class="label" x="177" y="399">Terminal tabs</text>
  <rect class="box workspace" x="115" y="438" width="250" height="45"/>
  <text class="label" x="168" y="465">SFTP + snippets</text>

  <rect class="panel" x="475" y="300" width="330" height="225"/>
  <rect class="header" x="475" y="300" width="330" height="50"/>
  <text class="panelTitle" x="507" y="332">Application services</text>
  <rect class="box service" x="510" y="365" width="250" height="42"/>
  <text class="label" x="563" y="391">Connection flow</text>
  <rect class="box service" x="510" y="421" width="250" height="42"/>
  <text class="label" x="548" y="447">AI profiles + chats</text>
  <rect class="box service" x="510" y="477" width="250" height="32"/>
  <text class="detail" x="532" y="498">JobScheduler, formatter, design CSS</text>

  <rect class="panel" x="870" y="300" width="330" height="225"/>
  <rect class="header" x="870" y="300" width="330" height="50"/>
  <text class="panelTitle" x="902" y="332">Local state</text>
  <rect class="box state" x="905" y="365" width="250" height="42"/>
  <text class="label" x="947" y="391">Configuration XML</text>
  <rect class="box secure" x="905" y="421" width="250" height="42"/>
  <text class="label" x="942" y="447">Encrypted secrets</text>
  <rect class="box state" x="905" y="477" width="250" height="32"/>
  <text class="detail" x="930" y="498">projects, snippets, chats, app design</text>

  <rect class="panel" x="155" y="590" width="970" height="86"/>
  <rect class="box external" x="205" y="615" width="210" height="38"/>
  <text class="label" x="258" y="640">Remote hosts</text>
  <rect class="box external" x="535" y="615" width="210" height="38"/>
  <text class="label" x="590" y="640">AI endpoints</text>
  <rect class="box external" x="865" y="615" width="210" height="38"/>
  <text class="label" x="911" y="640">Local tools/plugins</text>

  <path class="line" d="M 740 219 V 300"/>
  <path class="line" d="M 240 219 V 300"/>
  <path class="line" d="M 990 219 V 300"/>
  <path class="line thin" d="M 245 483 V 615"/>
  <path class="line thin" d="M 635 509 V 615"/>
  <path class="line thin" d="M 1035 509 V 615"/>
  <path class="line thin" d="M 410 413 H 510"/>
  <path class="line thin" d="M 760 442 H 905"/>

  <text class="note" x="190" y="718">Persistent state stays local. Secrets are encrypted before storage. External systems are reached only through configured workflows.</text>
</svg>
