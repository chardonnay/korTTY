<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">KorTTY layered architecture</title>
  <desc id="desc">Layered architecture showing the JavaFX shell, interactive workspaces, application and browser-backed services, embedded llama.cpp inference, RAG knowledge stores, local persisted state, and configured external systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}
      .bg{fill:#07111d}
      .grid{stroke:#14243a;stroke-width:1}
      .panel{fill:#0d1a2b;stroke:#263f5c;stroke-width:2;rx:18}
      .header{fill:#14243a;rx:18}
      .box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:10}
      .workspace{stroke:#a78bfa}
      .service{stroke:#60a5fa}
      .render{stroke:#34d399}
      .state{stroke:#22c55e}
      .secure{stroke:#f59e0b}
      .external{stroke:#fb7185}
      .title{font-size:30px;font-weight:700;fill:#f8fafc}
      .subtitle{font-size:14px;fill:#b9c8da}
      .panelTitle{font-size:18px;font-weight:700;fill:#7dd3fc}
      .label{font-size:15px;font-weight:700;fill:#f8fafc}
      .detail{font-size:12px;fill:#b9c8da}
      .note{font-size:13px;fill:#93a8bd}
      .line{stroke:#67e8f9;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <path class="grid" d="M 0 120 H 1280 M 0 240 H 1280 M 0 360 H 1280 M 0 480 H 1280 M 0 600 H 1280 M 160 0 V 720 M 320 0 V 720 M 480 0 V 720 M 640 0 V 720 M 800 0 V 720 M 960 0 V 720 M 1120 0 V 720" opacity="0.25"/>

  <text class="title" x="42" y="52">KorTTY Layered Architecture</text>
  <text class="subtitle" x="42" y="80">JavaFX owns the UI; services coordinate SSH, embedded AI, bounded RAG, local state, configured endpoints and lazy browser features.</text>

  <rect class="panel" x="85" y="110" width="1110" height="115"/>
  <rect class="header" x="85" y="110" width="1110" height="45"/>
  <text class="panelTitle" x="115" y="139">JavaFX application shell</text>
  <rect class="box" x="125" y="172" width="165" height="34"/><text class="label" x="156" y="194">Main window</text>
  <rect class="box" x="340" y="172" width="165" height="34"/><text class="label" x="368" y="194">Menus + dialogs</text>
  <rect class="box" x="555" y="172" width="165" height="34"/><text class="label" x="589" y="194">Tab workspace</text>
  <rect class="box" x="770" y="172" width="165" height="34"/><text class="label" x="805" y="194">Dashboard</text>
  <rect class="box" x="985" y="172" width="165" height="34"/><text class="label" x="1018" y="194">App designs</text>

  <rect class="panel" x="40" y="280" width="350" height="255"/>
  <rect class="header" x="40" y="280" width="350" height="48"/>
  <text class="panelTitle" x="70" y="310">Interactive workspaces</text>
  <rect class="box workspace" x="75" y="350" width="280" height="45"/>
  <text class="label" x="144" y="378">Terminal + SFTP</text>
  <rect class="box workspace" x="75" y="414" width="280" height="45"/>
  <text class="label" x="126" y="442">Snippet + Monaco editor</text>
  <rect class="box workspace" x="75" y="478" width="280" height="38"/>
  <text class="detail" x="101" y="502">AI chats, local models, knowledge stores</text>

  <rect class="panel" x="465" y="280" width="350" height="255"/>
  <rect class="header" x="465" y="280" width="350" height="48"/>
  <text class="panelTitle" x="495" y="310">Application services</text>
  <rect class="box service" x="500" y="350" width="280" height="45"/>
  <text class="label" x="557" y="378">SSH + JobScheduler</text>
  <rect class="box service" x="500" y="414" width="280" height="45"/>
  <text class="label" x="538" y="442">AI routing + llama.cpp</text>
  <rect class="box render" x="500" y="478" width="280" height="38"/>
  <text class="detail" x="522" y="502">RAG indexing + renderers + exports</text>

  <rect class="panel" x="890" y="280" width="350" height="255"/>
  <rect class="header" x="890" y="280" width="350" height="48"/>
  <text class="panelTitle" x="920" y="310">Local state</text>
  <rect class="box state" x="925" y="350" width="280" height="45"/>
  <text class="label" x="990" y="378">XML + JSON configuration</text>
  <rect class="box secure" x="925" y="414" width="280" height="45"/>
  <text class="label" x="1001" y="442">Encrypted secrets</text>
  <rect class="box state" x="925" y="478" width="280" height="38"/>
  <text class="detail" x="945" y="502">projects, chats, signed catalog + HNSW</text>

  <rect class="panel" x="95" y="590" width="1090" height="78"/>
  <rect class="box external" x="135" y="610" width="210" height="38"/><text class="label" x="188" y="635">Remote hosts</text>
  <rect class="box external" x="400" y="610" width="210" height="38"/><text class="label" x="434" y="635">AI endpoints + HF</text>
  <rect class="box external" x="665" y="610" width="210" height="38"/><text class="label" x="692" y="635">llama.cpp + Qdrant</text>
  <rect class="box render" x="930" y="610" width="210" height="38"/><text class="detail" x="949" y="634">Monaco, Mermaid, MathJax</text>

  <path class="line" d="M 210 206 V 280"/>
  <path class="line" d="M 640 206 V 280"/>
  <path class="line" d="M 1065 206 V 280"/>
  <path class="line" d="M 390 420 H 500"/>
  <path class="line" d="M 780 437 H 925"/>
  <path class="line" d="M 215 535 V 610"/>
  <path class="line" d="M 640 535 V 570 H 505 V 610"/>
  <path class="line" d="M 1065 535 V 610"/>
  <path class="dash" d="M 780 497 C 850 560 940 560 1035 610"/>

  <text class="note" x="105" y="700">Model leases, atomic HNSW snapshots and lazy browser renderers keep native inference, retrieved data and UI resources independently bounded.</text>
</svg>
