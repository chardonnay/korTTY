<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Connection flow</title>
  <desc id="desc">KorTTY connection flow from user entry through saved settings, authentication, SSH or Mosh transport setup, terminal color handling, optional terminal effects, and final terminal display.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ba6bf"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}
      .bg{fill:#07111d}
      .grid{stroke:#14243a;stroke-width:1}
      .title{font-size:30px;font-weight:700;fill:#f8fafc}
      .subtitle{font-size:14px;fill:#b9c8da}
      .lane{fill:#0d1a2b;stroke:#263f5c;stroke-width:2;rx:18}
      .laneHeader{fill:#14243a;stroke:#263f5c;stroke-width:0;rx:18}
      .laneTitle{font-size:18px;font-weight:700;fill:#7dd3fc}
      .box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:10}
      .profile{stroke:#60a5fa}
      .security{stroke:#f59e0b}
      .transport{stroke:#a78bfa}
      .remote{stroke:#34d399}
      .effect{stroke:#fb7185}
      .label{font-size:15px;font-weight:700;fill:#f8fafc}
      .detail{font-size:12px;fill:#b9c8da}
      .note{font-size:13px;fill:#93a8bd}
      .line{stroke:#67e8f9;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .softLine{stroke:#8ba6bf;stroke-width:1.8;fill:none;stroke-dasharray:6 6;marker-end:url(#softArrow)}
      .branchLabel{font-size:13px;font-weight:700;fill:#c4b5fd}
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <path class="grid" d="M 0 120 H 1280 M 0 240 H 1280 M 0 360 H 1280 M 0 480 H 1280 M 0 600 H 1280 M 160 0 V 720 M 320 0 V 720 M 480 0 V 720 M 640 0 V 720 M 800 0 V 720 M 960 0 V 720 M 1120 0 V 720" opacity="0.28"/>

  <text class="title" x="44" y="54">Connection Flow</text>
  <text class="subtitle" x="44" y="82">SSH and Mosh use different setup paths, but both end as one terminal stream in the active KorTTY tab.</text>

  <rect class="lane" x="40" y="130" width="250" height="430"/>
  <rect class="laneHeader" x="40" y="130" width="250" height="52"/>
  <text class="laneTitle" x="70" y="163">Start</text>
  <rect class="box" x="70" y="215" width="190" height="62"/>
  <text class="label" x="108" y="241">User action</text>
  <text class="detail" x="94" y="262">Quick Connect, tab, or group</text>
  <rect class="box profile" x="70" y="345" width="190" height="62"/>
  <text class="label" x="102" y="371">Open terminal tab</text>
  <text class="detail" x="92" y="392">prepare split target if needed</text>

  <rect class="lane" x="335" y="130" width="250" height="430"/>
  <rect class="laneHeader" x="335" y="130" width="250" height="52"/>
  <text class="laneTitle" x="365" y="163">Profile and auth</text>
  <rect class="box profile" x="365" y="215" width="190" height="62"/>
  <text class="label" x="398" y="241">Load settings</text>
  <text class="detail" x="386" y="262">host, protocol, colors, effect</text>
  <rect class="box security" x="365" y="345" width="190" height="62"/>
  <text class="label" x="398" y="371">Resolve auth</text>
  <text class="detail" x="390" y="392">password, key, temporary key</text>

  <rect class="lane" x="630" y="130" width="290" height="430"/>
  <rect class="laneHeader" x="630" y="130" width="290" height="52"/>
  <text class="laneTitle" x="660" y="163">Transport setup</text>
  <rect class="box transport" x="670" y="205" width="210" height="58"/>
  <text class="label" x="726" y="230">SSH over TCP</text>
  <text class="detail" x="714" y="250">handshake and channel</text>
  <rect class="box transport" x="670" y="315" width="210" height="58"/>
  <text class="label" x="735" y="340">Mosh setup</text>
  <text class="detail" x="695" y="360">SSH starts mosh-server</text>
  <rect class="box transport" x="670" y="425" width="210" height="58"/>
  <text class="label" x="727" y="450">UDP session</text>
  <text class="detail" x="707" y="470">port and key from server</text>

  <rect class="lane" x="965" y="130" width="275" height="430"/>
  <rect class="laneHeader" x="965" y="130" width="275" height="52"/>
  <text class="laneTitle" x="995" y="163">Terminal output</text>
  <rect class="box remote" x="1000" y="205" width="205" height="58"/>
  <text class="label" x="1052" y="230">Remote server</text>
  <text class="detail" x="1032" y="250">shell stream and control data</text>
  <rect class="box profile" x="1000" y="295" width="205" height="58"/>
  <text class="label" x="1046" y="320">Color handling</text>
  <text class="detail" x="1025" y="340">ANSI/TrueColor toggle</text>
  <rect class="box effect" x="1000" y="385" width="205" height="58"/>
  <text class="label" x="1032" y="410">Optional effect</text>
  <text class="detail" x="1018" y="430">appearance, overlay, wrapper</text>
  <rect class="box" x="1000" y="475" width="205" height="58"/>
  <text class="label" x="1038" y="500">SithTermFX view</text>
  <text class="detail" x="1032" y="520">displayed in active tab</text>

  <path class="line" d="M 165 277 V 345"/>
  <path class="line" d="M 260 246 H 365"/>
  <path class="line" d="M 460 277 V 345"/>
  <path class="line" d="M 555 376 C 610 376 620 234 670 234"/>
  <path class="line" d="M 555 376 H 670"/>
  <text class="branchLabel" x="602" y="241">SSH</text>
  <text class="branchLabel" x="600" y="362">Mosh</text>
  <path class="line" d="M 880 234 H 1000"/>
  <path class="line" d="M 880 344 C 940 344 942 246 1000 246"/>
  <path class="line" d="M 775 373 V 425"/>
  <path class="softLine" d="M 880 454 C 955 454 955 282 1000 264"/>
  <path class="line" d="M 1102 263 V 295"/>
  <path class="line" d="M 1102 353 V 385"/>
  <path class="line" d="M 1102 443 V 475"/>

  <rect class="lane" x="215" y="600" width="850" height="72"/>
  <text class="note" x="245" y="631">Terminal color handling is stored globally and per connection; disabling it ignores color SGR sequences only.</text>
  <text class="note" x="245" y="654">Effects stay in the display path. Reconnect returns through profile/auth resolution before creating a new stream.</text>
</svg>
