<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Teamwork sync</title>
  <desc id="desc">How shared connections sync between a team source and local korTTY.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6f3ff;font-size:16px}.bg{fill:#07111d}.box{fill:#13243a;stroke:#38bdf8;stroke-width:2;rx:12}.title{font-size:28px;font-weight:700;fill:#f8fafc}.subtitle{font-size:14px;fill:#b9c8da}.small{font-size:13px;fill:#b9c8da}.line{stroke:#67e8f9;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-dasharray:7 7;fill:none}.secure{stroke:#f59e0b}.state{stroke:#34d399}.ai{stroke:#a78bfa}.external{stroke:#fb7185}.service{stroke:#60a5fa}</style></defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="title" x="40" y="52">Teamwork Sync Flow</text>
  <text class="subtitle" x="40" y="80">Shared connections sync bidirectionally between a team source and your local korTTY list.</text>

  <rect class="box state" x="60" y="250" width="230" height="96"/>
  <text x="100" y="290">Local connections</text>
  <text class="small" x="100" y="314">korTTY</text>
  <text class="small" x="100" y="334">on-disk list</text>

  <rect class="box service" x="400" y="250" width="240" height="96"/>
  <text x="440" y="285">Teamwork source</text>
  <text class="small" x="440" y="309">Git repo or</text>
  <text class="small" x="440" y="329">shared file</text>

  <rect class="box" x="760" y="120" width="230" height="90"/>
  <text x="800" y="160">Sync</text>
  <text class="small" x="800" y="184">poll on check interval</text>

  <rect class="box external" x="760" y="390" width="230" height="96"/>
  <text x="800" y="430">Team peers</text>
  <text class="small" x="800" y="454">push and pull</text>
  <text class="small" x="800" y="474">shared changes</text>

  <rect class="box state" x="400" y="430" width="240" height="96"/>
  <text x="440" y="470">Merge / apply</text>
  <text class="small" x="440" y="494">into local list</text>

  <path class="line" d="M290 286 H400"/>
  <text class="small" x="305" y="276">1. push local</text>
  <path class="line" d="M400 320 H290"/>
  <text class="small" x="305" y="342">4. updated</text>

  <path class="line" d="M610 250 C680 215 700 180 760 165"/>
  <text class="small" x="640" y="200">2. check interval</text>

  <path class="line" d="M760 175 C690 360 1010 380 990 438"/>
  <text class="small" x="1000" y="300">3a. fetch peers</text>

  <path class="line" d="M870 390 C870 370 760 360 640 360"/>
  <text class="small" x="700" y="352">3b. incoming changes</text>

  <path class="line" d="M520 430 V346"/>
  <text class="small" x="528" y="395">5. apply</text>

  <path class="dash" d="M175 250 C175 150 760 120 875 120"/>
  <text class="small" x="300" y="135">Bidirectional sync keeps every team member's connection list in agreement.</text>
</svg>