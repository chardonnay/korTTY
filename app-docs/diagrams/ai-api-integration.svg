<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">KorTTY AI API integration</title>
  <desc id="desc">AI request flow from terminal or snippet editor through local profile handling to OpenAI-compatible or LM Studio endpoints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e5f2ff;font-size:16px}.bg{fill:#07111d}.panel{fill:#0d1a2b;stroke:#274763;stroke-width:2;rx:18}.box{fill:#132238;stroke:#38bdf8;stroke-width:2;rx:10}.ai{stroke:#a78bfa}.store{stroke:#34d399}.sec{stroke:#f59e0b}.ext{stroke:#fb7185}.title{font-size:30px;font-weight:700;fill:#f8fafc}.label{font-size:19px;font-weight:700;fill:#7dd3fc}.small{font-size:14px;fill:#b8c7d9}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}.muted{stroke:#60758d;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1180" height="700"/>
  <text class="title" x="40" y="54">AI API Integration</text>
  <text class="small" x="40" y="82">Profile selection, model resolution, skill prompts, quotas, and result handling stay in KorTTY.</text>

  <rect class="panel" x="40" y="125" width="300" height="420"/>
  <text class="label" x="70" y="160">User entry points</text>
  <rect class="box" x="75" y="195" width="230" height="54"/><text x="109" y="227">Terminal selection</text>
  <rect class="box" x="75" y="275" width="230" height="54"/><text x="121" y="307">AI result chat</text>
  <rect class="box" x="75" y="355" width="230" height="54"/><text x="110" y="387">Snippet editor AI</text>
  <rect class="box" x="75" y="435" width="230" height="54"/><text x="103" y="467">Terminal AI Agent</text>

  <rect class="panel" x="390" y="125" width="370" height="420"/>
  <text class="label" x="420" y="160">KorTTY AI pipeline</text>
  <rect class="box ai" x="430" y="195" width="290" height="52"/><text x="478" y="227">Preview + Prompt Builder</text>
  <rect class="box ai" x="430" y="260" width="290" height="52"/><text x="487" y="292">LM Studio Auto Model</text>
  <rect class="box ai" x="430" y="325" width="290" height="52"/><text x="485" y="357">Skills + Internet Gate</text>
  <rect class="box ai" x="430" y="390" width="290" height="52"/><text x="492" y="422">HTTP AI Service</text>
  <rect class="box ai" x="430" y="455" width="290" height="52"/><text x="468" y="487">Sanitize + Record Usage</text>

  <rect class="panel" x="810" y="125" width="320" height="420"/>
  <text class="label" x="840" y="160">Local data / endpoint</text>
  <rect class="box store" x="850" y="195" width="240" height="52"/><text x="900" y="227">AI profiles</text>
  <rect class="box sec" x="850" y="260" width="240" height="52"/><text x="884" y="292">Encrypted API keys</text>
  <rect class="box store" x="850" y="325" width="240" height="52"/><text x="885" y="357">Quotas + saved chats</text>
  <rect class="box store" x="850" y="390" width="240" height="52"/><text x="906" y="422">AI Skills</text>
  <rect class="box ext" x="850" y="455" width="240" height="52"/><text x="874" y="487">OpenAI-compatible API</text>

  <path class="line" d="M305 222 H430"/>
  <path class="line" d="M305 302 H430"/>
  <path class="line" d="M305 382 H430"/>
  <path class="line" d="M305 462 H430"/>
  <path class="line" d="M720 286 H850"/>
  <path class="line" d="M720 351 H850"/>
  <path class="line" d="M720 416 H850"/>
  <path class="line" d="M720 481 H850"/>
  <path class="muted" d="M850 221 C790 221 790 221 720 221"/>
  <text class="small" x="74" y="602">Auto mode asks LM Studio for loaded LLMs directly before each real request.</text>
  <text class="small" x="74" y="628">Snippet AI does not expose internet tools; terminal-agent web tools are gated by task intent.</text>
</svg>
