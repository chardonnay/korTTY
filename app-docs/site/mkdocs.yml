# Shared MkDocs config for the korTTY Guide.
# Per-language entrypoints (mkdocs.en.yml / mkdocs.de.yml) INHERIT this file and
# override docs_dir, site_dir, theme.language and the plugins list (search lang).
#
# Built into a fully OFFLINE, self-contained site that loads from a jar:/file:
# base URL inside korTTY's WebView (Help -> Anleitung) AND on GitHub Pages.

site_name: korTTY Guide
site_description: >-
  Complete reference for korTTY — every feature, setting and tool of the
  cross-platform JavaFX SSH client, explained in detail.
site_author: korTTY
copyright: MIT-licensed · korTTY documentation

# CRITICAL for offline: emit real page.html files with RELATIVE links/assets so
# the site resolves under a jar:/file: origin (no leading-"/" absolute roots).
use_directory_urls: false

# A link to a heading that does not exist is reported by MkDocs as INFO by default,
# which is invisible in a normal build — 17 links in the German guide pointed at the
# untranslated English slug and silently landed the reader at the top of the page.
# Promoted to a warning so `mkdocs build --strict` (how build-docs-site.py runs)
# fails on it. See the anchor post-pass in scripts/translate_docs.py.
validation:
  links:
    anchors: warn
  # The nav lives in this shared file, but mkdocs.de.yml overrides it with the
  # translated section labels — two lists that must list the same pages. A page
  # added to one and forgotten in the other is INFO by default, i.e. invisible;
  # promoted so `mkdocs build --strict` fails instead of quietly dropping the
  # page out of the German sidebar.
  nav:
    omitted_files: warn
    not_found: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  font: false # CRITICAL offline: no Google Fonts CDN — fonts are self-hosted via kortty.css
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark "terminal" scheme matching the SVG diagram palette (#07111d / #38bdf8 / #67e8f9).
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/stylesheets/kortty.css

# Click-to-enlarge for screenshots and diagrams. A file rather than an inline
# block in overrides/main.html: inline would be copied into all 57 pages of both
# language trees, and the segment extractor would have to learn to skip it.
extra_javascript:
  - assets/javascripts/kt-zoom.js

extra:
  # Single source of truth = build.gradle.kts:12, injected at build time.
  # Falls back to 'dev' for ad-hoc local builds. Rendered in the footer/hero
  # via the theme (config.extra.kortty_version) — never hard-typed in prose.
  kortty_version: !ENV [KORTTY_VERSION, "dev"]
  generator: false
  # Truthy so Material renders the header language selector (overrides/partials/
  # alternate.html computes the per-page EN<->DE counterpart link).
  alternate:
    - name: English
      link: en
      lang: en
    - name: Deutsch
      link: de
      lang: de
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chardonnay/korTTY
      name: korTTY on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.smartsymbols
  # Inline Material/Octicons/FontAwesome icons as SVG (offline-safe, no CDN).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Nav is shared: both docs/en and docs/de mirror the same file layout. Only the
# SECTION labels ("Reference", "Settings", …) come from this list rather than from
# a page title, so mkdocs.de.yml repeats the nav with those labels translated —
# keep the two lists in sync (guarded by validation.nav.omitted_files above).
nav:
  - Home: index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/building-packages.md
      - getting-started/first-launch.md
      - getting-started/main-window.md
  - Reference:
      - reference/menu.md
      - reference/keyboard-shortcuts.md
      - reference/architecture.md
      - reference/config-files.md
      - reference/enterprise-policy.md
      - Settings:
          - reference/settings/index.md
          - reference/settings/appearance.md
          - reference/settings/colors.md
          - reference/settings/terminal.md
          - reference/settings/window.md
          - reference/settings/resources.md
          - reference/settings/logging.md
          - reference/settings/export.md
          - reference/settings/backup.md
          - reference/settings/updates.md
          - reference/settings/security.md
          - reference/settings/language.md
          - reference/settings/translation.md
          - reference/settings/video.md
          - reference/settings/ai.md
          - reference/settings/ai-skills.md
          - reference/settings/sftp.md
          - reference/settings/editor.md
          # Section index page (navigation.indexes): the label links to
          # snippet-editor/index.md and carries the two hardening references,
          # which document the AI panels of that editor.
          - Snippet editor:
              - reference/settings/snippet-editor/index.md
              - reference/hardening-options.md
              - reference/input-hardening.md
  - Features:
      - features/connections.md
      - features/terminal.md
      - features/tunnels.md
      - features/jump-server.md
      - features/sftp.md
      - features/file-browser.md
      - features/snippets.md
      - features/jobscheduler.md
      - features/projects.md
      - features/teamwork.md
      - features/ai-assistant.md
      - features/local-models.md
      - features/rag.md
      - features/ai-tools.md
      - features/ai-swarm.md
      - features/security.md
      - features/backup.md
      - features/recording.md
      - features/session-journal.md
      - features/ascii-art.md
      - features/terminal-effect-plugins.md
      - features/i18n.md
  - About:
      - about/release-notes.md
      - about/feedback.md
      - about/anonymous-data.md
